// The world: tower tick loop, forces, upgrades, spawning, scoring.
// Ported from Kiomet common/src/chunk.rs, common/src/chunk/event.rs,
// common/src/chunk/maintenance.rs, server/src/world.rs, server/src/service.rs.




const key = (x, y) => y * WORLD_SIZE + x;
const kOf = (id) => key(id.x, id.y);

class Tower {
    constructor(x, y, type) {
        this.x = x; this.y = y;
        this.type = type;
        this.owner = null;
        this.units = new Units();
        this.delay = 0;
        this.inbound = [];
        this.outbound = [];
        this.supply = null;
        this.flash = 0;
        this.hit = 0;
    }
    get active() { return this.delay === 0; }
    get id() { return { x: this.x, y: this.y }; }
    get canDestroy() { return this.inbound.length === 0 && this.owner === null; }
    forceUnits() { return this.units.forceUnits(this.type); }
    takeForceUnits() {
        const f = this.forceUnits();
        for (const [u, c] of f.counts()) this.units.subtract(u, c);
        return f;
    }
    unitGeneration(u) {
        if (u !== SHIELD && this.units.hasRuler()) return null;
        return TOWER[this.type].genPeriod(u);
    }
    generatesMobile() {
        return UNITS.some((_, u) => isMobile(u, this.type) && this.unitGeneration(u) != null);
    }
    setOwner(owner) {
        if (this.owner === owner) return;
        if (this.owner !== null) this.supply = null;
        this.owner = owner;
    }
}

class Player {
    constructor(id, name, opts = {}) {
        this.id = id;
        this.name = name;
        this.alive = false;
        this.bot = !!opts.bot;
        this.allies = new Set();
        this.newAllies = new Set();
        this.towers = new Set();
        this.score = 0;
        this.towerCounts = {};
        this.rulerKey = null;
        this.deathReason = null;
        this.spawnCooldown = 0;
        this.rank = opts.rank || 0;
        this.botState = {
            ambition: 8 + Math.floor(Math.random() * 5),
            war: null,
            quitAt: 0,
        };
    }
}

class Game {
    constructor(opts = {}) {
        this.time = 0;
        this.towers = new Map();
        this.players = [];
        this.forces = [];
        this.events = [];
        this.shrink = opts.shrink !== false;
        this.noShrink = opts.shrink === false;
        this.onEvent = opts.onEvent || null;
        this.botUpdate = opts.botUpdate || null;
        this.hostileAt = TICK_HZ * 60 * 8;
        buildConnectivity();
    }

    tower(x, y) { return this.towers.get(key(x, y)); }
    getTower(id) { return this.towers.get(key(id.x, id.y)); }
    ensureTower(id) {
        let t = this.getTower(id);
        if (!t) {
            t = new Tower(id.x, id.y, towerTypeAt(id.x, id.y));
            this.towers.set(key(id.x, id.y), t);
        }
        return t;
    }

    info(ev) {
        this.events.push(ev);
        if (this.onEvent) this.onEvent(ev);
        if (this.events.length > 600) this.events.splice(0, 300);
    }

    // ---------------- spawning ----------------
    findSpawn() {
        let searchRadius = Math.floor(Math.sqrt(100 / Math.PI));
        for (let i = 0; i < 200000; i++) {
            const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * searchRadius;
            const x = Math.max(0, Math.min(WORLD_SIZE - 1, Math.floor(CENTER.x + Math.cos(a) * r + 0.5)));
            const y = Math.max(0, Math.min(WORLD_SIZE - 1, Math.floor(CENTER.y + Math.sin(a) * r + 0.5)));
            const id = { x, y };
            if (this.isSpawnable(id)) return id;
            if (i % 8 === 0) searchRadius += 1;
        }
        return null;
    }

    isSpawnable(id) {
        return isSpawnablePosition(id) && this.isGoodSpawn(id) && this.isSafeSpawn(id);
    }

    typeAtOrGenerated(id) {
        const t = this.getTower(id);
        if (t) return t.owner !== null ? null : t.type;
        return towerTypeAt(id.x, id.y);
    }

    isGoodSpawn(id) {
        const tt = this.typeAtOrGenerated(id);
        if (!tt) return false;
        let n = 0, spawnableN = 0;
        for (const nb of neighbors(id.x, id.y)) {
            const nt = this.typeAtOrGenerated(nb);
            if (!nt) return false;
            n += 1;
            if (SPAWNABLE.some((s) => s.name === nt)) spawnableN += 1;
        }
        return (SPAWNABLE.some((s) => s.name === tt) && n >= 3) || spawnableN >= 2;
    }

    isSafeSpawn(id) {
        const seen = new Set([key(id.x, id.y)]);
        let frontier = [id];
        for (let d = 0; d < 4; d++) {
            const next = [];
            for (const t of frontier) {
                for (const nb of neighbors(t.x, t.y)) {
                    const k = key(nb.x, nb.y);
                    if (seen.has(k)) continue;
                    seen.add(k);
                    const tw = this.towers.get(k);
                    if (tw && (tw.owner !== null || tw.inbound.length > 0)) return false;
                    next.push(nb);
                }
            }
            frontier = next;
        }
        return seen.size >= 12;
    }

    bubble(origin, radius, fn) {
        const seen = new Set([key(origin.x, origin.y)]);
        const queue = [origin];
        const r2 = radius * radius;
        fn(origin);
        for (let i = 0; i < queue.length; i++) {
            const t = queue[i];
            for (const nb of neighbors(t.x, t.y)) {
                if (distanceSquared(nb, origin) > r2) continue;
                const k = key(nb.x, nb.y);
                if (seen.has(k)) continue;
                seen.add(k);
                queue.push(nb);
                fn(nb);
            }
        }
    }

    // Generate towers from `id` along the connectivity path towards the world center.
    traverse(id, out) {
        let cur = id;
        for (let i = 0; i < 4000; i++) {
            if (this.getTower(cur)) return;
            const k = key(cur.x, cur.y);
            if (out.has(k)) return;
            out.set(k, cur);
            const parent = connectivity(cur);
            if (!parent) return;
            if (parent.x === cur.x && parent.y === cur.y) return;
            cur = parent;
        }
    }

    spawnPlayer(player) {
        const id = this.findSpawn();
        if (!id) return false;
        const radius = player.bot ? 35 : 50;
        const toGen = new Map();
        this.bubble(id, radius, (t) => this.traverse(t, toGen));
        for (const t of toGen.values()) this.ensureTower(t);

        const t = this.ensureTower(id);
        t.units = new Units();
        t.supply = null;
        t.delay = 0;
        t.setOwner(player.id);
        player.alive = true;
        player.deathReason = null;
        player.score = 0;
        player.towers = new Set([key(id.x, id.y)]);
        this.info({ type: 'gained', tower: id, player: player.id });

        t.units.add(RULER, 1, t.type, true);
        t.units.add(SHIELD, 255, t.type, true);

        const rank = player.rank || 0;
        for (const unit of [SOLDIER, FIGHTER]) {
            const soldiers = new Units();
            soldiers.add(unit, unit === FIGHTER ? 2 : rank >= 2 ? 8 : 4);
            soldiers.add(SHIELD, 15);
            for (const nb of neighbors(id.x, id.y)) {
                this.sendForce(t, new Force(player.id, soldiers.clone(), [id, nb]));
            }
            if (rank < 5) break;
        }
        for (const nb of neighbors(id.x, id.y)) {
            const n = this.getTower(nb);
            if (n && n.owner === null) n.units = new Units();
        }
        return true;
    }

    // ---------------- actions ----------------
    sendForce(from, force) {
        force.host = null;
        // The King's high morale: forces leaving his tower (or a neighbour's) march slower.
        if (from && from.owner != null) {
            const p = this.players[from.owner];
            if (p && p.rulerKey != null) {
                const rk = p.rulerKey;
                const king = this.towers.get(rk);
                const dx = Math.abs(from.x - (rk % WORLD_SIZE));
                const dy = Math.abs(from.y - Math.floor(rk / WORLD_SIZE));
                if (king && (dx <= 1 && dy <= 1)) force.slow = RULER_MARCH_MULT;
            }
        }
        this.forces.push(force);
        from.outbound.push(force);
        const dst = this.ensureTower(force.destination);
        if (dst) { dst.inbound.push(force); force.host = dst; }
        return force;
    }

    deploy(playerId, fromId, path) {
        const t = this.getTower(fromId);
        if (!t || t.owner !== playerId) return 'source not owned';
        const strength = t.forceUnits();
        if (strength.isEmpty()) return 'empty force';
        const err = this.validatePath(path, fromId, strength.maxEdgeDistance());
        if (err) return err;
        this.sendForce(t, new Force(playerId, t.takeForceUnits(), this.canonicalPath(path)));
        return null;
    }

    // Paths travel through the UI as bare {x,y}; everywhere inside the engine they must be the
    // very Tower objects the map holds (its roads mutate them).
    canonicalPath(path) {
        return path.map((p) => this.getTower(p) || p);
    }

    validatePath(path, fromId, maxEdge) {
        if (!path || path.length < 2) return 'path too short';
        if (maxEdge != null && path.length !== 2) return 'path too long';
        if (maxEdge == null && path.length > 16) return 'path too long';
        if (path[0].x !== fromId.x || path[0].y !== fromId.y) return 'source mismatch';
        for (let i = 1; i < path.length; i++) {
            const prev = path[i - 1], next = path[i];
            if (prev.x === next.x && prev.y === next.y) return 'duplicate tower';
            if (maxEdge != null) {
                if (distanceSquared(prev, next) > (maxEdge + 1) ** 2 - 1) return 'edge too long';
            } else if (!neighbors(prev.x, prev.y).some((n) => n.x === next.x && n.y === next.y)) {
                return 'not neighbor';
            }
            if (!this.getTower(next)) return 'not generated';
        }
        return null;
    }

    setSupplyLine(playerId, fromId, path) {
        const t = this.getTower(fromId);
        if (!t || t.owner !== playerId) return 'source not owned';
        if (!t.generatesMobile()) return 'invalid supply line';
        if (path) {
            const err = this.validatePath(path, fromId, TOWER[t.type].rangedDist);
            if (err) return err;
            if (t.supply && samePath(t.supply, path)) path = null;
        }
        t.supply = path ? this.canonicalPath(path) : null;
        return null;
    }

    upgradeTower(playerId, id, type) {
        const t = this.getTower(id);
        if (!t) return 'no tower';
        if (t.owner !== playerId) return 'not owned';
        if (!t.active) return 'upgrade pending';
        const next = TOWER[type];
        if (!next) return 'bad type';
        const cur = TOWER[t.type];
        if (cur.upgrades.includes(type)) {
            if (!meetsPrereqs(type, this.players[playerId].towerCounts)) return 'missing prerequisite';
        } else if (cur.basis !== type) return 'invalid upgrade path';

        t.type = type;
        t.delay = Math.max(1, Math.round(next.delay * TICK_HZ));
        t.units.reconcile(type, t.owner !== null);
        if (t.supply && !t.generatesMobile()) t.supply = null;
        this.info({ type: 'upgrade', tower: id, player: playerId, towerType: type });
        return null;
    }

    towerType(t) { return TOWER[t.type]; }

    breakAlliance(a, b) {
        const pa = this.players[a], pb = this.players[b];
        if (pa) pa.allies.delete(b);
        if (pb) pb.allies.delete(a);
        this.info({ type: 'alliance', a, b, on: false });
    }

    // Accept/decline an alliance request. `request` is one-sided until both agree.
    requestAlliance(a, b) {
        const pa = this.players[a], pb = this.players[b];
        if (!pa || !pb || a === b) return 'bad player';
        if (pa.allies.has(b) && pb.allies.has(a)) { this.breakAlliance(a, b); return null; }
        const mutual = pa.allies.has(b) || pb.allies.has(a);
        pa.allies.add(b);
        if (mutual) {
            pb.allies.add(a);
            for (const x of [a, b]) this.players[x].newAllies.add(x === a ? b : a);
            this.info({ type: 'alliance', a, b, on: true });
        } else {
            this.info({ type: 'allianceRequest', from: a, to: b });
        }
        return null;
    }

    // A* over roads. Prefers own territory, avoids enemy and zombie towers.
    findBestPath(src, dst, maxEdge, playerId) {
        if (maxEdge != null) {
            const d2 = (src.x - dst.x) ** 2 + (src.y - dst.y) ** 2;
            if (d2 <= (maxEdge + 1) ** 2 - 1) return [src, dst];
            return null;
        }
        const dstTower = this.getTower(dst);
        const dstOwner = dstTower ? dstTower.owner : null;
        const keyOf = (id) => id.y * WORLD_SIZE + id.x;
        const start = keyOf(src), goal = keyOf(dst);
        const gScore = new Map([[start, 0]]);
        const cameFrom = new Map();
        const open = [[0, start]];
        const idOf = new Map([[start, src], [goal, dst]]);
        const heur = (id) => Math.floor(Math.sqrt((id.x - dst.x) ** 2 + (id.y - dst.y) ** 2) * 256);
        let budget = 3000;
        while (open.length && budget-- > 0) {
            let bi = 0;
            for (let i = 1; i < open.length; i++) if (open[i][0] < open[bi][0]) bi = i;
            const [f, cur] = open.splice(bi, 1)[0];
            if (cur === goal) break;
            const curId = idOf.get(cur);
            for (const nb of neighbors(curId.x, curId.y)) {
                const nk = keyOf(nb);
                const t = this.towers.get(nk);
                if (!t) continue;
                const allyPass = t.owner !== null && t.owner !== dstOwner && this.haveAlliance(playerId, t.owner);
                if (allyPass) continue;
                const cost = Math.floor(Math.sqrt(distanceSquared(curId, nb)) * 256);
                const tentative = gScore.get(cur) + cost;
                if (tentative < (gScore.get(nk) ?? Infinity)) {
                    gScore.set(nk, tentative);
                    cameFrom.set(nk, cur);
                    idOf.set(nk, nb);
                    let h = heur(nb);
                    if (t.owner === playerId) h += 2 * 256;
                    else if (t.owner !== null || !t.units.isEmpty()) h += 32 * 256;
                    open.push([tentative + h, nk]);
                }
            }
        }
        if (!cameFrom.has(goal)) return null;
        const path = [dst];
        let cur = goal;
        while (cur !== start) {
            cur = cameFrom.get(cur);
            const id = idOf.get(cur);
            if (!id) return null;
            path.push(id);
        }
        path.reverse();
        return path.length >= 2 ? path : null;
    }

    // ---------------- tick ----------------
    tick() {
        this.time += 1;
        const tick = this.time;

        for (const p of this.players) p.newAllies.clear();

        // Halt forces whose remaining path crosses a brand new ally or a destroyed tower.
        for (const t of this.towers.values()) {
            if (t.inbound.length) {
                for (const f of t.inbound) {
                    if (f.owner === null) continue;
                    if (!this.pathHalted(f)) continue;
                    // Halt without rewriting the path object that every holder already shares:
                    // the force simply stops at its current destination (`Force.halted()`).
                    f.parked = true;
                }
            }
            // NOTE: supply lines are deliberately *not* pruned here. A force leaving a tower is
            // both a traveller and the supply line's live copy, so truncating the shared path
            // would strand it mid-route. They are cleared on capture and on upgrade instead.
        }

        for (const t of this.towers.values()) this.tickTower(t, tick);

        // Nothing should be able to orphan a force; if something does, retire it instead of
        // letting it drift around the map forever.
        if (tick % 8 === 0 && this.forces.length > 32) {
            const wanted = new Set();
            for (const t of this.towers.values()) {
                for (const f of t.inbound) wanted.add(f);
                for (const f of t.outbound) wanted.add(f);
            }
            for (const f of this.forces.slice()) if (!wanted.has(f)) this.removeForce(f);
        }

        for (const p of this.players) if (p.alive) this.recomputePlayer(p);
        if (tick % 2 === 0) {
            for (const p of this.players) if (p.alive && p.bot && this.botUpdate) this.botUpdate(this, p);
        }
        if (tick % (TICK_HZ * 2) === 0) this.checkDeaths();
        if (tick % (TICK_HZ * 10) === 0 && this.shrink) this.shrinkWorld();
        if (this.debugBombers && tick % (TICK_HZ * 60 * 4) === 0) this.hostiles();
    }

    pathHalted(f, start = 2) {
        if (!f.path) return true;
        for (let i = Math.max(0, f.idx + start); i < f.path.length; i++) {
            if (!f.path[i]) return true;
            const t = this.getTower(f.path[i]);
            if (!t) return true;
            if (f.owner != null && t.owner != null && t.owner !== f.owner &&
                this.haveAlliance(f.owner, t.owner)) return true;
        }
        return false;
    }

    haveAlliance(a, b) {
        if (a === b || a == null || b == null) return false;
        const pa = this.players[a], pb = this.players[b];
        return !!pa && !!pb && pa.allies.has(b) && pb.allies.has(a);
    }

    relationship(a, b) {
        if (a === b) return 'comrade';
        if (this.haveAlliance(a, b)) return 'ally';
        return 'enemy';
    }

    tickTower(t, tick) {
        const owner = t.owner;
        const period = owner !== null ? 30 : 10;

        let deploy = false;
        if (tick % (period * TICK_HZ) === 0) {
            const diminished = this.diminish(t);
            deploy = diminished !== 0 && t.active;
        }

        if (t.delay > 0) {
            t.delay -= 1;
        } else if (owner !== null) {
            const tt = TOWER[t.type];
            for (const name in tt.gen) {
                const u = tt.genUnitId(name);
                if (tick % (tt.gen[name] * TICK_HZ) === 0) {
                    const added = t.units.add(u, 2, t.type, false);
                    t.units.subtract(u, Math.max(0, added - 1));
                    if (isMobile(u, t.type) && added < 2) deploy = true;
                }
            }
        } else if (TOWER[t.type].down && tick % (60 * TICK_HZ) === 0) {
            t.type = TOWER[t.type].down;
            t.units.reconcile(t.type, false);
        }

        if (deploy && !t.units.hasRuler() && t.supply && t.owner !== null) {
            const fu = t.forceUnits();
            if (!fu.isEmpty()) {
                const med = fu.maxEdgeDistance();
                if (med >= TOWER[t.type].rangedDist) {
                    this.sendForce(t, new Force(t.owner, t.takeForceUnits(),
                        t.supply.map((p) => ({ x: p.x, y: p.y }))));
                }
            }
        }

        if (t.inbound.length && t.outbound.length) this.collideForces(t);

        if (t.inbound.length) {
            // Iterate a snapshot: arriving forces can re-enter `t.inbound` (e.g. the tower below
            // loses its last defender to a king and the king starts living inside it).
            const finished = [], stepped = [];
            for (const f of t.inbound.slice()) {
                if (f.parked) { finished.push(f); continue; } // arrived (or parked by a halt)
                if (!f.tick()) continue;
                if (f.isLast) { finished.push(f); continue; } // final leg completed
                stepped.push(f);
            }
            // Intermediate checkpoints: keep walking the same road towards the real target.
            for (const f of stepped) {
                f.parked = false;
                f.reported = false;
                const at = t.inbound.indexOf(f);
                if (at >= 0) t.inbound.splice(at, 1);
                const dst = this.ensureTower(f.nextDestination);
                if (dst && !dst.inbound.includes(f)) { dst.inbound.push(f); f.host = dst; }
            }
            for (const f of finished) {
                const at = t.inbound.indexOf(f);
                if (at >= 0) t.inbound.splice(at, 1);
                this.arrive(t, f);
            }
        }

        if (t.outbound.length) {
            t.outbound = t.outbound.filter((f) => {
                // A halted force sits at its destination until it expires.
                const req = Math.max(1, f.required);
                const step = f.path.length === 2 ? 1 : progressPerTick(f.units);
                f.progress = Math.min(f.progress + step, req);
                f.host = null;             // the shadow is done; a force is retired only on arrival
                return f.progress < req;
            });
        }
        if (t.flash > 0) t.flash -= 1;
    }

    diminish(t) {
        let units = 0;
        for (let u = 0; u < UNITS.length; u++) {
            if (t.owner === null || t.units.get(u) > t.units.capacity(u, t.type)) {
                const sub = t.units.subtract(u, 1);
                if (isMobile(u, t.type)) units += sub;
            }
        }
        return units;
    }

    removeForce(f) {
        f.host = null;
        const i = this.forces.indexOf(f);
        if (i >= 0) this.forces.splice(i, 1);
    }

    collideForces(t) {
        for (const inb of t.inbound.slice()) {
            if (!t.inbound.includes(inb)) continue;
            for (const out of t.outbound.slice()) {
                if (out.destination.x !== inb.source.x || out.destination.y !== inb.source.y) continue;
                if (out.owner === inb.owner) continue;
                if (this.relationship(inb.owner, out.owner) !== 'enemy') continue;

                const reqA = progressRequired(inb.source, inb.destination);
                const reqB = progressRequired(out.source, out.destination);
                const a0 = (reqA - Math.min(reqA, inb.progress + progressPerTick(inb.units))) * reqB;
                const a1 = (reqA - inb.progress) * reqB;
                const b0 = out.progress * reqA;
                const b1 = Math.min(255, out.progress + progressPerTick(out.units)) * reqA;
                if (Math.max(a0, b0) > Math.min(a1, b1)) continue;

                const win = fight(new Combatants(inb.units), new Combatants(out.units),
                    (e) => this.info({ ...e, tower: inb.source }));
                if (win === DEFENDER) {
                    const i = t.inbound.indexOf(inb);
                    if (i >= 0) t.inbound.splice(i, 1);
                    this.removeForce(inb);
                    break;
                } else if (win === ATTACKER) {
                    const i = t.outbound.indexOf(out);
                    if (i >= 0) t.outbound.splice(i, 1);
                    this.removeForce(out);
                }
            }
        }
    }

    arrive(t, f) {
        f.host = null;                    // it is no longer on its way anywhere
        const tp = t.owner;
        const id = { x: t.x, y: t.y };

        if (tp !== null || !t.units.isEmpty()) {
            const fp = f.owner;
            const rel = this.relationship(tp, fp);
            const unfriendly = rel === 'enemy' || (rel === 'ally' && f.units.hasRuler());
            if (unfriendly) {
                let towerEmped = false;
                const winner = fight(new Combatants(f.units), new Combatants(t.units, t.type), (e) => {
                    if (e.type === 'emp' && e.side === ATTACKER) towerEmped = true;
                    this.info({ ...e, tower: id });
                });
                if (towerEmped) t.delay = Math.max(t.delay, EMP_TICKS);
                t.hit = 2;
                if (winner !== ATTACKER && fp !== null) this.info({ type: 'lostForce', player: fp, tower: id });
                if (winner !== DEFENDER) {
                    if (tp !== null) this.info({ type: 'lostTower', tower: id, player: tp });
                    const newOwner = (winner === ATTACKER && fp !== null) ? fp : null;
                    if (newOwner !== null) this.info({ type: 'gained', tower: id, player: newOwner });
                    if (tp !== null || newOwner !== null) t.setOwner(newOwner);
                    if (t.owner === null) {
                        while (TOWER[t.type].down) t.type = TOWER[t.type].down;
                        t.delay = 0;
                    }
                    t.flash = 3;
                }
            }
        } else if (f.owner !== null && f.units.isAlive()) {
            this.info({ type: 'gained', tower: id, player: f.owner });
            t.setOwner(f.owner);
            t.units.reconcile(t.type, t.owner !== null);
        }

        const rel = this.relationship(f.owner, t.owner);
        if (f.units.isEmpty()) {
            this.removeForce(f);
        } else if (f.fuel === 0) {
            if (f.owner !== null) this.info({ type: 'lostForce', player: f.owner, tower: id });
            this.removeForce(f);
        } else if (rel === 'comrade' && this.tryMoveOn(f, t)) {
            // keeps going along its own path
        } else if (rel === 'ally' && !f.units.hasRuler() && this.tryMoveOn(f, t, true)) {
            // handed off to the ally's supply line
        } else if (rel === 'comrade' || (rel === 'ally' && !f.units.hasRuler())) {
            t.units.addUnitsToTower(f.units, t.type, t.owner !== null);
            this.removeForce(f);
        } else if (f.units.get(RULER) > 0) {
            if (f.owner !== null) this.info({ type: 'ruler', player: f.owner, side: ATTACKER, tower: id });
            this.removeForce(f);
        } else {
            this.removeForce(f);
        }
    }

    tryMoveOn(f, t, fromAlly = false) {
        if (!fromAlly && !f.isLast) {
            f.progress = 0;
            if (f.units.isMany()) f.fuel -= 1;
            return true;
        }
        if (!t.supply || TOWER[t.type].rangedDist != null || !f.units.isMany()) return false;
        if (t.type === 'Projector') {
            const maxShield = TOWER.Projector.rawCap(SHIELD);
            const maxTransfer = Math.max(0, maxShield - f.units.get(SHIELD));
            if (maxTransfer > 0) f.units.add(SHIELD, t.units.subtract(SHIELD, maxTransfer));
        }
        if (f.units.get(CHOPPER)) {
            const initial = forceSpeed(f.units);
            const order = { immobile: 0, slow: 1, normal: 2, fast: 3 };
            for (const transfer of [SOLDIER, TANK]) {
                if (order.normal >= order[initial]) break;
                for (;;) {
                    if (t.units.get(transfer) === 0) break;
                    if (f.units.add(transfer, 1) === 0) break;
                    if (order[forceSpeed(f.units)] < order[initial]) { f.units.subtract(transfer, 1); break; }
                    t.units.subtract(transfer, 1);
                }
            }
        }
        f.path = t.supply.map((p) => this.getTower(p) || this.ensureTower(p));
        f.idx = 0;
        f.progress = 0;
        if (f.units.isMany()) f.fuel -= 1;
        const dst = this.ensureTower(f.destination);
        if (dst) { dst.inbound.push(f); f.host = dst; }
        return true;
    }

    // ---------------- bookkeeping ----------------
    recomputePlayer(p) {
        let score = 0;
        const counts = {};
        p.rulerKey = null;
        // Rebuild the holdings from the map so a tower can never be owned by `p` without
        // being in their set (capture, upgrade and death all mutate the map directly).
        const next = new Set();
        for (const [k, t] of this.towers) {
            if (t.owner !== p.id) continue;
            next.add(k);
            if (t.units.hasRuler()) p.rulerKey = k;
            if (!t.active) continue;
            score += TOWER[t.type].score;
            counts[t.type] = (counts[t.type] || 0) + 1;
        }
        p.towers = next;
        p.score = score;
        p.towerCounts = counts;
    }

    checkDeaths() {
        for (const p of this.players) {
            if (!p.alive) continue;
            let rulerSeen = false;
            for (const k of p.towers) {
                const t = this.towers.get(k);
                if (!t) continue;
                if (t.owner !== p.id) continue;
                if (t.units.hasRuler()) rulerSeen = true;
                for (const f of t.inbound) if (f.owner === p.id && f.units.hasRuler()) rulerSeen = true;
            }
            if (!rulerSeen) this.killPlayer(p);
        }
    }

    killPlayer(p) {
        if (!p.alive) return;
        p.alive = false;
        p.allies.clear();
        this.info({ type: 'died', player: p.id });
        for (const t of this.towers.values()) {
            if (t.owner === p.id) {
                t.units.subtract(RULER, 255);
                t.units.subtract(SHIELD, 255);
                t.setOwner(null);
                this.info({ type: 'lostTower', tower: t.id, player: p.id });
            }
            for (const list of [t.inbound, t.outbound]) {
                for (const f of list.slice()) {
                    if (f.owner === p.id) {
                        const i = list.indexOf(f);
                        if (i >= 0) list.splice(i, 1);
                        this.removeForce(f);
                    }
                }
            }
        }
        for (const q of this.players) q.allies.delete(p.id);
        p.towers.clear();
    }

    // Unclaimed towers slowly vanish, and with them the map nobody is using.
    shrinkWorld() {
        if (this.noShrink) return;
        const locked = new Set();
        for (const [k, t] of this.towers) {
            if (t.canDestroy) continue;
            locked.add(k);
            let cur = t.id;
            for (let i = 0; i < 400; i++) {
                const p = connectivity(cur);
                if (!p) break;
                const pk = key(p.x, p.y);
                if (locked.has(pk)) break;
                locked.add(pk);
                cur = p;
            }
            if (t.units.hasRuler()) {
                this.bubble(t.id, 12, (id) => locked.add(key(id.x, id.y)));
            }
        }
        const remove = [];
        let count = 0;
        for (const [k, t] of this.towers) {
            count += 1;
            if (!locked.has(k) && t.canDestroy) remove.push(k);
        }
        // Never let the visible map get smaller than a reasonable play area.
        if (count - remove.length < Math.max(600, this.players.length * 150)) return;
        for (const k of remove) this.towers.delete(k);
    }

    // Over budget: two bombers from the world centre, exactly like Kiomet's summoned debug
    // players, kept behind an explicit opt-in so normal games stay untouched.
    hostiles() {
        if (!this.debugBombers || !this.towers.size) return;
        const keys = Array.from(this.towers.keys());
        this.ensureTower(CENTER);
        for (let i = 0; i < 2; i++) {
            const t = this.towers.get(keys[Math.floor(Math.random() * keys.length)]);
            if (!t || t.owner !== null) continue;
            const u = new Units();
            u.add(BOMBER, 5);
            const from = connectivity(t.id) || CENTER;
            this.sendForce(this.getTower(CENTER), new Force(null, u, [from, t.id]));
        }
    }
}

function samePath(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i].x !== b[i].x || a[i].y !== b[i].y) return false;
    return true;
}

// ---- bot.js ----
// SPDX-FileCopyrightText: 2026 Kiomet clone contributors
// SPDX-License-Identifier: AGPL-3.0-or-later
//
// A tower AI modelled on Kiomet's server/src/bot.rs: every update it looks at one of its
// towers, upgrades it if the shields are banked, and sends its mobile units at the most
// promising reachable target — the enemy it is currently fighting, or unclaimed ground.



function botUpdate(game, player) {
    if (!player.alive) return;
    const bot = player.botState;

    // Bots retire after a while, like Kiomet's, so the map makes room for humans.
    if (!bot.quitAt) bot.quitAt = game.time + 4 * 60 * (30 + Math.random() * 60);
    if (game.time > bot.quitAt) { game.killPlayer(player); return; }

    const mine = [...player.towers].map((k) => game.towers.get(k)).filter((t) => t && t.owner === player.id);
    if (!mine.length) return;

    // ---- what are we fighting? the nearest enemy touching our land
    let target = null, targetDist = Infinity, enemyTower = null;
    for (const t of mine) {
        for (const nb of nearTowers(game, t, 3)) {
            if (nb.owner == null || nb.owner === player.id) continue;
            if (game.haveAlliance(player.id, nb.owner)) continue;
            const d = distanceSq(t, nb);
            if (d < targetDist) { targetDist = d; target = nb.owner; enemyTower = nb; }
        }
    }

    // The king runs for safety when his tower is about to fall.
    const king = mine.find((t) => t.units.hasRuler());
    if (king && king.active && kingIsThreatened(game, player, king)) {
        evacuateKing(game, player, king);
        return;
    }

    // ---- upgrade a tower with plenty of shields
    const upgradable = mine.filter((t) => t.active && t.units.get(SHIELD) >=
        Math.floor(t.units.capacity(SHIELD, t.type) / (target != null ? 1 : 2)));
    if (upgradable.length && Math.random() < 0.6) {
        upgrade(game, player, upgradable[Math.floor(Math.random() * upgradable.length)]);
    }

    // ---- send a force. Never gamble with the king.
    const withUnits = mine.filter((t) => !t.units.hasRuler() && !t.forceUnits().isEmpty());
    if (!withUnits.length) return;
    const src = withUnits[Math.floor(Math.random() * withUnits.length)];

    const strength = src.forceUnits();
    // Kiomet's bot calls any force of 5+ ground damage "formidable"; below that it only
    // occasionally bothers, which is far too timid for an offline map of this size.
    const formidable = strength.forceGroundDamage() >= 2;
    if (!formidable && Math.random() > 0.25) return;
    const maxEdge = strength.maxEdgeDistance();

    const candidates = [];
    for (const dst of nearTowers(game, src, 8)) {
        if (dst === src) continue;
        if (maxEdge != null && distanceSq(src, dst) > (maxEdge + 1) ** 2 - 1) continue;
        if (dst.owner === player.id) {
            // Reinforce: only if it shortens the way to the enemy.
            if (!enemyTower) continue;
            if (distanceSq(enemyTower, dst) >= distanceSq(enemyTower, src)) continue;
            if (dst.units.get(SHIELD) < 5) continue;
        } else if (dst.owner == null) {
            // Unclaimed land is always worth taking.
        } else if (game.haveAlliance(player.id, dst.owner)) {
            continue;
        } else if (target != null && dst.owner !== target) {
            continue;                     // one theatre at a time
        } else if (!formidable) {
            continue;                     // a token force shouldn't poke a garrison
        }
        candidates.push(dst);
    }
    if (!candidates.length) return;

    const dst = candidates[Math.floor(Math.random() * candidates.length)];
    const path = game.findBestPath(src, dst, maxEdge, player.id);
    if (!path) return;
    if (src.generatesMobile() && dst.generatesMobile() && Math.random() < 0.25 &&
        game.setSupplyLine(player.id, src, path) == null) return;
    game.deploy(player.id, src, path);
}

// Towers within `radius` tower cells (the bubble radius is in world units: 5 per cell).
function nearTowers(game, src, radius) {
    const out = [];
    game.bubble(src.id, radius * 5, (id) => {
        const t = game.getTower(id);
        if (t) out.push(t);
    });
    return out;
}

function distanceSq(a, b) {
    return (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
}

function upgrade(game, player, t) {
    if (!t.active) return;
    const opts = TOWER[t.type].upgrades.filter((u) => meetsPrereqs(u, player.towerCounts));
    if (!opts.length) return;
    game.upgradeTower(player.id, t, opts[Math.floor(Math.random() * opts.length)]);
}

function kingIsThreatened(game, player, king) {
    const armed = king.inbound.filter((f) => f.owner !== player.id &&
        game.relationship(player.id, f.owner) === 'enemy');
    if (!armed.length) return false;
    return armed.reduce((n, f) => n + f.units.forceGroundDamage(), 0) > king.units.get(SHIELD);
}

function evacuateKing(game, player, king) {
    let best = null;
    for (const nb of neighbors(king.x, king.y)) {
        const t = game.getTower(nb);
        if (!t || t.owner !== player.id || !t.active) continue;
        if (!best || t.units.get(SHIELD) > best.units.get(SHIELD)) best = t;
    }
    if (!best) return;
    game.deploy(player.id, king, [king.id, best.id]);
}

// ---- render.js ----
// SPDX-FileCopyrightText: 2026 Kiomet clone contributors
// SPDX-License-Identifier: AGPL-3.0-or-later
//
// Canvas renderer: roads, tower plinths, unit formations, force markers, territory halos.
// Visual language follows Kiomet's client (client/src/layout.rs, client/src/road.rs,
// client/src/color.rs).





const COLORS = {
    blue: [0x74, 0xb9, 0xff],
    gray: [0x66, 0x66, 0x66],
    purple: [0x86, 0x44, 0xfc],
    red: [0xc0, 0x39, 0x2b],
    me: [0x74, 0xb9, 0xff],
    ally: [0x86, 0x44, 0xfc],
    enemy: [0xc0, 0x39, 0x2b],
    neutral: [0x66, 0x66, 0x66],
    road: 'rgba(150,160,175,0.55)',
    roadHi: 'rgba(215,225,240,0.9)',
};

// Tower art from Kiomet's own painting set (AGPL-3.0-or-later, Softbear, Inc.),
// re-encoded to 64px transparent WebP.
const BG = '#2d3436';

class Camera {
    constructor() { this.x = 0; this.y = 0; this.zoom = 18; }
    toScreen(wx, wy, cw, ch) { return [(wx - this.x) * this.zoom + cw / 2, (wy - this.y) * this.zoom + ch / 2]; }
    toWorld(sx, sy, cw, ch) { return [(sx - cw / 2) / this.zoom + this.x, (sy - ch / 2) / this.zoom + this.y]; }
    clamp() {
        this.zoom = Math.max(7, Math.min(64, this.zoom));
        this.x = Math.max(0, Math.min(2560, this.x));
        this.y = Math.max(0, Math.min(2560, this.y));
    }
}

class Renderer {
    constructor(canvas, icons) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.camera = new Camera();
        // SvgColor: each glyph stroked in its owner's colour, cached per colour.
        this.glyphCache = new Map();
        this.dpr = Math.min(2, window.devicePixelRatio || 1);
        this.resize();
    }

    resize() {
        const r = this.canvas.getBoundingClientRect();
        this.cw = r.width; this.ch = r.height;
        this.canvas.width = Math.round(r.width * this.dpr);
        this.canvas.height = Math.round(r.height * this.dpr);
    }

    // Which towers should be drawn: everything within the view plus any owned tower.
    draw(game, view) {
        const ctx = this.ctx;
        const { cw, ch } = this;
        ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, cw, ch);

        const zoom = this.camera.zoom;
        // World-space bounds of the viewport plus a margin.
        const [wx0, wy0] = this.camera.toWorld(-80, -80, cw, ch);
        const [wx1, wy1] = this.camera.toWorld(cw + 80, ch + 80, cw, ch);
        const lo = { x: Math.floor(wx0 / 5) - 2, y: Math.floor(wy0 / 5) - 2 };
        const hi = { x: Math.ceil(wx1 / 5) + 2, y: Math.ceil(wy1 / 5) + 2 };

        const visible = [];
        for (const t of game.towers.values()) {
            if (t.x < lo.x || t.y < lo.y || t.x > hi.x || t.y > hi.y) continue;
            visible.push(t);
        }

        this.drawTerritory(ctx, game, visible);
        this.drawRoads(ctx, game, visible);
        this.drawPaths(ctx, game, view);
        this.drawTowers(ctx, game, visible, view);
        this.drawForces(ctx, game, view);
        this.drawSelection(ctx, game, view);
    }

    colorFor(game, owner, view) {
        if (owner == null) return COLORS.neutral;
        if (view && owner === view.playerId) return COLORS.me;
        if (view && view.allies && view.allies.has(owner)) return COLORS.ally;
        return COLORS.enemy;
    }

    drawTerritory(ctx, game, visible) {
        const z = this.camera.zoom;
        const r = Math.max(12, z * 2.2);
        ctx.save();
        ctx.globalAlpha = 0.10;
        for (const t of visible) {
            if (t.owner == null) continue;
            const c = this.colorFor(game, t.owner, game.view);
            const [sx, sy] = this.camera.toScreen(integerPosition(t.x, t.y)[0], integerPosition(t.x, t.y)[1], this.cw, this.ch);
            const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
            g.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},0.55)`);
            g.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
            ctx.fillStyle = g;
            ctx.fillRect(sx - r, sy - r, r * 2, r * 2);
        }
        ctx.restore();
    }

    drawRoads(ctx, game, visible) {
        const seen = new Set();
        ctx.lineWidth = Math.max(1, this.camera.zoom * 0.055);
        ctx.strokeStyle = COLORS.road;
        ctx.beginPath();
        for (const t of visible) {
            const a = integerPosition(t.x, t.y);
            for (const nb of neighbors(t.x, t.y)) {
                const k1 = t.y * 512 + t.x, k2 = nb.y * 512 + nb.x;
                const kk = k1 < k2 ? k1 * 262144 + k2 : k2 * 262144 + k1;
                if (seen.has(kk)) continue;
                seen.add(kk);
                if (!game.getTower(nb)) continue;
                const b = integerPosition(nb.x, nb.y);
                const [x1, y1] = this.camera.toScreen(a[0], a[1], this.cw, this.ch);
                const [x2, y2] = this.camera.toScreen(b[0], b[1], this.cw, this.ch);
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
            }
        }
        ctx.stroke();
    }

    drawPaths(ctx, game, view) {
        if (!view) return;
        // Supply lines of the player and hovered drag preview.
        ctx.save();
        ctx.setLineDash([6, 5]);
        ctx.lineWidth = 1.5;
        for (const t of game.towers.values()) {
            if (!t.supply || t.owner !== view.playerId) continue;
            const p0 = integerPosition(t.x, t.y);
            ctx.strokeStyle = 'rgba(116,185,255,0.75)';
            ctx.beginPath();
            let prev = p0;
            const [x0, y0] = this.camera.toScreen(prev[0], prev[1], this.cw, this.ch);
            ctx.moveTo(x0, y0);
            for (let i = 1; i < t.supply.length; i++) {
                const p = integerPosition(t.supply[i].x, t.supply[i].y);
                const [x, y] = this.camera.toScreen(p[0], p[1], this.cw, this.ch);
                ctx.lineTo(x, y);
                prev = p;
            }
            ctx.stroke();
        }
        ctx.restore();

        if (view.dragPath && view.dragPath.length > 1) {
            ctx.save();
            ctx.lineWidth = Math.max(2, this.camera.zoom * 0.09);
            ctx.strokeStyle = view.dragValid === false ? 'rgba(230,120,60,0.75)' : 'rgba(235,245,255,0.85)';
            ctx.lineCap = 'round';
            ctx.beginPath();
            for (let i = 0; i < view.dragPath.length; i++) {
                const p = integerPosition(view.dragPath[i].x, view.dragPath[i].y);
                const [x, y] = this.camera.toScreen(p[0], p[1], this.cw, this.ch);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.restore();
        }
    }

    drawTowers(ctx, game, visible, view) {
        const z = this.camera.zoom;
        const size = Math.max(10, z * 1.25);
        for (const t of visible) {
            const a = integerPosition(t.x, t.y);
            const [sx, sy] = this.camera.toScreen(a[0], a[1], this.cw, this.ch);
            const c = this.colorFor(game, t.owner, view);

            // Plinth.
            ctx.beginPath();
            ctx.arc(sx, sy + size * 0.30, size * 0.46, 0, Math.PI * 2);
            ctx.fillStyle = t.owner == null ? 'rgba(30,34,36,0.75)'
                : `rgba(${this.shade(c, 0.45)},0.9)`;
            ctx.fill();

            // A faint owner ring behind the glyph (the glyph itself is a DOM <img>).
            if (t.owner != null) {
                ctx.beginPath();
                ctx.arc(sx, sy - size * 0.42, size * 0.62, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(${this.shade(c, 1.2)},0.35)`;
                ctx.lineWidth = Math.max(1, size * 0.06);
                ctx.stroke();
            }

            // Selection / hover ring.
            if (view && view.selected && view.selected.x === t.x && view.selected.y === t.y) {
                ctx.beginPath();
                ctx.arc(sx, sy + size * 0.30, size * 0.58, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Unit badges under the tower.
            if (z > 11) this.drawUnits(ctx, t, sx, sy + size * 0.30, size);

            // Delay / EMP indicator.
            if (t.delay > 0) {
                ctx.globalAlpha = 0.45;
                ctx.fillStyle = '#1b1f21';
                ctx.beginPath();
                ctx.arc(sx, sy - size * 0.36, size * 0.42, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#ffd166';
                ctx.font = `${Math.max(9, size * 0.34)}px system-ui, sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(Math.ceil(t.delay / 4) + 's', sx, sy - size * 0.28);
            }
        }
    }

    drawUnits(ctx, t, cx, cy, size) {
        const counts = t.units.counts();
        if (!counts.length) return;
        const cap = {};
        for (const [u] of counts) cap[u] = t.units.capacity(u, t.type);
        // Shields as a ring, the rest as a compact bar of pips.
        const shield = t.units.get(SHIELD);
        if (shield) {
            const max = Math.max(1, t.units.capacity(SHIELD, t.type));
            const r = size * 0.36;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(150,175,220,0.35)';
            ctx.lineWidth = Math.max(1.5, size * 0.09);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, shield / max));
            ctx.strokeStyle = 'rgba(180,205,255,0.95)';
            ctx.stroke();
        }
        const rest = counts.filter(([u]) => u !== SHIELD);
        if (!rest.length) return;
        const total = rest.reduce((n, [, c]) => n + c, 0);
        const maxBar = size * 1.05;
        const w = Math.min(maxBar, Math.max(size * 0.16, Math.sqrt(total) * size * 0.10));
        let x = cx - w / 2;
        const y = cy + size * 0.10;
        const h = Math.max(2, size * 0.10);
        for (const [u, c] of rest) {
            const frac = c / total;
            ctx.fillStyle = UNIT_TINT[u] || '#dfe6ee';
            ctx.fillRect(x, y, Math.max(1.5, w * frac - 1), h);
            x += w * frac;
        }
    }

    drawForces(ctx, game, view) {
        const z = this.camera.zoom;
        const r = Math.max(3, z * 0.22);
        for (const f of game.forces) {
            if (f.idx >= f.path.length - 1) continue;   // already parked somewhere
            const [wx, wy] = f.position(0);
            const [sx, sy] = this.camera.toScreen(wx, wy, this.cw, this.ch);
            if (sx < -40 || sy < -40 || sx > this.cw + 40 || sy > this.ch + 40) continue;
            const c = this.colorFor(game, f.owner, view);
            ctx.beginPath();
            ctx.arc(sx, sy, r, 0, Math.PI * 2);
            ctx.fillStyle = f.owner == null ? 'rgba(120,120,120,0.85)' : `rgb(${this.shade(c, 1.05)})`;
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.35)';
            ctx.lineWidth = 1;
            ctx.stroke();
            if (z > 13) {
                const n = f.units.counts().reduce((s, [, c2]) => s + c2, 0);
                ctx.fillStyle = 'rgba(20,24,26,0.85)';
                ctx.font = `bold ${Math.max(8, r * 1.15)}px system-ui, sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(String(n), sx, sy - r * 1.4);
            }
        }
    }

    drawSelection(ctx, game, view) {
        if (!view || !view.selected) return;
        const t = game.getTower(view.selected);
        if (!t) return;
        const z = this.camera.zoom;
        const a = integerPosition(t.x, t.y);
        const [sx, sy] = this.camera.toScreen(a[0], a[1], this.cw, this.ch);
        ctx.beginPath();
        ctx.arc(sx, sy + z * 0.30, z * 0.95, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // SVG glyph for a tower type, stroked in `color`. Cached per (type, colour).
    glyph(type, color) {
        const key = type + ':' + color.join(',');
        let img = this.glyphCache.get(key);
        if (!img) {
            const svg = (TOWER_SVG[type] || '')
                .replace(/stroke="#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?"/g, `stroke="rgb(${color.join(',')})"`);
            img = new Image();
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
            this.glyphCache.set(key, img);
        }
        return img;
    }

    shade(c, k) {
        return [c[0], c[1], c[2]].map((v) => Math.max(0, Math.min(255, Math.round(v * k)))).join(',');
    }
}

const UNIT_TINT = {
    [UNIT_ID.Fighter]: '#7fd1ff',
    [UNIT_ID.Chopper]: '#9be15d',
    [UNIT_ID.Bomber]: '#ffd166',
    [UNIT_ID.Tank]: '#f2a65a',
    [UNIT_ID.Soldier]: '#e8eef6',
    [UNIT_ID.Shell]: '#ff9f1c',
    [UNIT_ID.Emp]: '#4cc9f0',
    [UNIT_ID.Nuke]: '#ff4d4d',
    [UNIT_ID.King]: '#ffd700',
};

// Game loop, input handling and DOM overlays (tower menu, alerts, leaderboard, dialogs).








const LABEL = {
    Ews: 'EWS', Emp: 'EMP', Ruler: 'King',
};

const D = (id) => document.getElementById(id);
const el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
};
const fmt = (n) => String(n);

class App {
    constructor() {
        this.canvas = D('canvas');
        this.renderer = new Renderer(this.canvas);
        this.camera = this.renderer.camera;
        this.name = localStorage.getItem('kiomet-name') || 'Guesty';
        this.godMode = localStorage.getItem('kiomet-god') === '1';
        this.speed = 1;
        this.paused = false;
        this.selected = null;
        this.drag = null;               // {from, to, startTime, path}
        this.pan = null;
        this.pinching = null;
        this.keys = new Set();
        this.lastFrame = performance.now();
        this.acc = 0;
        this.game = null;
        this.newGame();
        this.bindInput();
        this.bindUi();
        requestAnimationFrame((t) => this.frame(t));
    }

    // ---------------- game lifecycle ----------------
    newGame(keepName) {
        const me = new Player(0, this.name, { rank: 3 });
        this.me = me;
        const bots = [];
        const botNames = ['Borus', 'Cynder', 'Draven', 'Eldra', 'Fenn', 'Grim', 'Hollis', 'Isolde',
            'Jorik', 'Kael', 'Lysa', 'Mira', 'Nyx', 'Orin', 'Perrin', 'Quill'];
        for (let i = 0; i < 9; i++) {
            const n = botNames[(i * 5 + Math.floor(Math.random() * 16)) % botNames.length];
            bots.push(new Player(i + 1, n + (i > 7 ? i : ''), { bot: true, rank: 1 }));
        }
        const game = new Game({
            shrink: true,
            botUpdate: (g, p) => {
                if (p.id === 0) return;
                botUpdate(g, p);
            },
        });
        game.players = [me, ...bots];
        game.onEvent = (e) => this.onGameEvent(e);
        this.game = game;
        game.spawnPlayer(me);
        for (const b of bots) {
            if (Math.random() < 0.75) game.spawnPlayer(b);
        }
        this.camera.x = 1280; this.camera.y = 1280; this.camera.zoom = 16;
        if (me.rulerKey != null) this.panToKey(me.rulerKey, false);
        this.selected = null;
        this.renderMenu();
        this.renderAlerts();
        this.showDeath(false);
    }

    panToKey(k, animate = true) {
        const t = this.game.towers.get(k);
        if (!t) return;
        const p = integerPosition(t.x, t.y);
        this.camera.x = p[0]; this.camera.y = p[1];
    }

    centreOn(t) {
        const p = integerPosition(t.x, t.y);
        this.camera.x = p[0]; this.camera.y = p[1];
    }

    // ---------------- frame loop ----------------
    frame(now) {
        const dt = Math.min(0.25, (now - this.lastFrame) / 1000);
        this.lastFrame = now;
        if (!this.paused) {
            this.acc += dt * this.speed;
            let steps = 0;
            while (this.acc >= 1 / TICK_HZ && steps < 8) {
                this.game.tick();
                this.acc -= 1 / TICK_HZ;
                steps += 1;
            }
        }
        this.handleKeyboardPan(dt);
        // Icon overlay follows the camera; refresh it every frame like the canvas.
        this.syncIcons();
        this.renderer.draw(this.game, {
            playerId: this.me.id,
            allies: this.me.allies,
            selected: this.selected,
            dragPath: this.dragPath,
            dragValid: this.dragValid,
        });
        this.updateHud();
        if (this.selected) this.positionMenu();
        requestAnimationFrame((t) => this.frame(t));
    }

    handleKeyboardPan(dt) {
        const sp = 520 / this.camera.zoom * dt * 12;
        let dx = 0, dy = 0;
        if (this.keys.has('a') || this.keys.has('arrowleft')) dx -= sp;
        if (this.keys.has('d') || this.keys.has('arrowright')) dx += sp;
        if (this.keys.has('w') || this.keys.has('arrowup')) dy -= sp;
        if (this.keys.has('s') || this.keys.has('arrowdown')) dy += sp;
        if (dx || dy) {
            this.camera.x += dx; this.camera.y += dy; this.camera.clamp();
        }
    }

    // ---------------- input ----------------
    bindInput() {
        const cv = this.canvas;
        cv.addEventListener('contextmenu', (e) => e.preventDefault());

        cv.addEventListener('pointerdown', (e) => {
            cv.setPointerCapture(e.pointerId);
            this.pointers = this.pointers || new Map();
            this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (this.pointers.size === 2) {
                const [a, b] = [...this.pointers.values()];
                this.pinching = { d: Math.hypot(a.x - b.x, a.y - b.y), zoom: this.camera.zoom };
                this.drag = null;
                return;
            }
            if (e.button === 2 || e.shiftKey) {
                this.pan = { x: e.clientX, y: e.clientY, cx: this.camera.x, cy: this.camera.y };
                return;
            }
            const [wx, wy] = this.camera.toWorld(e.clientX, e.clientY, this.renderer.cw, this.renderer.ch);
            const t = this.towerAtWorld(wx, wy);
            if (t && t.owner === this.me.id) {
                this.drag = { from: t, startX: e.clientX, startY: e.clientY, path: null, moved: false };
            }
        });

        cv.addEventListener('pointermove', (e) => {
            if (this.pointers && this.pointers.has(e.pointerId)) {
                this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            }
            if (this.pinching && this.pointers.size >= 2) {
                const [a, b] = [...this.pointers.values()];
                const d = Math.hypot(a.x - b.x, a.y - b.y);
                this.camera.zoom = Math.max(7, Math.min(64, this.pinching.zoom * (d / this.pinching.d)));
                return;
            }
            if (this.pan) {
                this.camera.x = this.pan.cx - (e.clientX - this.pan.x) / this.camera.zoom;
                this.camera.y = this.pan.cy - (e.clientY - this.pan.y) / this.camera.zoom;
                this.camera.clamp();
                return;
            }
            if (this.drag) {
                this.updateDrag(e);
            }
        });

        const end = (e) => {
            if (this.pointers) this.pointers.delete(e.pointerId);
            if (this.pointers && this.pointers.size < 2) this.pinching = null;
            if (this.pan) { this.pan = null; return; }
            if (this.drag) this.finishDrag(e);
        };
        cv.addEventListener('pointerup', end);
        cv.addEventListener('pointercancel', end);

        cv.addEventListener('wheel', (e) => {
            e.preventDefault();
            const [wx, wy] = this.camera.toWorld(e.clientX, e.clientY, this.renderer.cw, this.renderer.ch);
            const f = Math.exp(-e.deltaY * 0.0015);
            this.camera.zoom = Math.max(7, Math.min(64, this.camera.zoom * f));
            const [nx, ny] = this.camera.toWorld(e.clientX, e.clientY, this.renderer.cw, this.renderer.ch);
            this.camera.x += wx - nx; this.camera.y += wy - ny;
            this.camera.clamp();
        }, { passive: false });

        addEventListener('pointermove', (e) => {
            // Drag preview continues even if the pointer leaves the canvas.
            if (this.drag) this.updateDrag(e);
        });

        addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            this.keys.add(k);
            if (k === 'escape') { this.selected = null; this.renderMenu(); this.closeDialog(); }
            if (k === 'h') this.panToKey(this.me.rulerKey);
            if (k === 'q') { this.camera.zoom = Math.max(7, this.camera.zoom / 1.2); }
            if (k === 'e') { this.camera.zoom = Math.min(64, this.camera.zoom * 1.2); }
            if (k === 'r') this.showSupplyLines = !this.showSupplyLines;
            if (k === ' ') { e.preventDefault(); this.togglePause(); }
        });
        addEventListener('keyup', (e) => this.keys.delete(e.key.toLowerCase()));
        addEventListener('resize', () => this.renderer.resize());
    }

    // Which tower is under the pointer? Each sprite stands on a jittered point inside its
    // 5x5 world cell, so search the neighbouring cells and take the nearest *cell centre*
    // (the same point the sprite is drawn around); a generous tap radius keeps fat fingers
    // working without ever stealing the tap from a closer neighbour.
    towerAtWorld(wx, wy) {
        let best = null, bestD = Infinity;
        const cx = Math.round(wx / 5), cy = Math.round(wy / 5);
        for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
                const t = this.game.tower(cx + dx, cy + dy);
                if (!t) continue;
                const d = Math.hypot(t.x * 5 - wx, t.y * 5 - wy);
                if (d < bestD) { best = t; bestD = d; }
            }
        }
        if (!best) return null;
        const tapRadius = Math.max(3, Math.min(6, 34 / this.camera.zoom));
        return bestD <= tapRadius ? best : null;
    }

    updateDrag(e) {
        const [wx, wy] = this.camera.toWorld(e.clientX, e.clientY, this.renderer.cw, this.renderer.ch);
        if (Math.hypot(e.clientX - this.drag.startX, e.clientY - this.drag.startY) > 6) this.drag.moved = true;
        const t = this.towerAtWorld(wx, wy);
        this.drag.to = t;
        if (!t || !this.drag.moved) { this.dragPath = null; return; }
        const maxEdge = this.drag.from.forceUnits().maxEdgeDistance();
        const path = this.game.findBestPath(this.drag.from.id, t.id, maxEdge, this.me.id);
        this.drag.path = path;
        this.dragPath = path || [this.drag.from.id, t.id];
        this.dragValid = !!path;
    }

    finishDrag(e) {
        const drag = this.drag;
        this.drag = null;
        this.dragPath = null;
        if (!drag.moved) {
            // A click: select the tower / close the menu.
            this.selectTower(drag.from);
            return;
        }
        if (!drag.to) return;
        const path = drag.path;
        if (!path) return;
        const src = drag.from;
        const sameAsSelection = this.selected && this.selected.x === src.x && this.selected.y === src.y;
        const err = sameAsSelection
            ? this.game.setSupplyLine(this.me.id, src.id, path)
            : this.game.deploy(this.me.id, src.id, path);
        if (err) this.toast(err);
    }

    selectTower(t) {
        if (this.selected && this.selected.x === t.x && this.selected.y === t.y) {
            this.selected = null;
        } else {
            this.selected = { x: t.x, y: t.y };
        }
        this.renderMenu();
    }

    // ---------------- menu ----------------
    positionMenu() {
        const menu = D('tower-menu');
        const t = this.game.getTower(this.selected);
        if (!t) { this.selected = null; menu.classList.add('hidden'); return; }
        const p = integerPosition(t.x, t.y);
        const [sx, sy] = this.camera.toScreen(p[0], p[1], this.renderer.cw, this.renderer.ch);
        const w = menu.offsetWidth || 200, h = menu.offsetHeight || 120;
        let left = sx + 18, top = sy - h / 2;
        if (left + w > this.renderer.cw - 8) left = sx - w - 18;
        top = Math.max(8, Math.min(this.renderer.ch - h - 8, top));
        menu.style.left = left + 'px';
        menu.style.top = top + 'px';
    }

    renderMenu() {
        const menu = D('tower-menu');
        menu.innerHTML = '';
        const t = this.selected ? this.game.getTower(this.selected) : null;
        if (!t) { menu.classList.add('hidden'); return; }
        menu.classList.remove('hidden');

        const isMine = t.owner === this.me.id;
        const type = TOWER[t.type];
        const head = el('div', 'tm-head');
        head.appendChild(el('img', 'tm-icon', ''));
        head.querySelector('img').src = this.svgUrl(t.type, 'rgb(116,185,255)');
        head.appendChild(el('span', 'tm-title', LABEL[t.type] || t.type));
        if (t.owner != null) {
            const p = this.game.players[t.owner];
            head.appendChild(el('span', 'tm-owner', p ? p.name : ''));
        }
        menu.appendChild(head);

        if (t.delay > 0) {
            menu.appendChild(el('div', 'tm-delay', `Upgrading… ${Math.ceil(t.delay / TICK_HZ)}s`));
        }

        // Unit rows (only what the tower can make, or already holds).
        const rows = el('div', 'tm-units');
        for (const [u, c] of t.units.counts()) {
            const cap = t.units.capacity(u, t.type);
            rows.appendChild(this.unitRow(u, c, cap));
        }
        for (const name of Object.keys(type.gen)) {
            const u = UNIT_ID[name];
            if (c2(t, u)) continue;
            rows.appendChild(this.unitRow(u, 0, t.units.capacity(u, t.type)));
        }
        if (t.units.hasRuler()) rows.appendChild(this.unitRow(RULER, 1, 1));
        menu.appendChild(rows);

        if (isMine && t.active) {
            const ups = el('div', 'tm-ups');
            const opts = [...TOWER[t.type].upgrades];
            if (type.basis !== t.type) opts.push(type.basis);
            for (const name of opts) {
                const up = TOWER[name];
                const down = name === type.basis;
                const ok = down ? true : meetsPrereqs(name, this.me.towerCounts);
                const row = el('button', 'tm-up' + (down ? ' down' : '') + (ok ? '' : ' locked'));
                row.title = (down ? 'Downgrade to ' : 'Upgrade to ') + name;
                const ic = el('img', 'tm-up-icon');
                ic.src = this.svgUrl(name, down ? 'rgb(192,57,43)' : 'rgb(116,185,255)');
                row.appendChild(ic);
                if (!down) {
                    const req = el('div', 'tm-req');
                    for (const [pre, n] of up.prereqs) {
                        const have = this.me.towerCounts[pre] || 0;
                        const r = el('span', 'tm-req-item' + (have >= n ? ' ok' : ''));
                        const im = el('img', 'tm-req-icon');
                        im.src = this.svgUrl(pre, have >= n ? 'rgb(116,185,255)' : 'rgb(150,150,150)');
                        r.appendChild(im);
                        r.appendChild(el('b', '', `${have}/${n}`));
                        req.appendChild(r);
                    }
                    row.appendChild(req);
                }
                row.addEventListener('click', (ev) => {
                    ev.stopPropagation();
                    if (!ok) { this.toast('Missing prerequisite'); return; }
                    const err = this.game.upgradeTower(this.me.id, t.id, name);
                    if (err) this.toast(err);
                    else this.renderMenu();
                });
                ups.appendChild(row);
            }
            menu.appendChild(ups);

            if (t.supply) {
                const b = el('button', 'tm-btn', 'Cancel supply line');
                b.addEventListener('click', () => {
                    this.game.setSupplyLine(this.me.id, t.id, null);
                    this.renderMenu();
                });
                menu.appendChild(b);
            }
            menu.appendChild(el('div', 'tm-hint', t.generatesMobile()
                ? 'Drag to send units. Select first, then drag to set a supply line.'
                : 'Drag to send units.'));
        } else if (t.owner != null && t.owner !== this.me.id) {
            const p = this.game.players[t.owner];
            const allied = this.me.allies.has(t.owner);
            const pending = p && p.allies.has(this.me.id) && !allied;
            const b = el('button', 'tm-btn' + (allied ? ' danger' : ''),
                allied ? 'Break alliance' : (pending ? 'Accept alliance' : 'Request alliance'));
            b.addEventListener('click', (ev) => {
                ev.stopPropagation();
                this.game.requestAlliance(this.me.id, t.owner);
                this.renderMenu();
            });
            menu.appendChild(b);
        } else {
            menu.appendChild(el('div', 'tm-hint', t.owner == null ? 'Unowned' : ''));
        }

        this.positionMenu();
    }

    svgUrl(type, color) {
        const svg = (TOWER_SVG[type] || '').replace(/stroke="#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?"/g, `stroke="${color}"`);
        return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
    }

    unitRow(u, count, cap) {
        const row = el('div', 'tm-unit');
        row.title = LABEL[UNITS[u].name] || UNITS[u].name;
        const badge = el('span', 'unit-' + UNITS[u].name.toLowerCase());
        row.appendChild(badge);
        row.appendChild(el('span', 'tm-count', `${count}/${cap}`));
        if (TOWER_GEN_HINT[u]) row.appendChild(el('span', 'tm-gen', TOWER_GEN_HINT[u]));
        return row;
    }

    // ---------------- icon overlay ----------------
    // Towers are drawn as absolutely positioned <img> elements: crisp SVG at any zoom, and
    // it sidesteps canvas quirks entirely.
    syncIcons() {
        if (!this.iconLayer) {
            this.iconLayer = D('icons');
            this.iconEls = new Map();
        }
        const z = this.camera.zoom;
        const { cw, ch } = this.renderer;
        const size = Math.max(14, z * 1.35);
        const seen = new Set();
        const padX = cw / 2 / z + 4, padY = ch / 2 / z + 4;
        for (const t of this.game.towers.values()) {
            const wp = integerPosition(t.x, t.y);
            const wx = wp[0], wy = wp[1];
            if (Math.abs(wx - this.camera.x) > padX || Math.abs(wy - this.camera.y) > padY) continue;
            const k = t.y * 512 + t.x;
            seen.add(k);
            const [sx, sy] = this.camera.toScreen(wx, wy, cw, ch);
            let el = this.iconEls.get(k);
            if (!el) {
                el = document.createElement('img');
                el.className = 'tico';
                this.iconLayer.appendChild(el);
                this.iconEls.set(k, el);
            }
            const c = this.colorForRgb(t.owner);
            const key = t.type + c.join(',');
            if (el.dataset.key !== key) {
                el.src = this.svgUrl(t.type, `rgb(${c.join(',')})`);
                el.dataset.key = key;
            }
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.left = (sx - size / 2) + 'px';
            el.style.top = (sy - size * 0.95) + 'px';
            el.style.opacity = t.owner == null ? 0.85 : 1;
        }
        for (const [k, el] of this.iconEls) {
            if (!seen.has(k)) { el.remove(); this.iconEls.delete(k); }
        }
    }

    colorForRgb(owner) {
        if (owner == null) return COLORS.neutral;
        if (owner === this.me.id) return COLORS.me;
        if (this.me.allies.has(owner)) return COLORS.ally;
        return COLORS.enemy;
    }

    // ---------------- HUD ----------------
    updateHud() {
        const me = this.me;
        D('score').textContent = fmt(me.score);
        D('towers-n').textContent = fmt(me.towers.size);
        const rank = document.querySelectorAll('#leaderboard .lb-row');
        const rows = this.game.players
            .filter((p) => p.alive || p.id === me.id)
            .map((p) => ({ p, score: p.id === me.id ? me.score : p.score, n: p.towers.size }))
            .sort((a, b) => b.score - a.score || b.n - a.n)
            .slice(0, 10);
        const lb = D('leaderboard');
        let html = '<div class="lb-head">Leaderboard</div>';
        rows.forEach((r, i) => {
            const mine = r.p.id === me.id;
            const col = this.colorCss(r.p.id);
            html += `<div class="lb-row${mine ? ' me' : ''}"><span class="lb-n">${i + 1}.</span>` +
                `<span class="lb-dot" style="background:${col}"></span>` +
                `<span class="lb-name">${escapeHtml(r.p.name)}</span>` +
                `<span class="lb-score">${r.score}</span></div>`;
        });
        html += `<div class="lb-foot">${fmt(this.game.towers.size)} towers · ${this.game.players.filter((p) => p.alive).length} players</div>`;
        lb.innerHTML = html;
        D('alive-dot').style.background = me.alive ? '#74b9ff' : '#c0392b';
    }

    colorCss(owner) {
        const c = owner === this.me.id ? COLORS.me : this.me.allies.has(owner) ? COLORS.ally : COLORS.enemy;
        return `rgb(${c[0]},${c[1]},${c[2]})`;
    }

    // ---------------- alerts ----------------
    onGameEvent(e) {
        if (e.type === 'ruler' && e.player === this.me.id) {
            this.alerts.unshift({ text: 'Your King was killed!', sub: '', kind: 'bad', until: performance.now() + 8000 });
        }
        if (e.type === 'died' && e.player === this.me.id) {
            this.showDeath(true);
        }
    }

    renderAlerts() { /* alerts are pushed in pushAlert */ }

    pushAlert(text, sub, kind = 'info', ms = 7000) {
        this.alerts = this.alerts || [];
        if (this.alerts.some((a) => a.text === text)) return;
        this.alerts.unshift({ text, sub, kind, until: performance.now() + ms });
        this.renderAlertList();
    }

    renderAlertList() {
        const box = D('alerts');
        const now = performance.now();
        this.alerts = (this.alerts || []).filter((a) => a.until > now);
        box.innerHTML = '';
        for (const a of this.alerts.slice(0, 4)) {
            const row = el('div', 'alert ' + a.kind);
            row.appendChild(el('span', 'alert-dot'));
            const txt = el('div', 'alert-text');
            txt.appendChild(el('div', 'alert-main', escapeHtml(a.text)));
            if (a.sub) txt.appendChild(el('div', 'alert-sub', escapeHtml(a.sub)));
            row.appendChild(txt);
            const x = el('span', 'alert-x', '✘');
            x.addEventListener('click', () => { a.until = 0; this.renderAlertList(); });
            row.appendChild(x);
            box.appendChild(row);
        }
    }

    showDeath(anim) {
        const spawn = D('spawn');
        spawn.classList.toggle('hidden', this.me.alive);
        if (!this.me.alive) {
            const r = D('death-reason');
            r.textContent = 'Your King was killed!';
            r.classList.remove('hidden');
        }
    }

    // ---------------- UI wiring ----------------
    bindUi() {
        this.alerts = [];
        D('chat-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = D('chat-input');
            const v = input.value.trim();
            if (!v) return;
            input.value = '';
            this.chatLine(this.name, v, true);
        });
        D('play-btn').addEventListener('click', () => {
            const name = D('name-input').value.trim().slice(0, 12) || 'Guesty';
            this.name = name;
            localStorage.setItem('kiomet-name', name);
            this.newGame();
        });
        D('pause-btn').addEventListener('click', () => this.togglePause());
        D('speed-btn').addEventListener('click', () => {
            this.speed = this.speed === 1 ? 2 : this.speed === 2 ? 4 : 1;
            D('speed-btn').textContent = this.speed + '×';
            D('speed-btn').classList.toggle('active', this.speed !== 1);
        });
        D('god-btn').addEventListener('click', () => {
            this.godMode = !this.godMode;
            localStorage.setItem('kiomet-god', this.godMode ? '1' : '0');
            D('god-btn').classList.toggle('active', this.godMode);
            this.toast(this.godMode ? 'God mode on — your King cannot die' : 'God mode off');
        });
        D('god-btn').classList.toggle('active', this.godMode);
        D('help-btn').addEventListener('click', () => this.openDialog('help'));
        D('towers-btn').addEventListener('click', () => this.openDialog('towers'));
        D('units-btn').addEventListener('click', () => this.openDialog('units'));
        D('dialog-close').addEventListener('click', () => this.closeDialog());
        D('newgame-btn').addEventListener('click', () => this.newGame());
        D('zoom-in').addEventListener('click', () => { this.camera.zoom = Math.min(64, this.camera.zoom * 1.25); });
        D('zoom-out').addEventListener('click', () => { this.camera.zoom = Math.max(7, this.camera.zoom / 1.25); });
        D('center-btn').addEventListener('click', () => this.panToKey(this.me.rulerKey));
        D('name-input').value = this.name;
        setInterval(() => this.renderAlertList(), 500);
        this.toast('Click a tower for its menu · drag from your towers to send units · H finds your King');
    }

    togglePause() {
        this.paused = !this.paused;
        D('pause-btn').textContent = this.paused ? '▶' : '❚❚';
        D('pause-btn').classList.toggle('active', this.paused);
    }

    toast(text) {
        this.pushAlert(text, '', 'info', 6000);
    }

    chatLine(who, text, mine) {
        const box = D('chat-log');
        const line = el('div', 'chat-line' + (mine ? ' mine' : ''));
        line.appendChild(el('b', 'chat-name', escapeHtml(who)));
        line.appendChild(el('span', 'chat-text', ' ' + escapeHtml(text)));
        box.appendChild(line);
        box.scrollTop = box.scrollHeight;
    }

    openDialog(which) {
        const dlg = D('dialog');
        const body = D('dialog-body');
        dlg.classList.remove('hidden');
        if (which === 'help') {
            D('dialog-title').textContent = 'Help';
            body.innerHTML = HELP_HTML;
        } else if (which === 'towers') {
            D('dialog-title').textContent = 'Towers';
            body.innerHTML = towersHtml();
        } else {
            D('dialog-title').textContent = 'Units';
            body.innerHTML = unitsHtml();
        }
    }

    closeDialog() { D('dialog').classList.add('hidden'); }
}

function c2(t, u) { return t.units.get(u) > 0; }

const TOWER_GEN_HINT = {};

function towersHtml() {
    let out = '<table class="tbl"><tr><th>Tower</th><th>Points</th><th>Generates</th><th>Holds</th><th>Upgrades from</th><th>Upgrades to</th></tr>';
    for (const t of TOWERS) {
        const gen = Object.entries(t.gen).map(([u, s]) => `${u} / ${s}s`).join(', ') || '—';
        const cap = Object.entries(t.cap).map(([u, c]) => `${u} ${c}`).join(', ');
        out += `<tr><td><b>${LABEL[t.name] || t.name}</b></td><td>${t.score}</td><td>${gen}</td>` +
            `<td>${cap}</td><td>${t.down || (t.pre.length === 0 ? 'on the map' : '')}</td>` +
            `<td>${t.upgrades.join(', ') || '—'}</td></tr>`;
    }
    return out + '</table>';
}

function unitsHtml() {
    let out = '<table class="tbl"><tr><th>Unit</th><th>Speed</th><th>Damage</th><th>Notes</th></tr>';
    const note = {
        Shield: 'Absorbs damage first. Cannot move, except out of a Projector.',
        Fighter: 'Shoots down air units.',
        Chopper: 'Fast, carries soldiers and tanks.',
        Bomber: 'Devastating against ground forces.',
        Tank: 'Slow, hits three times as hard as a soldier.',
        Soldier: 'The basic ground unit.',
        Shell: 'Fired straight at a tower in range. Cannot capture.',
        Emp: 'Shuts a tower down for a minute.',
        Nuke: 'Wipes out everything in a tower.',
        King: 'Cannot be replaced. Lose him and you lose.',
    };
    for (let u = 0; u < 10; u++) {
        const n = UNITS[u].name;
        out += `<tr><td>${LABEL[n] || n}</td><td>${UNITS[u].speed === 'shield' ? 'immobile' : UNITS[u].speed}</td>` +
            `<td>${UNITS[u].damage === 31 ? '∞' : UNITS[u].damage}</td><td>${note[n]}</td></tr>`;
    }
    return out + '</table>';
}

const HELP_HTML = `
<p><b>Drag</b> from one of your towers to another tower to send its units along the roads. They claim
every empty tower on the way, fight whatever they meet, and keep going if they win. Shields stay behind
to defend.</p>
<p><b>Click</b> a tower to open its menu. Upgrades list the towers they require. While a tower is
upgrading it makes nothing, sees no further than a mine and scores nothing.</p>
<p><b>Supply lines:</b> click a tower that makes units, then drag from it. Whenever the tower fills up it
sends its units down the line, and units arriving at a tower with its own supply line carry on along it.</p>
<p><b>Protect your King.</b> When your King is captured you lose the game. Towers at and next to your
King make units and shields twice as fast.</p>
<p><b>Score</b> by holding towers. Mines, factories, quarries, towns, refineries and cities are worth more.</p>
<p><b>Keys:</b> H finds your King, Q/E zoom, WASD or right-drag pans, R shows supply lines, Space pauses.</p>
`;

function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

window.kiomet = new App();

// Fallback splash while the module graph loads.
window.addEventListener('error', (e) => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:8px;bottom:8px;right:8px;background:#7f1d1d;color:#fff;padding:8px;border-radius:6px;font:12px monospace;z-index:999';
  d.textContent = 'Error: ' + (e.message || e.error);
  document.body.appendChild(d);
});
</script>
