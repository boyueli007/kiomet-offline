//
// Canvas renderer: roads, tower plinths, unit formations, force markers, territory halos.
// Visual language follows Kiomet's client (client/src/layout.rs, client/src/road.rs,
// client/src/color.rs).







const COLORS = {
    blue: [0x74, 0xb9, 0xff],
    gray: [0x66, 0x66, 0x66],
    purple: [0x86, 0x44, 0xfc],
    red: [0xc0, 0x39, 0x2b],
    me: [0x74, 0xb9, 0xff],
    ally: [0x86, 0x44, 0xfc],
    enemy: [0xc0, 0x39, 0x2b],
    neutral: [0x66, 0x66, 0x66],
    road: 'rgba(150,160,175,0.55)',
    roadHi: 'rgba(215,225,240,0.9)',
};

// Tower art from Kiomet's own painting set (AGPL-3.0-or-later, Softbear, Inc.),
// re-encoded to 64px transparent WebP.
const BG = '#2d3436';

// Upper bound on the canvas backing store (~8.3 Mpx). Beyond this the per-frame fill of the
// whole surface costs more than the extra sharpness is worth on a 4K/HiDPI display.
const MAX_BACKING_PX = 3840 * 2160;

class Camera {
    constructor() { this.x = 0; this.y = 0; this.zoom = 18; }
    toScreen(wx, wy, cw, ch) { return [(wx - this.x) * this.zoom + cw / 2, (wy - this.y) * this.zoom + ch / 2]; }
    toWorld(sx, sy, cw, ch) { return [(sx - cw / 2) / this.zoom + this.x, (sy - ch / 2) / this.zoom + this.y]; }
    clamp() {
        this.zoom = Math.max(7, Math.min(64, this.zoom));
        this.x = Math.max(0, Math.min(2560, this.x));
        this.y = Math.max(0, Math.min(2560, this.y));
    }
}

class Renderer {
    constructor(canvas, icons) {
        this.canvas = canvas;
        // `alpha: false` lets the compositor skip blending the whole canvas every frame and
        // is safe here because the world always paints an opaque background first.
        this.ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
        this.camera = new Camera();
        // SvgColor: each glyph stroked in its owner's colour, cached per colour.
        this.glyphCache = new Map();
        this.unitCache = new Map();
        // Baked glow sprites for territory halos, keyed by colour and radius bucket.
        this.haloCache = new Map();
        this.dpr = Math.min(2, window.devicePixelRatio || 1);
        this.effectiveDpr = this.dpr;
        this.qualityCap = this.dpr;      // adaptive scaler never exceeds the display's dpr
        this.resize();
    }

    // Dynamic resolution: reallocate the backing store at a lower scale without touching the
    // CSS size, so the game keeps its layout and only loses detail. Called by the frame loop
    // when frames run long, and again when there is headroom.
    setQualityScale(scale) {
        const next = Math.max(0.5, Math.min(this.qualityCap, scale));
        if (Math.abs(next - this.effectiveDpr) < 0.01) return;
        this.effectiveDpr = next;
        this.canvas.width = Math.max(1, Math.round(this.cw * next));
        this.canvas.height = Math.max(1, Math.round(this.ch * next));
    }

    resize() {
        const r = this.canvas.getBoundingClientRect();
        this.cw = r.width; this.ch = r.height;
        this.origX = r.left; this.origY = r.top;
        // Cap the backing-store size: a 4K window at dpr 2 would otherwise redraw 33 Mpx
        // every frame, which is what makes the canvas feel like it is dragging.
        let ratio = this.dpr;
        const maxPx = MAX_BACKING_PX;
        const want = r.width * r.height * ratio * ratio;
        if (want > maxPx) ratio = Math.sqrt(maxPx / Math.max(1, r.width * r.height));
        this.qualityCap = ratio;
        // Keep the adaptive downscale across resizes rather than snapping back to full size.
        if (this.effectiveDpr == null || this.effectiveDpr > ratio) this.effectiveDpr = ratio;
        this.canvas.width = Math.max(1, Math.round(r.width * this.effectiveDpr));
        this.canvas.height = Math.max(1, Math.round(r.height * this.effectiveDpr));
    }

    // Pointer events give clientX/Y in CSS pixels of the *viewport*; the camera works in the
    // canvas' own box. Adding the canvas origin only matters when the canvas is not at (0,0),
    // but it also keeps taps aligned if the page ever gets a margin or the canvas is inset.
    eventToLocal(e) {
        return [e.clientX - (this.origX || 0), e.clientY - (this.origY || 0)];
    }

    // Which towers should be drawn: everything within the view plus any owned tower.
    draw(game, view) {
        this.fog = view && view.fog ? view.fog : null;
        const ctx = this.ctx;
        const { cw, ch } = this;
        ctx.setTransform(this.effectiveDpr, 0, 0, this.effectiveDpr, 0, 0);
        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, cw, ch);

        const zoom = this.camera.zoom;
        // World-space bounds of the viewport plus a margin.
        const [wx0, wy0] = this.camera.toWorld(-80, -80, cw, ch);
        const [wx1, wy1] = this.camera.toWorld(cw + 80, ch + 80, cw, ch);
        const lo = { x: Math.floor(wx0 / 5) - 2, y: Math.floor(wy0 / 5) - 2 };
        const hi = { x: Math.ceil(wx1 / 5) + 2, y: Math.ceil(wy1 / 5) + 2 };

        const visible = [];
        for (const t of game.towers.values()) {
            if (t.x < lo.x || t.y < lo.y || t.x > hi.x || t.y > hi.y) continue;
            visible.push(t);
        }

        this.drawTerritory(ctx, game, visible);
        this.drawRoads(ctx, game, visible);
        this.drawPaths(ctx, game, view);
        this.drawTowers(ctx, game, visible, view);
        this.drawMarkers(ctx, game, view);
        this.drawForces(ctx, game, view);
        this.drawSelection(ctx, game, view);
    }

    colorFor(game, owner, view) {
        if (owner == null) return COLORS.neutral;
        if (view && owner === view.playerId) return COLORS.me;
        if (view && view.allies && view.allies.has(owner)) return COLORS.ally;
        return COLORS.enemy;
    }

    // Territory halos. `createRadialGradient` is one of the most expensive Canvas 2D calls, so
    // each (colour, radius-bucket) pair is baked once into a small offscreen canvas and then
    // blitted — the same trick sprite frameworks use for glow rings.
    halo(colour, r) {
        const bucket = Math.max(8, Math.round(r / 4) * 4);   // 4px buckets keep the cache tiny
        const key = `${colour}|${bucket}`;
        let c = this.haloCache.get(key);
        if (c) return c;
        c = document.createElement('canvas');
        const d = bucket * 2;
        c.width = d; c.height = d;
        const g2 = c.getContext('2d');
        const grad = g2.createRadialGradient(bucket, bucket, 0, bucket, bucket, bucket);
        grad.addColorStop(0, `rgba(${colour},0.55)`);
        grad.addColorStop(1, `rgba(${colour},0)`);
        g2.fillStyle = grad;
        g2.fillRect(0, 0, d, d);
        this.haloCache.set(key, c);
        return c;
    }

    drawTerritory(ctx, game, visible) {
        const fog = this.fog;
        const z = this.camera.zoom;
        const r = Math.max(12, z * 2.2);
        const bucket = Math.max(8, Math.round(r / 4) * 4);
        const size = bucket * 2;
        ctx.save();
        ctx.globalAlpha = 0.10;
        for (const t of visible) {
            if (t.owner == null) continue;
            if (fog && !fog(t)) continue;
            const c = this.colorFor(game, t.owner, game.view);
            const p = integerPosition(t.x, t.y);
            const [sx, sy] = this.camera.toScreen(p[0], p[1], this.cw, this.ch);
            // Skip halos entirely outside the viewport instead of drawing off-screen squares.
            if (sx + bucket < 0 || sy + bucket < 0 || sx - bucket > this.cw || sy - bucket > this.ch) continue;
            ctx.drawImage(this.halo(this.shade(c, 1), bucket), sx - bucket, sy - bucket, size, size);
        }
        ctx.restore();
    }

    drawRoads(ctx, game, visible) {
        const seen = new Set();
        ctx.lineWidth = Math.max(1, this.camera.zoom * 0.055);
        ctx.strokeStyle = COLORS.road;
        ctx.beginPath();
        for (const t of visible) {
            const a = integerPosition(t.x, t.y);
            for (const nb of neighbors(t.x, t.y)) {
                const k1 = t.y * 512 + t.x, k2 = nb.y * 512 + nb.x;
                const kk = k1 < k2 ? k1 * 262144 + k2 : k2 * 262144 + k1;
                if (seen.has(kk)) continue;
                seen.add(kk);
                const other = game.getTower(nb);
                if (!other) continue;
                if (this.fog && !(this.fog(t) || this.fog(other))) continue;
                const b = integerPosition(nb.x, nb.y);
                const [x1, y1] = this.camera.toScreen(a[0], a[1], this.cw, this.ch);
                const [x2, y2] = this.camera.toScreen(b[0], b[1], this.cw, this.ch);
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
            }
        }
        ctx.stroke();
    }

    drawPaths(ctx, game, view) {
        if (!view) return;
        // Supply lines of the player and hovered drag preview.
        ctx.save();
        ctx.setLineDash([6, 5]);
        ctx.lineWidth = 1.5;
        const showAll = !!view.showSupplyLines;
        for (const t of game.towers.values()) {
            if (!t.supply) continue;
            const mine = t.owner === view.playerId;
            if (!mine && !showAll) continue;
            if (this.fog && !this.fog(t)) continue;
            const p0 = integerPosition(t.x, t.y);
            ctx.strokeStyle = mine ? 'rgba(116,185,255,0.75)' : 'rgba(180,180,190,0.35)';
            ctx.beginPath();
            let prev = p0;
            const [x0, y0] = this.camera.toScreen(prev[0], prev[1], this.cw, this.ch);
            ctx.moveTo(x0, y0);
            for (let i = 1; i < t.supply.length; i++) {
                const p = integerPosition(t.supply[i].x, t.supply[i].y);
                const [x, y] = this.camera.toScreen(p[0], p[1], this.cw, this.ch);
                ctx.lineTo(x, y);
                prev = p;
            }
            ctx.stroke();
        }
        ctx.restore();

        if (view.dragPath && view.dragPath.length > 1) {
            ctx.save();
            ctx.lineWidth = Math.max(2, this.camera.zoom * 0.09);
            ctx.strokeStyle = view.dragValid === false ? 'rgba(230,120,60,0.75)' : 'rgba(235,245,255,0.85)';
            ctx.lineCap = 'round';
            ctx.beginPath();
            for (let i = 0; i < view.dragPath.length; i++) {
                const p = integerPosition(view.dragPath[i].x, view.dragPath[i].y);
                const [x, y] = this.camera.toScreen(p[0], p[1], this.cw, this.ch);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.restore();
        }
    }

    drawTowers(ctx, game, visible, view) {
        const z = this.camera.zoom;
        const size = Math.max(10, z * 1.25);
        for (const t of visible) {
            if (this.fog && !this.fog(t)) continue;
            const a = integerPosition(t.x, t.y);
            const [sx, sy] = this.camera.toScreen(a[0], a[1], this.cw, this.ch);
            const c = this.colorFor(game, t.owner, view);

            // Plinth.
            ctx.beginPath();
            ctx.arc(sx, sy + size * 0.30, size * 0.46, 0, Math.PI * 2);
            ctx.fillStyle = t.owner == null ? 'rgba(30,34,36,0.75)'
                : `rgba(${this.shade(c, 0.45)},0.9)`;
            ctx.fill();

            // A faint owner ring behind the glyph (the glyph itself is a DOM <img>).
            if (t.owner != null) {
                ctx.beginPath();
                ctx.arc(sx, sy - size * 0.42, size * 0.62, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(${this.shade(c, 1.2)},0.35)`;
                ctx.lineWidth = Math.max(1, size * 0.06);
                ctx.stroke();
            }

            // Selection / hover ring.
            if (view && view.selected && view.selected.x === t.x && view.selected.y === t.y) {
                ctx.beginPath();
                ctx.arc(sx, sy + size * 0.30, size * 0.58, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Unit badges under the tower.
            if (z > 11) this.drawUnits(ctx, t, sx, sy + size * 0.30, size);

            // Delay / EMP indicator.
            if (t.delay > 0) {
                ctx.globalAlpha = 0.45;
                ctx.fillStyle = '#1b1f21';
                ctx.beginPath();
                ctx.arc(sx, sy - size * 0.36, size * 0.42, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#ffd166';
                ctx.font = `${Math.max(9, size * 0.34)}px system-ui, sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(Math.ceil(t.delay / 4) + 's', sx, sy - size * 0.28);
            }
        }
    }

    drawUnits(ctx, t, cx, cy, size) {
        const counts = t.units.counts();
        if (!counts.length) return;
        const cap = {};
        for (const [u] of counts) cap[u] = t.units.capacity(u, t.type);
        // Shields as a ring, the rest as a compact bar of pips.
        const shield = t.units.get(SHIELD);
        if (shield) {
            const max = Math.max(1, t.units.capacity(SHIELD, t.type));
            const r = size * 0.36;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(150,175,220,0.35)';
            ctx.lineWidth = Math.max(1.5, size * 0.09);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, shield / max));
            ctx.strokeStyle = 'rgba(180,205,255,0.95)';
            ctx.stroke();
        }
        const rest = counts.filter(([u]) => u !== SHIELD);
        if (!rest.length) return;
        // Kiomet draws a tiny formation of unit glyphs under the tower; we do the same when
        // there is room, and fall back to colour pips when zoomed far out.
        const total = rest.reduce((n, [, c]) => n + c, 0);
        const maxPips = 9;
        const pip = size * 0.22;
        const rows = Math.min(3, Math.ceil(Math.min(total, maxPips) / 3));
        const shown = Math.min(total, maxPips);
        const ox = cx, oy = cy + size * 0.02;
        const colour = this.shade(this.colorFor(null, null, null), 1);
        if (size >= 26 && shown <= 8) {
            let left = shown, i = 0;
            // A faint dark halo keeps the pale glyphs readable on the dark plinth.
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.85)';
            ctx.shadowBlur = Math.max(2, pip * 0.35);
            for (const [u, c] of rest) {
                let count = c;
                while (count > 0 && left > 0) {
                    const col = i % 3, row = Math.floor(i / 3);
                    const x = ox + (col - 1) * pip * 0.95;
                    const y = oy + row * pip * 0.78;
                    const img = this.unitGlyph(UNITS[u].name, UNIT_TINT_RGB[u] || [200, 210, 228]);
                    if (img.complete && img.naturalWidth) {
                        ctx.drawImage(img, x - pip / 2, y - pip / 2, pip, pip);
                    }
                    count -= 1; left -= 1; i += 1;
                }
            }
            ctx.restore();
        } else {
            const maxBar = size * 1.05;
            const w = Math.min(maxBar, Math.max(size * 0.16, Math.sqrt(total) * size * 0.10));
            let x = cx - w / 2;
            const y = cy + size * 0.10;
            const h = Math.max(2, size * 0.10);
            for (const [u, c] of rest) {
                const frac = c / total;
                ctx.fillStyle = UNIT_TINT[u] || '#dfe6ee';
                ctx.fillRect(x, y, Math.max(1.5, w * frac - 1), h);
                x += w * frac;
            }
        }
    }

    // Kiomet's "T" marker: a small diamond bobbing over every tower of the selected kind,
    // drawn whenever `view.markType` matches (the app sets it while T is held).
    drawMarkers(ctx, game, view) {
        if (!view || !view.markType) return;
        const z = this.camera.zoom;
        const scale = Math.max(2, z * 0.025);
        const bob = Math.abs(Math.sin((performance.now() / 1000) * Math.PI));
        for (const t of game.towers.values()) {
            if (t.type !== view.markType) continue;
            if (this.fog && !this.fog(t)) continue;
            const a = integerPosition(t.x, t.y);
            const [sx, sy] = this.camera.toScreen(a[0], a[1], this.cw, this.ch);
            if (sx < -20 || sy < -20 || sx > this.cw + 20 || sy > this.ch + 20) continue;
            const y = sy - z * 0.95 - scale * (0.45 + bob * 0.12);
            const w = scale * 0.9, h = scale * 1.2;
            ctx.beginPath();
            ctx.moveTo(sx, y - h / 2);
            ctx.lineTo(sx + w, y);
            ctx.lineTo(sx, y + h / 2);
            ctx.lineTo(sx - w, y);
            ctx.closePath();
            ctx.fillStyle = `rgba(255,255,255,${0.55 + bob * 0.35})`;
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.45)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }

    drawForces(ctx, game, view) {
        const z = this.camera.zoom;
        const r = Math.max(3, z * 0.22);
        for (const f of game.forces) {
            if (f.idx >= f.path.length - 1) continue;   // already parked somewhere
            if (this.fog && view && f.owner !== view.playerId &&
                !(view.allies && view.allies.has(f.owner)) &&
                !this.fog(f.source) && !this.fog(f.destination)) continue;
            const [wx, wy] = f.position(0);
            const [sx, sy] = this.camera.toScreen(wx, wy, this.cw, this.ch);
            if (sx < -40 || sy < -40 || sx > this.cw + 40 || sy > this.ch + 40) continue;
            const c = this.colorFor(game, f.owner, view);
            ctx.beginPath();
            ctx.arc(sx, sy, r, 0, Math.PI * 2);
            ctx.fillStyle = f.owner == null ? 'rgba(120,120,120,0.85)' : `rgb(${this.shade(c, 1.05)})`;
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.35)';
            ctx.lineWidth = 1;
            ctx.stroke();
            // The lead unit's glyph on the marker, like the real game's marching columns.
            if (z > 15) {
                const lead = f.units.counts().filter(([u]) => u !== SHIELD).sort((a, b) => b[1] - a[1])[0];
                if (lead) {
                    const img = this.unitGlyph(UNITS[lead[0]].name, [235, 242, 250]);
                    const gs = r * 1.7;
                    if (img.complete && img.naturalWidth) ctx.drawImage(img, sx - gs / 2, sy - gs / 2, gs, gs);
                }
            }
            if (z > 13) {
                const n = f.units.counts().reduce((s, [, c2]) => s + c2, 0);
                ctx.fillStyle = 'rgba(20,24,26,0.85)';
                ctx.font = `bold ${Math.max(8, r * 1.15)}px system-ui, sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(String(n), sx, sy - r * 1.4);
            }
        }
    }

    drawSelection(ctx, game, view) {
        if (!view || !view.selected) return;
        const t = game.getTower(view.selected);
        if (!t) return;
        const z = this.camera.zoom;
        const a = integerPosition(t.x, t.y);
        const [sx, sy] = this.camera.toScreen(a[0], a[1], this.cw, this.ch);
        ctx.beginPath();
        ctx.arc(sx, sy + z * 0.30, z * 0.95, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // SVG glyph for a tower type, stroked in `color`. Cached per (type, colour).
    glyph(type, color) {
        const key = type + ':' + color.join(',');
        let img = this.glyphCache.get(key);
        if (!img) {
            const svg = (TOWER_SVG[type] || '')
                .replace(/stroke="#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?"/g, `stroke="rgb(${color.join(',')})"`);
            img = new Image();
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
            this.glyphCache.set(key, img);
        }
        return img;
    }

    // Unit glyph, stroked in `color` (the same shapes the real game draws next to towers).
    unitGlyph(name, color) {
        const key = name + ':' + color.join(',');
        let img = this.unitCache.get(key);
        if (!img) {
            const svg = (UNIT_SVG[name] || '')
                .replace(/stroke="#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?"/g, `stroke="rgb(${color.join(',')})"`);
            img = new Image();
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
            this.unitCache.set(key, img);
        }
        return img;
    }

    shade(c, k) {
        return [c[0], c[1], c[2]].map((v) => Math.max(0, Math.min(255, Math.round(v * k)))).join(',');
    }
}

const UNIT_TINT_RGB = {
    [UNIT_ID.Fighter]: [127, 209, 255],
    [UNIT_ID.Chopper]: [155, 225, 93],
    [UNIT_ID.Bomber]: [255, 209, 102],
    [UNIT_ID.Tank]: [242, 166, 90],
    [UNIT_ID.Soldier]: [232, 238, 246],
    [UNIT_ID.Shell]: [255, 159, 28],
    [UNIT_ID.Emp]: [76, 201, 240],
    [UNIT_ID.Nuke]: [255, 77, 77],
    [UNIT_ID.Ruler]: [255, 215, 0],
};

const UNIT_TINT = {
    [UNIT_ID.Fighter]: '#7fd1ff',
    [UNIT_ID.Chopper]: '#9be15d',
    [UNIT_ID.Bomber]: '#ffd166',
    [UNIT_ID.Tank]: '#f2a65a',
    [UNIT_ID.Soldier]: '#e8eef6',
    [UNIT_ID.Shell]: '#ff9f1c',
    [UNIT_ID.Emp]: '#4cc9f0',
    [UNIT_ID.Nuke]: '#ff4d4d',
    [UNIT_ID.King]: '#ffd700',
};

// ---- effects.js ----
// SPDX-FileCopyrightText: 2026 Kiomet clone contributors

//
// Battle feedback: sparks when a fight lands, expanding rings for EMP/nuke/shell, floating
// "+1 capture" pings, and a tiny WebAudio synthesiser (no asset needed).



class Effects {
    constructor() {
        this.items = [];          // {kind, x, y, t, life, ...}
        this.audio = null;
        this.enabled = true;
    }

    clear() { this.items.length = 0; }

    // Map an engine event to particles. `x, y` are world coordinates.
    onEvent(e, worldPos) {
        if (!this.enabled || !worldPos) return;
        const [x, y] = worldPos;
        switch (e.type) {
            case 'shell':
                this.ring(x, y, 10, 26, '#ffb347', 420);
                this.play('hit', 0.35, x, y);
                break;
            case 'emp':
                this.ring(x, y, 6, 46, '#4cc9f0', 700);
                this.play('emp', 0.5, x, y);
                break;
            case 'nuke':
                this.ring(x, y, 8, 90, '#ff5a5a', 900);
                this.ring(x, y, 4, 60, '#ffd166', 650);
                this.play('nuke', 0.6, x, y);
                break;
            case 'ruler':
                this.ring(x, y, 6, 50, '#ffd166', 900);
                this.play('ruler', 0.7, x, y);
                this.float(x, y, 'King lost!', '#ffd166', 1400);
                break;
            case 'gained':
                this.spark(x, y, 7, '#8fd3ff');
                // Kiomet only chimes when *you* capture a tower from someone else.
                if (this.meId != null && e.player === this.meId && e.capturedFrom != null) {
                    this.play('capture', 0.18, x, y);
                }
                break;
            case 'lostTower':
                this.spark(x, y, 5, '#ff8f7a');
                // ... and only wails when *you* lose one.
                if (this.meId != null && e.player === this.meId) this.play('loss', 0.5, x, y);
                break;
            case 'lostForce':
                this.spark(x, y, 4, '#cfcfcf');
                if (this.meId != null && e.player === this.meId) this.play('pain', 0.4, x, y);
                break;
            case 'died':
                this.play('loss', 0.5, x, y);
                break;
            case 'upgrade':
                this.ring(x, y, 4, 22, '#ffffff', 400);
                this.play('upgrade', 0.2, x, y);
                break;
            default:
                break;
        }
    }

    spill(x, y, n, colour) {
        for (let i = 0; i < n; i++) {
            const a = Math.random() * Math.PI * 2;
            const speed = 12 + Math.random() * 26;
            this.items.push({
                kind: 'spark', x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
                t: 0, life: 0.35 + Math.random() * 0.3, colour,
            });
        }
    }

    spark(x, y, n, colour) { this.spill(x, y, n, colour); }

    ring(x, y, r0, r1, colour, life) {
        this.items.push({ kind: 'ring', x, y, r0, r1, t: 0, life: life / 1000, colour });
    }

    float(x, y, text, colour, life) {
        this.items.push({ kind: 'float', x, y, text, colour, t: 0, life: life / 1000 });
    }

    // Advance and draw. `toScreen` converts world (x, y) to canvas pixels.
    render(ctx, toScreen, zoom, dt = 1 / 60) {
        if (!this.items.length) return;
        dt = Math.min(0.1, Math.max(0.001, dt));
        for (const it of this.items) {
            it.t += dt;
            const k = Math.min(1, it.t / it.life);
            const [sx, sy] = toScreen(it.x, it.y);
            if (it.kind === 'spark') {
                ctx.globalAlpha = 1 - k;
                ctx.fillStyle = it.colour;
                const sz = Math.max(1.5, zoom * 0.09);
                ctx.fillRect(sx + it.vx * it.t * zoom - sz / 2, sy + it.vy * it.t * zoom - sz / 2 + 12 * it.t * it.t * zoom, sz, sz);
            } else if (it.kind === 'ring') {
                ctx.globalAlpha = (1 - k) * 0.9;
                ctx.strokeStyle = it.colour;
                ctx.lineWidth = Math.max(1.2, zoom * 0.06) * (1 - k * 0.6);
                ctx.beginPath();
                ctx.arc(sx, sy, (it.r0 + (it.r1 - it.r0) * k) * zoom * 0.12 + 4, 0, Math.PI * 2);
                ctx.stroke();
            } else if (it.kind === 'float') {
                ctx.globalAlpha = 1 - k;
                ctx.fillStyle = it.colour;
                ctx.font = `bold ${Math.max(11, zoom * 0.5)}px system-ui, sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(it.text, sx, sy - 20 - k * 26);
            }
        }
        ctx.globalAlpha = 1;
        this.items = this.items.filter((it) => it.t < it.life);
    }

    // ---- audio: small synthesised blips, created on first user gesture ----
    ensureAudio() {
        if (this.audio || !this.enabled) return this.audio;
        const AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
        if (!AC) return null;
        try { this.audio = new AC(); } catch { this.audio = null; }
        return this.audio;
    }

    // `at` = world position: the real client scales volume by distance from the camera
    // (1 / (1 + distance)) and we add a small per-sound rate limit.
    play(kind, vol = 0.3, at) {
        if (!this.enabled) return;
        const ac = this.ensureAudio();
        if (!ac || ac.state === 'suspended') return;
        if (at && Array.isArray(at) && this.cameraAt) {
            const d = Math.hypot(at[0] - this.cameraAt[0], at[1] - this.cameraAt[1]) / 120;
            vol *= 1 / (1 + d);
        }
        vol = Math.max(0, Math.min(1, Number.isFinite(vol) ? vol : 0.2));
        if (vol < 0.02) return;
        const now0 = performance.now();
        this.lastPlay = this.lastPlay || new Map();
        if (now0 - (this.lastPlay.get(kind) || 0) < 90) return;
        this.lastPlay.set(kind, now0);
        const now = ac.currentTime;
        const o = ac.createOscillator();
        const g = ac.createGain();
        const table = {
            hit: { type: 'square', f0: 320, f1: 160, dur: 0.08 },
            capture: { type: 'triangle', f0: 520, f1: 780, dur: 0.12 },
            upgrade: { type: 'sine', f0: 660, f1: 990, dur: 0.16 },
            emp: { type: 'sawtooth', f0: 720, f1: 90, dur: 0.35 },
            nuke: { type: 'sawtooth', f0: 180, f1: 40, dur: 0.7 },
            ruler: { type: 'sine', f0: 440, f1: 110, dur: 0.8 },
            loss: { type: 'sine', f0: 300, f1: 80, dur: 1.2 },
            pain: { type: 'triangle', f0: 240, f1: 120, dur: 0.25 },
        }[kind];
        if (!table) return;
        o.type = table.type;
        o.frequency.setValueAtTime(table.f0, now);
        o.frequency.exponentialRampToValueAtTime(Math.max(20, table.f1), now + table.dur);
        g.gain.setValueAtTime(vol, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + table.dur);
        o.connect(g).connect(ac.destination);
        o.start(now);
        o.stop(now + table.dur + 0.02);
    }
}

// ---- alerts.js ----
// SPDX-FileCopyrightText: 2026 Kiomet clone contributors
// SPDX-License-Identifier: AGPL-3.0-or-later
//
// The alerts the real game shows at the top of the screen, ported from
// common/src/alerts.rs and client/src/ui/alert_overlay.rs:
//   * your King is unsafe / under attack (takes priority)
//   * the opening tutorial (capture a tower, then upgrade one)
//   * a tower is full / overflowing
//   * zombies are attacking
// Each one carries a tower so clicking it can jump there.




// Keys, not text: the board is re-evaluated every game second, so the strings are looked up
// on the fly and a language switch is picked up on the next tick.
const ALERT_KINDS = [
    'rulerAttack', 'rulerUnsafe', 'capture', 'upgrade', 'full', 'overflow', 'zombies',
];

class AlertBoard {
    constructor() {
        this.tutorial = 'capture';        // 'capture' | 'upgrade' | 'done'
        this.dismissed = new Set();       // one-shot dismissals for this run
        this.zombieSeen = false;
        this.last = [];
    }

    reset() {
        this.tutorial = 'capture';
        this.dismissed.clear();
        this.zombieSeen = false;
        this.last = [];
    }

    dismiss(kind) { this.dismissed.add(kind); }

    // Recompute every second, exactly like the server does for Alerts.
    evaluate(game, me) {
        const out = [];
        if (!me.alive) { this.last = out; return out; }

        const mine = [...me.towers].map((k) => game.towers.get(k)).filter((t) => t && t.owner === me.id);
        const king = mine.find((t) => t.units.hasRuler());
        const ks = king ? { x: king.x, y: king.y } : null;

        if (king) {
            const incoming = king.inbound.filter((f) => f.owner !== me.id &&
                game.relationship(me.id, f.owner) === 'enemy');
            const shields = king.units.get(SHIELD);
            const need = TOWER[king.type].maxRangedDamage();
            // Kiomet treats a missing tower or an enemy tower as unsafe; empty (neutral)
            // towers don't count against you.
            const neighboursOwned = [...neighborsOf(king)].every((n) => {
                const t = game.getTower(n);
                return !t || t.owner == null || t.owner === me.id;
            });
            const safe = (shields >= need || neighboursOwned) &&
                !incoming.some((f) => f.owner !== me.id);
            if (incoming.length && !safe) {
                out.push(this.item('rulerAttack', ks));
            } else if (!safe && !this.dismissed.has('rulerUnsafe')) {
                out.push(this.item('rulerUnsafe', ks));
            }
        }

        // Tutorial: nudge after a few seconds if the player hasn't done it yet.
        if (this.tutorial !== 'done' && game.time > 12 && !this.dismissed.has(this.tutorial)) {
            const target = this.tutorial === 'capture'
                ? (mine[0] || null)
                : (mine.find((t) => t.active && TOWER[t.type].upgrades.length) || null);
            if (target) out.push(this.item(this.tutorial, { x: target.x, y: target.y }));
        }

        const { full, overflow, zombie } = this.health(game, mine);
        if (full && !this.dismissed.has('full')) out.push(this.item('full', full));
        if (overflow && !this.dismissed.has('overflow')) out.push(this.item('overflow', overflow));
        if (zombie && !this.dismissed.has('zombies')) out.push(this.item('zombies', zombie));

        this.last = out;
        return out;
    }

    item(kind, tower) {
        return { kind, title: t(`alert.${kind}.title`), hint: t(`alert.${kind}.hint`), tower };
    }

    // "A tower is full / overflowing" + "zombies are attacking this tower".
    health(game, mine) {
        let full = null, overflow = null, zombie = null;
        for (const t of mine) {
            if (!t.active) continue;
            for (const [u, c] of t.units.counts()) {
                if (!isMobile(u, t.type)) continue;
                const cap = t.units.capacity(u, t.type);
                const generates = TOWER[t.type].genPeriod(u) != null;
                if (c > cap) overflow = overflow || { x: t.x, y: t.y };
                else if (c === cap && generates && !t.supply) full = full || { x: t.x, y: t.y };
            }
            if (!zombie && t.inbound.some((f) => f.owner === null)) zombie = { x: t.x, y: t.y };
        }
        return { full, overflow, zombie };
    }

    // Called by the app when the player actually does the tutorial step.
    onCapture() { if (this.tutorial === 'capture') this.tutorial = 'upgrade'; }
    onUpgrade() { if (this.tutorial === 'upgrade') this.tutorial = 'done'; }
}

function* neighborsOf(t) {
    for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
            if (!dx && !dy) continue;
            yield { x: t.x + dx, y: t.y + dy };
        }
    }
}

// Translation layer. Every user-visible string lives in src/i18n/<lang>.js; the game code

// translation falls back to Chinese (the default language) instead of showing a raw key.
//
// Layout direction: a language may declare `dir: 'rtl'`. `applyDirection()` puts it on the
// <html> element, where the [dir="rtl"] rules in index.html mirror the absolute UI.







// In the single-file build the bundler strips imports and rewrites `export default X` to
// `const __default_<module> = X`, which drops the original binding name. Resolve each

    { code: 'en', dict: () => raw('en', '__default_i18n_en_js') },
    { code: 'ja', dict: () => raw('ja', '__default_i18n_ja_js') },

// Alias used by the UI picker (kept separate from the storage helpers below).

    return currentCode;

// shows up in the UI instead of silently rendering "undefined".

const D = (id) => document.getElementById(id);

class App {
    constructor() {

        setLang(resolveLang());

        this.godMode = localStorage.getItem('kiomet-god') === '1';
        // Fog of war (on by default, like the real game). B toggles it, as upstream cheats do.
        this.fogEnabled = localStorage.getItem('kiomet-fog') !== '0';
        this.speed = 1;
        this.paused = false;
        this.selected = null;
        this.drag = null;               // {from, to, startTime, path}
        this.pan = null;
        this.pinching = null;

    // ---------------- game lifecycle ----------------
    newGame(keepName) {
        const me = new Player(0, this.name, { rank: 3 });
        this.me = me;
        const bots = [];
        const botNames = ['Borus', 'Cynder', 'Draven', 'Eldra', 'Fenn', 'Grim', 'Hollis', 'Isolde',
            'Jorik', 'Kael', 'Lysa', 'Mira', 'Nyx', 'Orin', 'Perrin', 'Quill'];
        for (let i = 0; i < 9; i++) {
            const n = botNames[(i * 5 + Math.floor(Math.random() * 16)) % botNames.length];
            bots.push(new Player(i + 1, n + (i > 7 ? i : ''), { bot: true, rank: 1 }));
        }
        const game = new Game({
            shrink: true,
            botUpdate: (g, p) => {
                if (p.id === 0) return;
                botUpdate(g, p);
            },
        });
        game.players = [me, ...bots];
        game.onEvent = (e) => this.onGameEvent(e);
        this.visibility = new Visibility();
        this.effects = new Effects();
        this.alertBoard = new AlertBoard();
        this.game = game;
        game.spawnPlayer(me);
        for (const b of bots) {
            if (Math.random() < 0.75) game.spawnPlayer(b);
        }
        if (this.effects) this.effects.clear();
        if (this.alertBoard) this.alertBoard.reset();
        this.camera.x = 1280; this.camera.y = 1280; this.camera.zoom = 16;
        if (me.rulerKey != null) this.panToKey(me.rulerKey, false);
        this.selected = null;
        this.renderMenu();
        this.renderAlerts();
        this.showDeath(false);
    }

    panToKey(k, animate = true) {
        const t = this.game.towers.get(k);
        if (!t) return;
        const p = integerPosition(t.x, t.y);
        this.camera.x = p[0]; this.camera.y = p[1];
    }

    centreOn(t) {
        const p = integerPosition(t.x, t.y);
        this.camera.x = p[0]; this.camera.y = p[1];
    }

    // ---------------- frame loop ----------------
    frame(now) {
        const dt = Math.min(0.25, (now - this.lastFrame) / 1000);
        this.lastFrame = now;
        if (!this.paused) {
            this.acc += dt * this.speed;
            // Cap the catch-up steps: after a long stall (tab switch, heavy GC) running eight
            // ticks in one frame turns a stumble into a freeze. Two is enough to stay smooth;
            // the surplus is dropped and the clock stays in the past rather than snowballing.
            let steps = 0;

                this.game.tick();
                this.visibility.invalidate();

            }

        this.syncIcons();

            allies: this.me.allies,
            selected: this.selected,
            dragPath: this.dragPath,

    // A selected tower can disappear between frames (captured by an enemy, razed, or the map
    // regenerated). Checking here once per frame keeps the panel honest without making
    // positionMenu() mutate state.
    validateSelection() {
        if (!this.selected) return;

    // Adaptive quality: if frames consistently exceed the budget, step the canvas resolution
    // down; if there is plenty of headroom again, step it back up. This is the cheap version of

    handleKeyboardPan(dt) {

        let dx = 0, dy = 0;

        if (this.keys.has('d') || this.keys.has('arrowright')) dx += sp;

        if (!t || !this.drag.moved) { this.dragPath = null; return; }
        const maxEdge = this.drag.from.forceUnits().maxEdgeDistance();
        const path = this.game.findBestPath(this.drag.from.id, t.id, maxEdge, this.me.id);
        this.drag.path = path;
        this.dragPath = path || [this.drag.from.id, t.id];
        this.dragValid = !!path;
    }

    // Kiomet makes you *hold* the pointer on the destination before it will march the King
    // through land you don't own (RULER_DRAG_DELAY).
    rulerNeedsConfirm(drag) {
        const path = drag.path;
        if (!path || !drag.to) return false;
        if (!drag.from.units.hasRuler()) return false;
        const perilous = path.some((id) => {
            const t = this.game.getTower(id);
            return !t || t.owner !== this.me.id;
        });
        if (!perilous) return false;
        return (performance.now() - (drag.hoverSince || 0)) < 1200;
    }

    finishDrag(e) {
        const drag = this.drag;
        this.drag = null;
        this.dragPath = null;
        if (!drag.moved) {
            // A click: select the tower / close the menu.
            this.selectTower(drag.from);
            return;
        }
        if (!drag.to) return;
        const path = drag.path;
        if (!path) return;
        if (this.rulerNeedsConfirm(drag)) {
            this.toast('toast.kingConfirm');
            return;
        }
        const src = drag.from;
        const sameAsSelection = this.selected && this.selected.x === src.x && this.selected.y === src.y;
        const err = sameAsSelection
            ? this.game.setSupplyLine(this.me.id, src.id, path)
            : this.game.deploy(this.me.id, src.id, path);
        if (err) this.toast(err);
        else if (!sameAsSelection) this.alertBoard.onCapture();
    }

    // Shift+R: drop the selected tower's line, else one visible line per press (like upstream).
    clearSupplyLines() {
        const mine = [...this.me.towers].map((k) => this.game.towers.get(k)).filter(Boolean);
        const sel = this.selected ? this.game.getTower(this.selected) : null;
        if (sel && sel.supply) {
            this.game.setSupplyLine(this.me.id, sel.id, null);
            this.renderMenu();
            return;
        }
        const line = mine.find((t) => t.supply);
        if (line) {
            this.game.setSupplyLine(this.me.id, line.id, null);
            this.toast('toast.supplyRemoved');
        } else {
            this.toast('toast.supplyNone');
        }
    }

    selectTower(t) {
        // Toggle only against a *live* tower. The old check compared coordinates, so once the
        // selected tower was captured/destroyed its lookup returned null and renderMenu() kept
        // the stale panel on screen with no way to dismiss it.
        const sel = this.selected ? this.game.getTower(this.selected) : null;
        if (sel && t && sel.x === t.x && sel.y === t.y) {
            this.selected = null;
        } else {
            this.selected = { x: t.x, y: t.y };
        }
        this.renderMenu();
    }

    // Single exit path for closing the tower panel, so no caller can leave a hidden-but-stale
    // selection behind.
    dismissMenu() {
        if (!this.selected) return;
        this.selected = null;
        this.renderMenu();
    }

    // ---------------- menu ----------------
    positionMenu() {
        const menu = D('tower-menu');
        const t = this.selected ? this.game.getTower(this.selected) : null;
        // Do NOT null the selection here: positionMenu() runs every frame, and clearing the
        // selection from inside it means a tower that vanishes (captured, destroyed, or
        // replaced) silently strands the panel. renderMenu() owns the hide.
        if (!t) { menu.classList.add('hidden'); return; }
        const p = integerPosition(t.x, t.y);
        const [sx, sy] = this.camera.toScreen(p[0], p[1], this.renderer.cw, this.renderer.ch);
        const w = menu.offsetWidth || 200, h = menu.offsetHeight || 120;
        let left = sx + 18, top = sy - h / 2;
        if (left + w > this.renderer.cw - 8) left = sx - w - 18;
        top = Math.max(8, Math.min(this.renderer.ch - h - 8, top));
        menu.style.left = left + 'px';
        menu.style.top = top + 'px';
    }

    renderMenu() {
        const menu = D('tower-menu');
        menu.innerHTML = '';
        // Named `tower`, not `t`: `t` is the translation function and must stay callable here.
        const tower = this.selected ? this.game.getTower(this.selected) : null;
        if (!tower) {
            // The selected tower is gone (captured, razed, or the map regenerated): drop the
            // stale selection so the next frame doesn't try to reposition a phantom panel.
            this.selected = null;
            menu.classList.add('hidden');
            return;
        }
        menu.classList.remove('hidden');

        // Explicit close button: mouse users can always dismiss the panel without hunting for
        // the same tower again, and touch users get a target that isn't a 3px tap radius.
        const close = el('button', 'tm-close', '✕');
        close.type = 'button';
        close.title = t('common.close');
        close.setAttribute('aria-label', t('common.close'));
        close.addEventListener('pointerdown', (ev) => ev.stopPropagation());
        close.addEventListener('click', (ev) => { ev.stopPropagation(); this.dismissMenu(); });
        menu.appendChild(close);

        const isMine = tower.owner === this.me.id;
        const type = TOWER[tower.type];
        const head = el('div', 'tm-head');
        head.appendChild(el('img', 'tm-icon', ''));
        head.querySelector('img').src = this.svgUrl(tower.type, 'rgb(116,185,255)');
        head.appendChild(el('span', 'tm-title', tName('tower', tower.type)));
        if (tower.owner != null) {
            const p = this.game.players[tower.owner];
            head.appendChild(el('span', 'tm-owner', p ? p.name : ''));
        }
        menu.appendChild(head);

        if (tower.delay > 0) {
            menu.appendChild(el('div', 'tm-delay', t('menu.upgrading', { seconds: Math.ceil(tower.delay / TICK_HZ) })));
        }

        // Unit rows (only what the tower can make, or already holds).
        const rows = el('div', 'tm-units');
        for (const [u, c] of tower.units.counts()) {
            const cap = tower.units.capacity(u, tower.type);
            rows.appendChild(this.unitRow(u, c, cap));
        }
        for (const name of Object.keys(type.gen)) {
            const u = UNIT_ID[name];
            if (c2(tower, u)) continue;
            rows.appendChild(this.unitRow(u, 0, tower.units.capacity(u, tower.type)));
        }
        if (tower.units.hasRuler()) rows.appendChild(this.unitRow(RULER, 1, 1));
        menu.appendChild(rows);

        if (isMine && tower.active) {
            const ups = el('div', 'tm-ups');
            const opts = [...TOWER[tower.type].upgrades];
            if (type.basis !== tower.type) opts.push(type.basis);
            for (const name of opts) {
                const up = TOWER[name];
                const down = name === type.basis;
                const ok = down ? true : meetsPrereqs(name, this.me.towerCounts);
                const row = el('button', 'tm-up' + (down ? ' down' : '') + (ok ? '' : ' locked'));
                row.title = t(down ? 'menu.downgradeTo' : 'menu.upgradeTo', { tower: tName('tower', name) });
                const ic = el('img', 'tm-up-icon');
                ic.src = this.svgUrl(name, down ? 'rgb(192,57,43)' : 'rgb(116,185,255)');
                row.appendChild(ic);
                if (!down) {
                    const req = el('div', 'tm-req');
                    for (const [pre, n] of up.prereqs) {
                        const have = this.me.towerCounts[pre] || 0;
                        const r = el('span', 'tm-req-item' + (have >= n ? ' ok' : ''));
                        const im = el('img', 'tm-req-icon');
                        im.src = this.svgUrl(pre, have >= n ? 'rgb(116,185,255)' : 'rgb(150,150,150)');
                        r.appendChild(im);
                        r.appendChild(el('b', '', `${have}/${n}`));
                        req.appendChild(r);
                    }
                    row.appendChild(req);
                }
                row.addEventListener('click', (ev) => {
                    ev.stopPropagation();
                    if (!ok) { this.toast('toast.prereq'); return; }
                    const err = this.game.upgradeTower(this.me.id, tower.id, name);
                    if (err) this.toast(err);
                    else { this.alertBoard.onUpgrade(); this.renderMenu(); }
                });
                ups.appendChild(row);
            }
            menu.appendChild(ups);

            if (tower.supply) {
                const b = el('button', 'tm-btn', t('menu.cancelSupply'));
                b.addEventListener('click', () => {
                    this.game.setSupplyLine(this.me.id, tower.id, null);
                    this.renderMenu();
                });
                menu.appendChild(b);
            }
            menu.appendChild(el('div', 'tm-hint', t(tower.generatesMobile() ? 'menu.hintMobile' : 'menu.hintStatic')));
        } else if (tower.owner != null && tower.owner !== this.me.id) {
            const p = this.game.players[tower.owner];
            const allied = this.me.allies.has(tower.owner);
            const pending = p && p.allies.has(this.me.id) && !allied;
            const b = el('button', 'tm-btn' + (allied ? ' danger' : ''),
                t(allied ? 'menu.breakAlly' : (pending ? 'menu.acceptAlly' : 'menu.requestAlly')));
            b.addEventListener('click', (ev) => {
                ev.stopPropagation();
                this.game.requestAlliance(this.me.id, tower.owner);
                this.renderMenu();
            });
            menu.appendChild(b);
        } else {
            menu.appendChild(el('div', 'tm-hint', tower.owner == null ? t('menu.unowned') : ''));
        }

        this.positionMenu();
    }

    svgUrl(type, color) {
        const svg = (TOWER_SVG[type] || '').replace(/stroke="#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?"/g, `stroke="${color}"`);
        return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
    }

    unitRow(u, count, cap) {
        const row = el('div', 'tm-unit');
        row.title = tName('unit', UNITS[u].name);
        const badge = el('span', 'unit-' + UNITS[u].name.toLowerCase());
        row.appendChild(badge);
        row.appendChild(el('span', 'tm-count', `${count}/${cap}`));
        if (TOWER_GEN_HINT[u]) row.appendChild(el('span', 'tm-gen', TOWER_GEN_HINT[u]));
        return row;
    }

    // ---------------- language ----------------
    // Every static label, tooltip and placeholder is rewritten from the dictionary. Anything
    // that is rebuilt per frame or per selection (leaderboard, tower menu, alerts, dialogs)
    // is redrawn right after so the switch is instant, with no reload.
    applyLanguage() {
        const setText = (id, key) => { const e = D(id); if (e) e.textContent = t(key); };
        const setTitle = (id, key) => { const e = D(id); if (e) e.title = t(key); };
        const setPh = (id, key) => { const e = D(id); if (e) e.placeholder = t(key); };

        document.title = t('app.title');

        // Top bar.
        setText('lbl-score', 'hud.score');
        setText('lbl-towers', 'hud.towers');
        setText('lbl-life', 'hud.life');

        setPh('chat-input', 'chat.placeholder');

        setTitle('zoom-out', 'zoom.out');
        setTitle('zoom-in', 'zoom.in');
        setTitle('center-btn', 'zoom.center');

        setTitle('pause-btn', this.paused ? 'btn.resume' : 'btn.pause');
        setTitle('speed-btn', 'btn.speed');
        setTitle('god-btn', 'btn.god');
        setTitle('fog-btn', 'btn.fogTitle');
        setText('god-btn', 'btn.god');
        setText('fog-btn', this.fogEnabled ? 'btn.fog' : 'btn.fogOff');
        setText('help-btn', 'btn.help');
        setText('towers-btn', 'btn.towers');
        setText('units-btn', 'btn.units');
        setText('newgame-btn', 'btn.newgame');

        setText('spawn-sub', 'spawn.sub');
        setPh('name-input', 'spawn.name');
        setText('play-btn', 'spawn.play');
        setText('dialog-close', 'common.close');

        this.renderLangPicker();
        this.buildTowerLabels();
        // Live widgets.
        this.updateHud();
        this.renderMenu();
        this.lastAlertSig = null;
        this.renderGameAlerts();
        this.retranslateAlerts();
        this.renderAlertList();
        this.showDeath(false);
        if (this.dialogKind) this.openDialog(this.dialogKind);
    }

    // The picker in the top-right corner: a <select> keeps native keyboard/AT behaviour and
    // costs nothing, and each option carries the language's own name so it is findable in
    // whatever language the player reads.
    renderLangPicker() {
        const sel = D('lang-select');
        if (!sel) return;
        const cur = langCode();
        if (!sel.dataset.built) {
            sel.innerHTML = '';
            for (const code of langCodes()) {
                const o = document.createElement('option');
                o.value = code;
                o.textContent = metaOf(code).name;
                sel.appendChild(o);
            }
            sel.dataset.built = '1';
            sel.addEventListener('change', () => this.setLanguage(sel.value));
        }
        sel.value = cur || sel.value;
        sel.title = t('common.language');
        sel.setAttribute('aria-label', t('common.language'));
    }

    setLanguage(code) {
        if (code === langCode()) return;
        setLang(code);
        this.applyLanguage();
    }

    // Tower/unit names are used all over the UI; resolve them once per language change.
    buildTowerLabels() {
        for (const tw of TOWERS) tw.label = tName('tower', tw.name);
        for (const u of UNITS) u.label = tName('unit', u.name);
    }

    // ---------------- icon overlay ----------------
    // Towers are drawn as absolutely positioned <img> elements: crisp SVG at any zoom, and
    // it sidesteps canvas quirks entirely.
    syncIcons() {
        if (!this.iconLayer) {
            this.iconLayer = D('icons');
            this.iconEls = new Map();
            // Batch every style write through a single transform-based node move: writing
            // left/top (and swapping img.src) per tower per frame forces a synchronous
            // layout on every frame, which is the main source of the stutter.
            this.iconPool = [];
        }
        const z = this.camera.zoom;
        const { cw, ch } = this.renderer;
        const size = Math.max(14, z * 1.35);
        const seen = new Set();
        const padX = cw / 2 / z + 4, padY = ch / 2 / z + 4;
        for (const t of this.game.towers.values()) {
            const wp = integerPosition(t.x, t.y);
            const wx = wp[0], wy = wp[1];
            if (Math.abs(wx - this.camera.x) > padX || Math.abs(wy - this.camera.y) > padY) continue;
            if (!this.isVisible(t)) continue;
            const k = t.y * 512 + t.x;
            seen.add(k);
            const [sx, sy] = this.camera.toScreen(wx, wy, cw, ch);
            let el = this.iconEls.get(k);
            if (!el) {
                el = document.createElement('img');
                el.className = 'tico';
                el.draggable = false;
                this.iconLayer.appendChild(el);
                this.iconEls.set(k, el);
            }
            const c = this.colorForRgb(t.owner);
            const key = t.type + c.join(',');
            if (el.dataset.key !== key) {
                el.src = this.svgUrl(t.type, `rgb(${c.join(',')})`);
                el.dataset.key = key;
            }
            const w = Math.round(size) + 'px';
            if (el.style.width !== w) { el.style.width = w; el.style.height = w; }
            const opacity = t.owner == null ? '0.85' : '1';
            if (el.style.opacity !== opacity) el.style.opacity = opacity;
            el.style.transform = `translate3d(${(sx - size / 2).toFixed(1)}px,${(sy - size * 0.95).toFixed(1)}px,0)`;
        }
        for (const [k, el] of this.iconEls) {
            if (!seen.has(k)) { el.remove(); this.iconEls.delete(k); }
        }
    }

    colorForRgb(owner) {
        if (owner == null) return COLORS.neutral;
        if (owner === this.me.id) return COLORS.me;
        if (this.me.allies.has(owner)) return COLORS.ally;
        return COLORS.enemy;
    }

    // ---------------- HUD ----------------
    updateHud() {
        const me = this.me;
        const score = fmt(me.score);
        const towers = fmt(me.towers.size);
        if (this._hudScore !== score) { this._hudScore = score; D('score').textContent = score; }
        if (this._hudTowers !== towers) { this._hudTowers = towers; D('towers-n').textContent = towers; }

        // The leaderboard is rebuilt only when its *content* changes. Rewriting its innerHTML
        // every frame (60x/s) forced a full style recalc + layout each time — the single most
        // expensive thing the UI did, and the main source of the visible hitch.
        const rows = this.game.players
            .filter((p) => p.alive || p.id === me.id)
            .map((p) => ({ p, score: p.id === me.id ? me.score : p.score, n: p.towers.size }))
            .sort((a, b) => b.score - a.score || b.n - a.n)
            .slice(0, 10);
        const aliveCount = this.game.players.filter((p) => p.alive).length;
        const sig = rows.map((r) => `${r.p.id}:${r.p.name}:${r.score}`).join('|') +
            `#${this.game.towers.size}#${aliveCount}#${t('hud.leaderboard')}#${t('hud.footer')}`;
        if (sig !== this._lbSig) {
            this._lbSig = sig;
            const lb = D('leaderboard');
            let html = `<div class="lb-head">${t('hud.leaderboard')}</div>`;
            rows.forEach((r, i) => {
                const mine = r.p.id === me.id;
                const col = this.colorCss(r.p.id);
                html += `<div class="lb-row${mine ? ' me' : ''}"><span class="lb-n">${i + 1}.</span>` +
                    `<span class="lb-dot" style="background:${col}"></span>` +
                    `<span class="lb-name">${escapeHtml(r.p.name)}</span>` +
                    `<span class="lb-score">${r.score}</span></div>`;
            });
            html += `<div class="lb-foot">${t('hud.footer', {
                towers: fmt(this.game.towers.size),
                players: aliveCount,
            })}</div>`;
            lb.innerHTML = html;
        }

        const alive = me.alive ? '#74b9ff' : '#c0392b';
        if (this._hudAlive !== alive) { this._hudAlive = alive; D('alive-dot').style.background = alive; }
    }

    colorCss(owner) {
        const c = owner === this.me.id ? COLORS.me : this.me.allies.has(owner) ? COLORS.ally : COLORS.enemy;
        return `rgb(${c[0]},${c[1]},${c[2]})`;
    }

    // ---------------- alerts ----------------
    onGameEvent(e) {
        // Battle feedback (particles + blips) for anything the player could plausibly see.
        // Engine events carry either a tower id, a bare {x,y} cell, or a world position.
        let pos = null, tower = null;
        if (e.tower) {
            tower = this.game.getTower(e.tower);
            pos = tower ? integerPosition(tower.x, tower.y) : null;
        } else if (e.pos) {
            pos = e.pos;
        }
        // Only show feedback for things the player can actually see.
        const visible = tower ? this.isVisible(tower)
            : !this.fogEnabled || !this.me.alive || !pos ? true
                : this.visibility.near(pos[0], pos[1], this.game);
        if (pos && visible) this.effects.onEvent(e, pos);
        if (e.type === 'ruler' && e.player === this.me.id) {
            this.alerts.unshift({ text: t('alert.kingDead'), sub: '', kind: 'bad', until: performance.now() + 8000 });
        }
        if (e.type === 'died' && e.player === this.me.id) {
            this.showDeath(true);
        }
    }

    renderAlerts() { /* alerts are pushed in pushAlert */ }

    // Toasts are queued as translation *keys* (or literal text for engine errors) so that a
    // language switch can re-render the ones still on screen in the new language.
    pushAlert(text, sub, kind = 'info', ms = 7000) {
        this.alerts = this.alerts || [];
        const key = isTranslatableKey(text) ? text : null;
        const shown = key ? t(key) : text;
        if (this.alerts.some((a) => a.text === shown)) return;
        this.alerts.unshift({ key, text: shown, sub, kind, until: performance.now() + ms });
        this.renderAlertList();
    }

    // Re-resolve every queued toast; called when the language changes.
    retranslateAlerts() {
        for (const a of (this.alerts || [])) {
            if (a.key) a.text = t(a.key);
        }
    }

    // The Kiomet-style alert column (King safety, tutorial, full/overflow, zombies).
    renderGameAlerts() {
        const list = this.alertBoard.evaluate(this.game, this.me);
        const box = D('game-alerts');
        if (!box) return;
        const sig = list.map((a) => a.kind + (a.tower ? a.tower.x + ':' + a.tower.y : '')).join(',');
        if (sig === this.lastAlertSig) return;
        this.lastAlertSig = sig;
        box.innerHTML = '';
        for (const a of list) {
            const row = el('div', 'galert ' + a.kind);
            const txt = el('div', 'galert-text');
            txt.appendChild(el('div', 'galert-main', a.title));
            txt.appendChild(el('div', 'galert-sub', a.hint));
            row.appendChild(txt);
            if (a.tower) {
                row.title = t('toast.menuHint');
                row.addEventListener('click', () => {
                    const t = this.game.getTower(a.tower);
                    if (t) { this.centreOn(t); this.selected = { x: t.x, y: t.y }; this.renderMenu(); }
                });
            }
            const x = el('span', 'galert-x', CLOSE_GLYPH);
            x.addEventListener('click', (ev) => {
                ev.stopPropagation();
                this.alertBoard.dismiss(a.kind);
                this.lastAlertSig = null;
                this.renderGameAlerts();
            });
            row.appendChild(x);
            box.appendChild(row);
        }
    }

    renderAlertList() {
        const box = D('alerts');
        const now = performance.now();
        this.alerts = (this.alerts || []).filter((a) => a.until > now);
        box.innerHTML = '';
        for (const a of this.alerts.slice(0, 4)) {
            const row = el('div', 'alert ' + a.kind);
            row.appendChild(el('span', 'alert-dot'));
            const txt = el('div', 'alert-text');
            txt.appendChild(el('div', 'alert-main', escapeHtml(a.text)));
            if (a.sub) txt.appendChild(el('div', 'alert-sub', escapeHtml(a.sub)));
            row.appendChild(txt);
            const x = el('span', 'alert-x', CLOSE_GLYPH);
            x.addEventListener('click', () => { a.until = 0; this.renderAlertList(); });
            row.appendChild(x);
            box.appendChild(row);
        }
    }

    // DeathReason::RulerKilled { alias, unit } -> "King killed by <alias>'s <unit>!"
    deathText() {
        const p = this.game.players[this.me.id];
        const r = p && p.deathReason;
        if (!r) return t('death.default');
        if (r.killer == null) return t('death.byZombies');
        const killer = this.game.players[r.killer];
        const who = killer ? killer.name : t('death.someone');
        if (r.unit == null) return t('death.byPlayerNoUnit', { player: who });
        return t('death.byPlayer', { player: who, unit: tName('unit', UNITS[r.unit].name) });
    }

    showDeath(anim) {
        const spawn = D('spawn');
        spawn.classList.toggle('hidden', this.me.alive);
        if (!this.me.alive) {
            const r = D('death-reason');
            r.textContent = this.deathText();
            r.classList.remove('hidden');
        }
    }

    // ---------------- UI wiring ----------------
    bindUi() {
        this.alerts = [];
        D('chat-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = D('chat-input');
            const v = input.value.trim();
            if (!v) return;
            input.value = '';
            this.chatLine(this.name, v, true);
        });
        D('play-btn').addEventListener('click', () => {
            const name = D('name-input').value.trim().slice(0, 12) || 'Guesty';
            this.name = name;
            localStorage.setItem('kiomet-name', name);
            this.newGame();
        });
        D('pause-btn').addEventListener('click', () => this.togglePause());
        D('speed-btn').addEventListener('click', () => {
            this.speed = this.speed === 1 ? 2 : this.speed === 2 ? 4 : 1;
            D('speed-btn').textContent = this.speed + '脳';
            D('speed-btn').classList.toggle('active', this.speed !== 1);
        });
        D('god-btn').addEventListener('click', () => {
            this.godMode = !this.godMode;
            localStorage.setItem('kiomet-god', this.godMode ? '1' : '0');
            D('god-btn').classList.toggle('active', this.godMode);
            this.toast(this.godMode ? 'toast.godOn' : 'toast.godOff');
        });
        D('god-btn').classList.toggle('active', this.godMode);
        D('fog-btn').addEventListener('click', () => this.toggleFog());
        D('help-btn').addEventListener('click', () => this.openDialog('help'));
        D('towers-btn').addEventListener('click', () => this.openDialog('towers'));
        D('units-btn').addEventListener('click', () => this.openDialog('units'));
        D('dialog-close').addEventListener('click', () => this.closeDialog());
        D('newgame-btn').addEventListener('click', () => this.newGame());
        D('zoom-in').addEventListener('click', () => { this.camera.zoom = Math.min(64, this.camera.zoom * 1.25); });
        D('zoom-out').addEventListener('click', () => { this.camera.zoom = Math.max(7, this.camera.zoom / 1.25); });
        D('center-btn').addEventListener('click', () => this.panToKey(this.me.rulerKey));
        D('name-input').value = this.name;
        setInterval(() => this.renderAlertList(), 500);
        this.toast('toast.intro');
    }

    toggleFog() {
        this.fogEnabled = !this.fogEnabled;
        localStorage.setItem('kiomet-fog', this.fogEnabled ? '1' : '0');
        const btn = D('fog-btn');
        if (btn) btn.textContent = t(this.fogEnabled ? 'btn.fog' : 'btn.fogOff');
        this.visibility.invalidate();
        this.updateVisibility();
    }

    togglePause() {
        this.paused = !this.paused;
        const btn = D('pause-btn');
        btn.textContent = this.paused ? '▶' : '❚❚';
        btn.title = t(this.paused ? 'btn.resume' : 'btn.pause');
        btn.classList.toggle('active', this.paused);
    }

    // `text` may be a translation key or an already-formatted string (engine errors).
    toast(text) {
        this.pushAlert(text, '', 'info', 6000);
    }

    chatLine(who, text, mine) {
        const box = D('chat-log');
        const line = el('div', 'chat-line' + (mine ? ' mine' : ''));
        line.appendChild(el('b', 'chat-name', escapeHtml(who)));
        line.appendChild(el('span', 'chat-text', ' ' + escapeHtml(text)));
        box.appendChild(line);
        box.scrollTop = box.scrollHeight;
    }

    openDialog(which) {
        const dlg = D('dialog');
        const body = D('dialog-body');
        dlg.classList.remove('hidden');
        // Remembered so a language switch can redraw the open panel in the new language.
        this.dialogKind = which;
        const title = D('dialog-title');
        if (which === 'help') {
            title.textContent = t('help.title');
            body.innerHTML = t('help.body');
        } else if (which === 'towers') {
            title.textContent = t('towers.title');
            body.innerHTML = towersHtml();
        } else {
            title.textContent = t('units.title');
            body.innerHTML = unitsHtml();
        }
    }

    closeDialog() {
        this.dialogKind = null;
        D('dialog').classList.add('hidden');
    }
}

function c2(t, u) { return t.units.get(u) > 0; }

const TOWER_GEN_HINT = {};

// Tower reference, worded like the real /towers page: "Upgrades from X (in 20s), requires 2 Factory",
// "Can contain 12 Soldier, 2 Tank, 10 Shield", "Generates Soldier (every 6s), worth 1 point".
function towersHtml() {
    const icon = (n) => `<img class="ref-ico" src="${svgRef(n)}" alt="${escapeHtml(tName('tower', n))}">`;
    const unitRef = (n) => `<span class="ref-unit"><b>${escapeHtml(tName('unit', n))}</b></span>`;
    let out = `<p class="ref-lead">${t('towers.lead')}</p>`;
    out += '<div class="ref-grid">';
    for (const tw of TOWERS) {
        const reqs = tw.prereqs.map(([p2, n]) => `${n}${icon(p2)}`).join(', ');
        const up = tw.down
            ? `<p>${t(reqs ? 'towers.upgradesFromReq' : 'towers.upgradesFrom', {
                icon: icon(tw.down),
                tower: tName('tower', tw.down),
                seconds: tw.delay,
                reqs,
            })}.</p>`
            : `<p class="ref-dim">${t('towers.foundOnMap')}</p>`;
        const cap = Object.entries(tw.cap).map(([u, c]) => `${c} ${unitRef(u)}`).join(', ');
        const gen = Object.entries(tw.gen)
            .map(([u, sec]) => t('towers.generatesEvery', { unit: unitRef(u), seconds: sec }))
            .join(', ');
        // Chinese-style languages end the clause with a full stop; the template owns the
        // punctuation so translations can place it correctly.
        out += `<div class="ref-card">
            <h3>${icon(tw.name)} ${escapeHtml(tName('tower', tw.name))}</h3>
            ${up}
            <p>${t('towers.canContain', { units: cap })}</p>
            <p>${t('towers.generates', { units: gen || t('towers.generatesNothing') })}${t('towers.worth', { points: tw.score })}</p>
            ${tw.sensor > 12 ? `<p>${t('towers.sensor', { percent: Math.round(100 * (tw.sensor - 12) / 12) })}</p>` : ''}
            ${tw.name === 'Projector' ? `<p>${t('towers.projector')}</p>` : ''}
        </div>`;
    }
    return out + '</div>';
}

// Unit reference, worded like the real /units page (damage vs surface/air, speed, range,
// chopper weight, EMP duration, overflow allowance, which towers make it).
function unitsHtml() {
    const icon = (n) => `<img class="ref-ico" src="${svgRef(n)}" alt="${escapeHtml(tName('tower', n))}">`;
    let out = `<p class="ref-lead">${t('units.lead')}</p><div class="ref-grid">`;
    for (let u = 0; u < UNITS.length; u++) {
        const d = UNITS[u];
        const makers = TOWERS.filter((tw) => tw.gen[d.name]).map((tw) => icon(tw.name)).join(' ');
        const surface = Math.max(damageOf(u, 0, 0), damageOf(u, 1, 0));
        const air = Math.max(damageOf(u, 0, 1), damageOf(u, 1, 1));
        const fmtDmg = (n) => (n >= 31 ? t('units.infinite') : n);
        const dmg = surface === air
            ? t('units.damage', { surface: fmtDmg(surface) })
            : t('units.damageBoth', { surface: fmtDmg(surface), air: fmtDmg(air) });
        const speedText = d.name === 'Shield' ? t('units.shieldSpecial') : t(`units.speed.${d.speed}`);
        out += `<div class="ref-card">
            <h3>${icon(d.name)} ${escapeHtml(tName('unit', d.name))}</h3>
            ${makers ? `<p>${t('units.producedBy', { makers })}</p>` : ''}
            <p>${dmg}</p>
            <p>${speedText}</p>
            ${d.range ? `<p>${t(`units.range.${d.range}`)}</p>` : ''}
            ${d.weight ? `<p>${t('units.weight', { weight: d.weight })}</p>` : ''}
            ${d.name === 'Chopper' ? `<p>${t('units.chopper')}</p>` : ''}
            ${d.name === 'Emp' ? `<p>${t('units.emp')}</p>` : ''}
            ${d.maxOverflow ? `<p>${t('units.overflow', { count: d.maxOverflow })}</p>` : ''}
            ${d.name === 'King' ? `<p>${t('units.king', { boost: RULER_SHIELD_BOOST })}</p>` : ''}
        </div>`;
    }
    return out + '</div>';
}

function damageOf(u, uf, af) {
    // local mirror of data.js damage() for display only
    const name = UNITS[u].name;
    const f = (uf || af) ? 1 : 0;
    switch (name) {
        case 'Tank': return 3;
        case 'Fighter': return f === 1 ? 3 : 1;
        case 'Bomber': return (f === 1 && af === 0) ? 5 : 1;
        case 'Chopper': return f === 1 ? 3 : 1;
        case 'Nuke': return 31;
        case 'Shell': return 3;
        default: return 1;
    }
}

function svgRef(name) {
    const svg = (TOWER_SVG[name] || UNIT_SVG[name] || '').replace(/stroke="#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?"/g, 'stroke="#cfe0ff"');
    return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// A string is a translation key when it looks like `section.name` and the dictionary knows
// it, which keeps engine messages (plain words like "path too long") renderable as-is.
function isTranslatableKey(s) {
    return typeof s === 'string' && /^[a-z]+\.[A-Za-z0-9.]+$/.test(s) && t(s) !== s;
}

window.kiomet = new App();
</script>
