<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kiomet — 实时领地塔防</title>
<style>
:root{
  --bg:#2d3436; --panel:#00000033; --panel-solid:#20282a; --text:#e8ecf1;
  --blue:#74b9ff; --red:#c0392b; --purple:#8644fc; --gold:#ffd166;
  --ui-font:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft Yahei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:14px/1.35 var(--ui-font);
  user-select:none;-webkit-user-select:none}
#app{position:absolute;inset:0;z-index:0}
#game-alerts,#topbar,#leaderboard,#lang-picker,#alerts,#chat,#controls,#zoomctl,#tower-menu,#spawn,#dialog{position:absolute;z-index:2}
#icons{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1;contain:strict}
.tico{position:absolute;left:0;top:0;will-change:transform;filter:drop-shadow(0 1px 1px #0008)}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0}
.hidden{display:none!important}

/* top bar */
#topbar{position:absolute;left:50%;bottom:.5rem;transform:translateX(-50%);display:flex;justify-content:center;
  gap:.6rem;pointer-events:none;font-size:.8rem;color:#cfd8e3;opacity:.85}
#topbar .stat{background:var(--panel);border-radius:.35rem;padding:.2rem .55rem;pointer-events:auto}
#topbar b{color:#fff;font-size:.95rem}

/* leaderboard */
#game-alerts{position:absolute;left:.6rem;top:2.9rem;display:flex;flex-direction:column;gap:.3rem;
  max-width:min(24rem, 60vw);z-index:2}
.galert{display:flex;align-items:flex-start;gap:.4rem;background:#0f1416cc;border-left:3px solid var(--blue);
  border-radius:.3rem;padding:.35rem .5rem;font-size:.8rem;cursor:pointer}
.galert.rulerAttack,.galert.rulerUnsafe{border-left-color:var(--red)}
.galert.overflow,.galert.zombies{border-left-color:var(--gold)}
.galert-main{font-weight:600}
.galert-sub{opacity:.7;font-size:.74rem;line-height:1.3}
.galert-x{margin-left:auto;opacity:.5;padding-left:.4rem}
.galert-x:hover{opacity:1}
/* Toast column: bottom-left, above the chat box (the game alerts own the top-left corner). */
#alerts{top:auto;bottom:11.5rem;max-width:22rem}
#leaderboard{position:absolute;right:.6rem;top:.6rem;min-width:11rem;max-width:24vw;
  background:var(--panel);border-radius:.4rem;padding:.35rem .5rem;font-size:.8rem;backdrop-filter:blur(2px)}
.lb-head{font-weight:600;opacity:.85;margin-bottom:.2rem;font-size:.78rem}
.lb-row{display:flex;align-items:center;gap:.3rem;line-height:1.5;white-space:nowrap}
.lb-row.me{color:#fff;font-weight:600}
.lb-n{opacity:.6;width:1.2rem}
.lb-dot{width:.5rem;height:.5rem;border-radius:50%}
.lb-name{flex:1;overflow:hidden;text-overflow:ellipsis}
.lb-score{font-variant-numeric:tabular-nums;opacity:.9}
.lb-foot{margin-top:.25rem;opacity:.5;font-size:.72rem}

/* alerts */
#alerts{position:absolute;left:.6rem;display:flex;flex-direction:column;gap:.3rem;
  pointer-events:none}
.alert{display:flex;align-items:center;gap:.4rem;background:var(--panel);border-radius:.35rem;
  padding:.3rem .45rem;font-size:.8rem;pointer-events:auto}
.alert.bad{background:#c0392b55}
.alert-dot{width:.45rem;height:.45rem;border-radius:50%;background:var(--blue);flex:none}
.alert.bad .alert-dot{background:var(--red)}
.alert-main{font-weight:600}
.alert-sub{opacity:.75;font-size:.75rem}
.alert-x{opacity:.6;cursor:pointer;margin-left:auto;padding-left:.3rem}

/* chat */
#chat{position:absolute;left:.6rem;bottom:.6rem;width:22rem;max-width:38vw;font-size:.8rem}
#chat-log{max-height:8rem;overflow:auto;margin-bottom:.3rem;display:flex;flex-direction:column;gap:.15rem}
.chat-line{background:var(--panel);border-radius:.3rem;padding:.2rem .4rem}
.chat-line.mine .chat-name{color:var(--blue)}
.chat-name{opacity:.8}
#chat-form{display:flex;gap:.3rem}
#chat-input{flex:1;background:#00000055;border:1px solid #ffffff22;border-radius:.3rem;color:var(--text);
  padding:.3rem .45rem;font:inherit;outline:none}
#chat-input:focus{border-color:var(--blue)}

/* bottom right buttons */
#controls{position:absolute;right:.6rem;bottom:.6rem;display:flex;gap:.35rem;flex-wrap:wrap;justify-content:flex-end}
#controls button,#zoomctl button{background:var(--panel);border:1px solid #ffffff22;color:var(--text);
  border-radius:.35rem;padding:.35rem .55rem;font:inherit;cursor:pointer}
#controls button:hover,#zoomctl button:hover{background:#ffffff18}
#controls button.active{background:#74b9ff33;border-color:var(--blue)}
#zoomctl{position:absolute;right:.6rem;bottom:3.2rem;display:flex;gap:.35rem}

/* tower menu */
#tower-menu{position:absolute;z-index:20;min-width:11rem;max-width:16rem;background:#0f1416e6;
  border:1px solid #ffffff26;border-radius:.45rem;padding:.5rem;font-size:.8rem;backdrop-filter:blur(3px);
  box-shadow:0 6px 24px #0006}
/* Close button sits in the corner; the panel is dismissed by it, by clicking empty ground,
   or by Esc — never only by re-clicking the same tower. */
.tm-close{position:absolute;top:-.35rem;right:-.35rem;width:1.35rem;height:1.35rem;display:flex;
  align-items:center;justify-content:center;padding:0;border-radius:50%;cursor:pointer;
  background:#20282a;border:1px solid #ffffff33;color:#cfd8e3;font-size:.8rem;line-height:1;
  z-index:1;transition:background .12s,color .12s,border-color .12s}
.tm-close:hover{background:#c0392b;border-color:#c0392b;color:#fff}
.tm-close:focus-visible{outline:none;box-shadow:0 0 0 2px #74b9ff88}
html[dir="rtl"] .tm-close{right:auto;left:-.35rem}
.tm-head{display:flex;align-items:center;gap:.35rem;margin-bottom:.35rem;padding-right:.6rem}
html[dir="rtl"] .tm-head{padding-right:0;padding-left:.6rem}
.tm-icon{width:1.55rem;height:1.55rem;object-fit:contain}
.tm-title{font-weight:700;font-size:.95rem}
.tm-owner{margin-left:auto;opacity:.7;font-size:.75rem}
.tm-delay{color:var(--gold);margin-bottom:.3rem}
.tm-units{display:flex;flex-direction:column;gap:.15rem;margin-bottom:.4rem}
.tm-unit{display:flex;align-items:center;gap:.35rem}
.tm-count{font-variant-numeric:tabular-nums;opacity:.95}
.tm-gen{margin-left:auto;opacity:.55;font-size:.72rem}
.tm-ups{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.35rem}
.tm-up{position:relative;display:flex;flex-direction:column;align-items:center;gap:.15rem;
  width:3.6rem;padding:.25rem;border-radius:.35rem;border:1px solid #ffffff26;background:#74b9ff22;cursor:pointer}
.tm-up:hover{background:#74b9ff33}
.tm-up.down{background:#c0392b33}
.tm-up.locked{opacity:.45;cursor:not-allowed}
.tm-up-icon{width:1.9rem;height:1.9rem;object-fit:contain}
.tm-req{display:flex;flex-direction:column;gap:.05rem;font-size:.68rem;opacity:.85}
.tm-req-item{display:flex;align-items:center;gap:.15rem;white-space:nowrap}
.tm-req-item.ok{color:#8fe3a0}
.tm-req-icon{width:.85rem;height:.85rem;object-fit:contain}
.tm-btn{width:100%;margin-top:.2rem;background:#00000055;border:1px solid #ffffff33;color:var(--text);
  border-radius:.3rem;padding:.3rem;font:inherit;cursor:pointer}
.tm-btn.danger{background:#c0392b44;border-color:#c0392b88}
.dot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--blue)}
.tm-hint{margin-top:.3rem;opacity:.6;font-size:.72rem;line-height:1.3}

/* unit badges */
[class^="unit-"]{display:inline-block;width:.8rem;height:.8rem;border-radius:.15rem;flex:none}
.unit-shield{background:#b4cdff;border-radius:50%}
.unit-fighter{background:#7fd1ff;clip-path:polygon(50% 0,100% 100%,0 100%)}
.unit-chopper{background:#9be15d;border-radius:.2rem .2rem .5rem .5rem}
.unit-bomber{background:#ffd166;clip-path:polygon(0 40%,100% 50%,0 60%)}
.unit-tank{background:#f2a65a;border-radius:.2rem}
.unit-soldier{background:#e8eef6;border-radius:50% 50% 20% 20%}
.unit-shell{background:#ff9f1c;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.unit-emp{background:#4cc9f0;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
.unit-nuke{background:#ff4d4d;border-radius:50%;box-shadow:0 0 4px #ff4d4d}
.unit-king{background:var(--gold);clip-path:polygon(0 100%,10% 30%,35% 60%,50% 10%,65% 60%,90% 30%,100% 100%)}

/* spawn overlay */
#spawn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.8rem;background:radial-gradient(circle at 50% 45%,#00000000,#00000066);z-index:40}
#spawn h1{margin:0;font-size:2.6rem;letter-spacing:.02em}
#spawn h1 span{color:#a5a5a5;font-size:1.4rem}
#spawn .sub{opacity:.8;margin:0}
#spawn input{width:14rem;text-align:center;background:#00000055;border:1px solid #ffffff33;border-radius:.4rem;
  color:#fff;padding:.45rem;font:inherit;outline:none}
#spawn input:focus{border-color:var(--blue)}
#play-btn{background:var(--blue);color:#0b1620;border:none;border-radius:.5rem;padding:.6rem 2.6rem;
  font-size:1.15rem;font-weight:700;cursor:pointer;box-shadow:0 4px 18px #74b9ff55}
#play-btn:hover{filter:brightness(1.08)}
#death-reason{color:#ffb3a7;font-style:italic}

/* dialogs */
#dialog{position:absolute;inset:0;background:#00000088;display:flex;align-items:center;justify-content:center;z-index:50}
#dialog .card{background:var(--panel-solid);border-radius:.6rem;padding:1rem 1.2rem;max-width:min(56rem,92vw);
  max-height:82vh;overflow:auto;box-shadow:0 12px 40px #0008}
#dialog .card h2{margin:0 0 .6rem}
#dialog-close{float:right;background:#00000055;border:1px solid #ffffff33;color:var(--text);border-radius:.3rem;
  padding:.15rem .5rem;cursor:pointer}
.ref-lead{opacity:.8;margin:0 0 .8rem}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.7rem}
.ref-card{background:#ffffff0a;border:1px solid #ffffff14;border-radius:.4rem;padding:.6rem .7rem;font-size:.8rem}
.ref-card h3{margin:0 0 .4rem;font-size:.95rem;display:flex;align-items:center;gap:.35rem}
.ref-card p{margin:.25rem 0;opacity:.9;line-height:1.35}
.ref-ico{width:1.4rem;height:1.4rem;vertical-align:middle;object-fit:contain}
.ref-unit{color:#cfe0ff}
.ref-dim{opacity:.55}
.tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.tbl th,.tbl td{text-align:left;padding:.25rem .45rem;border-bottom:1px solid #ffffff14;vertical-align:top}
.tbl th{opacity:.7;font-weight:600;position:sticky;top:0;background:var(--panel-solid)}

/* language picker (top-right, above the leaderboard) */
#lang-picker{position:absolute;right:.6rem;top:.6rem;display:flex;align-items:center;gap:.25rem;
  z-index:3;background:var(--panel);border-radius:.4rem;padding:.15rem .3rem;backdrop-filter:blur(2px)}
.lang-label{font-size:.85rem;opacity:.8;line-height:1}
#lang-select{background:#00000055;border:1px solid #ffffff26;color:var(--text);border-radius:.3rem;
  padding:.15rem .25rem;font:inherit;font-size:.78rem;cursor:pointer;outline:none;max-width:8.5rem}
#lang-select:hover{border-color:var(--blue)}
#lang-select:focus-visible{border-color:var(--blue);box-shadow:0 0 0 2px #74b9ff44}
#lang-select option{background:#20282a;color:var(--text)}
/* the leaderboard sits below the picker so the two never overlap */
#leaderboard{top:2.75rem}

/* right-to-left (Arabic). Every horizontal offset above is physical, so mirror the
   containers that anchor to an edge; flex/inline text direction is handled by `dir`. */
html[dir="rtl"] #lang-picker{right:auto;left:.6rem}
html[dir="rtl"] #leaderboard{right:auto;left:.6rem;text-align:right}
/* Alerts swap corners: the game alerts take the right edge, toasts the left. Both rules have
   the same specificity as the LTR ones, so they must sit after them in the sheet. */
html[dir="rtl"] #game-alerts{left:auto;right:.6rem}
html[dir="rtl"] #alerts{left:.6rem;right:auto}
html[dir="rtl"] #chat{left:auto;right:.6rem}
html[dir="rtl"] #controls{right:auto;left:.6rem;justify-content:flex-start}
html[dir="rtl"] #zoomctl{right:auto;left:.6rem}
html[dir="rtl"] .galert{border-left:none;border-right:3px solid var(--blue)}
html[dir="rtl"] .galert.rulerAttack,html[dir="rtl"] .galert.rulerUnsafe{border-right-color:var(--red)}
html[dir="rtl"] .galert.overflow,html[dir="rtl"] .galert.zombies{border-right-color:var(--gold)}
/* The dismiss button is the leading inline item in RTL; push it to the far edge on the left. */
html[dir="rtl"] .galert-x{margin-left:auto;margin-right:0;padding-left:0;padding-right:.4rem}
html[dir="rtl"] .alert-x{margin-left:auto;margin-right:0;padding-left:0;padding-right:.3rem}
html[dir="rtl"] .tm-owner{margin-left:0;margin-right:auto}
html[dir="rtl"] .tm-gen{margin-left:0;margin-right:auto}
html[dir="rtl"] #dialog-close{float:left}
html[dir="rtl"] .tbl th,html[dir="rtl"] .tbl td{text-align:right}
html[dir="rtl"] #topbar{direction:rtl}

/* small screens */
@media (max-width:720px){
  #game-alerts{max-width:70vw;font-size:.74rem}
  #leaderboard{font-size:.72rem;min-width:8.5rem}
  #chat{width:14rem}
  #chat-log{max-height:5rem}
  #tower-menu{max-width:13rem;font-size:.76rem}
  #spawn h1{font-size:2rem}
  #lang-select{font-size:.72rem;max-width:6.5rem}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>
  <div id="icons"></div>

  <div id="topbar">
    <div class="stat"><span id="lbl-score">得分</span> <b id="score">0</b></div>
    <div class="stat"><span id="lbl-towers">塔</span> <b id="towers-n">0</b></div>
    <div class="stat"><span id="lbl-life">生命</span> <b id="alive-dot" class="dot"></b></div>
  </div>

  <div id="game-alerts"></div>
  <div id="alerts"></div>
  <div id="leaderboard"></div>

  <!-- Language picker: top-right, above the leaderboard. Native <select> for keyboard and AT. -->
  <div id="lang-picker">
    <label class="lang-label" for="lang-select">🌐</label>
    <select id="lang-select" aria-label="Language"></select>
  </div>

  <div id="chat">
    <div id="chat-log"></div>
    <form id="chat-form" autocomplete="off">
      <input id="chat-input" maxlength="120" placeholder="说点什么…" autocomplete="off">
    </form>
  </div>

  <div id="zoomctl">
    <button id="zoom-out" title="缩小">−</button>
    <button id="center-btn" title="找到我的国王">◎</button>
    <button id="zoom-in" title="放大">+</button>
  </div>

  <div id="controls">
    <button id="pause-btn" title="暂停">❚❚</button>
    <button id="speed-btn" title="游戏速度">1×</button>
    <button id="god-btn" title="无敌模式">无敌</button>
    <button id="fog-btn" title="战争迷雾（B 键切换）">迷雾:开</button>
    <button id="help-btn">帮助</button>
    <button id="towers-btn">塔</button>
    <button id="units-btn">单位</button>
    <button id="newgame-btn">新游戏</button>
  </div>

  <div id="tower-menu" class="hidden"></div>

  <div id="spawn" class="hidden">
    <h1>Kiomet<span>.com</span></h1>
    <p class="sub" id="spawn-sub">实时领地塔防 · 单机复刻</p>
    <input id="name-input" maxlength="12" placeholder="昵称" autocomplete="off">
    <button id="play-btn">开始</button>
    <div id="death-reason" class="hidden"></div>
  </div>

  <div id="dialog" class="hidden">
    <div class="card">
      <button id="dialog-close">关闭</button>
      <h2 id="dialog-title">帮助</h2>
      <div id="dialog-body"></div>
    </div>
  </div>
</div>

<script>
"use strict";

// ---- data.js ----
// SPDX-FileCopyrightText: 2026 Kiomet clone contributors
// SPDX-License-Identifier: AGPL-3.0-or-later
//
// Tower / unit / combat data. Ported from Softbear, Inc.'s Kiomet (AGPL-3.0-or-later),
// common/src/tower.rs, common/src/unit.rs and macros/src/lib.rs.

const TICK_HZ = 4;
// Towers at or next to the King are high morale: same speed, but slower to leave.
const RULER_MARCH_MULT = 2;
// High morale also means the King's tower and its eight neighbours make units and shields
// twice as fast, and hold ten extra shields (Tower::RULER_SHIELD_BOOST upstream).
const MORALE_GEN_DIVISOR = 2;
const RULER_SHIELD_BOOST = 10;
const SHIELD = 0, FIGHTER = 1, CHOPPER = 2, BOMBER = 3, TANK = 4, SOLDIER = 5,
    SHELL = 6, EMP = 7, NUKE = 8, RULER = 9;

const UNITS = [
    { name: 'Shield', cls: 'always', speed: 'shield', damage: 1, maxOverflow: 15 },
    { name: 'Fighter', cls: 'many', speed: 'fast', damage: 1, maxOverflow: 4 },
    { name: 'Chopper', cls: 'many', speed: 'fast', damage: 1, maxOverflow: 2 },
    { name: 'Bomber', cls: 'many', speed: 'fast', damage: 1, maxOverflow: 2 },
    { name: 'Tank', cls: 'many', speed: 'slow', damage: 3, maxOverflow: 5, weight: 2 },
    { name: 'Soldier', cls: 'many', speed: 'normal', damage: 1, maxOverflow: 10, weight: 1 },
    { name: 'Shell', cls: 'single', speed: 'fast', damage: 3, maxOverflow: 0, range: 'short' },
    { name: 'Emp', cls: 'single', speed: 'normal', damage: 1, maxOverflow: 0, range: 'medium' },
    { name: 'Nuke', cls: 'single', speed: 'slow', damage: 31, maxOverflow: 0, range: 'short' },
    { name: 'King', cls: 'single', speed: 'normal', damage: 1, maxOverflow: 0 },
];

const UNIT_ID = {};
UNITS.forEach((u, i) => { UNIT_ID[u.name] = i; });
const UNIT_ICONS = ['shield', 'fighter', 'chopper', 'bomber', 'tank', 'soldier',
    'shell', 'emp', 'nuke', 'king'];

const RANGE_DIST = { short: 5, medium: 8, long: 11 };
const MAX_ROAD_LENGTH = 5;
const rangedDistance = (u) => (UNITS[u].range ? RANGE_DIST[UNITS[u].range] * MAX_ROAD_LENGTH : null);
const isRanged = (u) => !!(UNITS[u] && UNITS[u].range);
const isSingleUse = (u) => isRanged(u);

function speed(u, towerType) {
    if (u === SHIELD) return (towerType == null || towerType === 'Projector') ? 'fast' : 'immobile';
    return UNITS[u].speed;
}
const isMobile = (u, towerType) => speed(u, towerType) !== 'immobile';
const canCapture = (u) => u != null && isMobile(u, null) && u !== SHIELD && !isSingleUse(u);

// Field: higher = further above ground. Iterated Air then Surface, like the original.
function field(u, overflow, inForce, anyAir) {
    switch (u) {
        case SHIELD: return anyAir ? 1 : 0;
        case BOMBER: case CHOPPER: case FIGHTER: case SHELL: case EMP: case NUKE:
            return (overflow || inForce) ? 1 : 0;
        default: return 0;
    }
}

function damage(u, uField, eField) {
    switch (u) {
        case TANK: return 3;
        case FIGHTER: return uField === 1 ? 3 : 1;
        case BOMBER: return (uField === 1 && eField === 0) ? 5 : 1;
        case CHOPPER: return uField === 1 ? 3 : 1;
        case NUKE: return 31;
        case SHELL: return 3;
        default: return 1;
    }
}
const INFINITE_DAMAGE = 31;
const finiteDamage = (d) => (d === INFINITE_DAMAGE ? 2147483647 : d);
const groundDamage = (u) => damage(u, field(u, false, true, false), 0);

const EMP_TICKS = 60 * TICK_HZ;

// 27 towers. `pre` = [downgrade, [delaySeconds, [type, count]...]]
const T = (name, o) => ({ name, cap: {}, gen: {}, pre: [], score: 1, sensor: 12, spawnable: false, ...o });

const TOWERS = [
    T('Airfield', {
        cap: { Fighter: 4, Bomber: 4, Soldier: 4, Tank: 3, Shield: 10 },
        gen: { Bomber: 30 }, spawnable: true,
        pre: ['Runway', [20, ['Factory', 2], ['Radar', 1]]],
    }),
    T('Armory', {
        cap: { Soldier: 4, Tank: 5, Shield: 15 }, gen: { Tank: 15 }, spawnable: true,
        pre: ['Barracks', [25, ['Factory', 1], ['Mine', 1]]],
    }),
    T('Artillery', {
        cap: { Shell: 3, Shield: 20 }, gen: { Shell: 15 },
        pre: ['Bunker', [40, ['Refinery', 2], ['Radar', 3]]],
    }),
    T('Barracks', {
        cap: { Soldier: 12, Tank: 2, Shield: 10 }, gen: { Soldier: 6 }, spawnable: true,
    }),
    T('Bunker', {
        cap: { Soldier: 6, Shield: 40 }, spawnable: true,
        pre: ['Cliff', [30, ['Headquarters', 1], ['Ews', 1]]],
    }),
    T('Centrifuge', {
        cap: { Soldier: 4, Tank: 2, Shield: 15 },
        pre: ['Generator', [30, ['Mine', 3]]],
    }),
    T('City', {
        cap: { Fighter: 2, Soldier: 6, Tank: 2, Shield: 15 }, score: 5,
        pre: ['Town', [30, ['Quarry', 2], ['Reactor', 1], ['Town', 3]]],
    }),
    T('Cliff', { cap: { Soldier: 4, Tank: 2, Shield: 30 }, spawnable: true }),
    T('Ews', {
        cap: { Soldier: 4, Tank: 2, Shield: 15 }, sensor: 20,
        pre: ['Radar', [30, ['Generator', 2]]],
    }),
    T('Factory', { cap: { Soldier: 4, Tank: 2, Shield: 10 }, score: 2 }),
    T('Generator', { cap: { Soldier: 4, Tank: 2, Shield: 10 } }),
    T('Headquarters', {
        cap: { Soldier: 8, Tank: 2, Shield: 40 },
        pre: ['Village', [20, ['Radar', 1]]],
    }),
    T('Helipad', {

// World geometry: tower ids, roads, connectivity. Ported from Kiomet
// common/src/tower/id.rs and common/src/tower/connectivity.rs.



const WORLD_SIZE = 512;
const CENTER = { x: 256, y: 256 };
const MAX_ROAD_SQ = (MAX_ROAD_LENGTH + 1) ** 2 - 1;

const FNV_OFFSET = 2166136261 >>> 0;
const FNV_PRIME = 16777619;

function fnv(seed, bytes) {
    let h = seed >>> 0;
    for (let i = 0; i < bytes.length; i++) {
        const b = bytes[i];
        h = Math.imul(h, FNV_PRIME) >>> 0;
        h = (h ^ b) >>> 0;
    }
    return h;
}

const condense8 = (h) => ((h & 0xff) ^ (h >>> 8)) & 0xff;

const u16bytes = (v) => [v & 0xff, (v >>> 8) & 0xff];

// Deterministic per-cell jitter, 1..4 in each axis.
const offsetCache = new Map();
function offset(x, y) {
    const k = (y << 9) | x;
    let v = offsetCache.get(k);
    if (v === undefined) {
        const h = condense8(condense16(fnv(FNV_OFFSET, [...u16bytes(x), ...u16bytes(y)])));
        v = [(h & 3) + 1, ((h >>> 4) & 3) + 1];
        offsetCache.set(k, v);
    }
    return v;
}

function integerPosition(x, y) {
    const o = offset(x, y);
    return [x * 5 + o[0], y * 5 + o[1]];
}
const position = (id) => integerPosition(id.x, id.y);

function towerTypeAt(x, y) {
    let h = FNV_OFFSET;
    h = fnv(h, u16bytes((x + 31415) & 0xffff));
    h = fnv(h, u16bytes((y + 31415) & 0xffff));
    return randomSpawnableType(condense8(condense16(condense16(h))));

const NB = [
    [0, 1, 'N'], [1, 1, 'NE'], [1, 0, 'E'], [1, -1, 'SE'],
    [0, -1, 'S'], [-1, -1, 'SW'], [-1, 0, 'W'], [-1, 1, 'NW'],
];

function areNeighbors(a, b) {
    if (a.x === b.x && a.y === b.y) return false;
    if (b.x < 0 || b.y < 0 || b.x >= WORLD_SIZE || b.y >= WORLD_SIZE) return false;
    const pa = integerPosition(a.x, a.y), pb = integerPosition(b.x, b.y);
    const dx = pa[0] - pb[0], dy = pa[1] - pb[1];
    const d2 = dx * dx + dy * dy;
    if (d2 > MAX_ROAD_SQ) return false;
    if (b.x !== a.x && b.y !== a.y) {
        const o1 = integerPosition(a.x, b.y), o2 = integerPosition(b.x, a.y);
        const ox = o1[0] - o2[0], oy = o1[1] - o2[1];
        if (ox * ox + oy * oy <= d2) return false; // intersections with a shorter road
    }

const neighborCache = new Map();
function neighbors(x, y) {
    const k = (y << 9) | x;

            const b = { x: x + dx, y: y + dy };
            if (b.x < 0 || b.y < 0 || b.x >= WORLD_SIZE || b.y >= WORLD_SIZE) continue;

}

function distanceSquared(a, b) {
    const pa = integerPosition(a.x, a.y), pb = integerPosition(b.x, b.y);
    const dx = pa[0] - pb[0], dy = pa[1] - pb[1];

let PARENT = null;
function buildConnectivity() {
    PARENT = new Map();
    const key = (id) => id.y * WORLD_SIZE + id.x;

    const queue = [c];
    for (let head = 0; head < queue.length; head++) {
        const p = queue[head];
        for (const n of allNeighbors(p)) {
            const k = key(n);
            if (PARENT.has(k)) continue;
            PARENT.set(k, p);
            queue.push(n);
        }
        if (queue.length > WORLD_SIZE * WORLD_SIZE) break;
    }
    return PARENT.size;
}

function allNeighbors(p) {
    const out = [];
    for (const [dx, dy] of NB) {
        const b = { x: p.x + dx, y: p.y + dy };
        if (b.x < 0 || b.y < 0 || b.x >= WORLD_SIZE || b.y >= WORLD_SIZE) continue;
        out.push(b);
    }
    return out;
}

const connectivity = (id) => PARENT.get(id.y * WORLD_SIZE + id.x);
const isSpawnablePosition = (id) => {
    if (id.x < 1 || id.y < 1 || id.x >= WORLD_SIZE - 1 || id.y >= WORLD_SIZE - 1) return false;
    return connectivity(id) !== undefined;
};

//
// Tower storage: a keyed grid that behaves like the Map the engine was written against, but
// only pays for cells that actually hold a tower.



const indexKey = (x, y) => y * WORLD_SIZE + x;

class TowerIndex {
    constructor() {
        this.grid = new Map();          // tile key -> Tower (sparse; dense enough already)
        this.version = 0;
    }

    get size() { return this.grid.size; }

    get(k) { return this.grid.get(k); }

    // Map-compatible helpers used across the engine.
    has(k) { return this.grid.has(k); }
    set(k, t) { this.grid.set(k, t); this.version += 1; return this; }
    delete(k) { const ok = this.grid.delete(k); if (ok) this.version += 1; return ok; }
    clear() { this.grid.clear(); this.version += 1; }
    entries() { return this.grid.entries(); }
    keys() { return this.grid.keys(); }
    values() { return this.grid.values(); }
    [Symbol.iterator]() { return this.grid[Symbol.iterator](); }
    forEach(fn) { return this.grid.forEach(fn); }

    // Towers inside a square of cells around (cx, cy).
    *near(cx, cy, radius) {
        for (let y = cy - radius; y <= cy + radius; y++) {
            if (y < 0 || y >= WORLD_SIZE) continue;
            for (let x = cx - radius; x <= cx + radius; x++) {
                if (x < 0 || x >= WORLD_SIZE) continue;
                const t = this.grid.get(y * WORLD_SIZE + x);
                if (t) yield t;
            }
        }
    }
}

// A Units container: shields + (five "many" counts) XOR (one "single" unit).
class Units {
    constructor() { this.shield = 0; this.many = [0, 0, 0, 0, 0]; this.single = null; this.singleCount = 0; }

    clone() {
        const u = new Units();
        u.shield = this.shield;
        u.many = this.many.slice();
        u.single = this.single; u.singleCount = this.singleCount;
        return u;
    }
    isEmpty() { return this.shield === 0 && this.single === null && this.many.every((c) => c === 0); }

    get(u) {
        if (u === SHIELD) return this.shield;
        if (UNITS[u] === undefined) return 0;
        if (UNITS[u].cls === 'many') return this.single !== null ? 0 : this.many[u - FIGHTER];
        return this.single === u ? this.singleCount : 0;
    }

    counts() {
        const out = [];
        if (this.shield) out.push([SHIELD, this.shield]);
        if (this.single !== null) { if (this.singleCount) out.push([this.single, this.singleCount]); }
        else for (let i = 0; i < 5; i++) if (this.many[i]) out.push([i + FIGHTER, this.many[i]]);
        return out;
    }

    hasRuler() { return this.single === RULER; }
    len() { let n = 0; for (const [, c] of this.counts()) n += c; return n; }
    isAlive() { return this.counts().some(([u]) => !isSingleUse(u) && u !== SHIELD); }
    isMany() { return this.single === null; }

    capacity(u, towerType) {
        // The world's own ruler slot: every tower type has capacity 1 for him.
        if (u === RULER) return towerType == null ? 255 : 1;
        const base = towerType == null ? 255
            : TOWER[towerType].rawCap(u) + (u === SHIELD && this.hasRuler() ? RULER_SHIELD_BOOST : 0);
        return Math.min(255, base);
    }

    spaceRemaining(u, towerType, overflow) {
        const cls = UNITS[u].cls;
        if (cls === 'many' && this.single !== null) return 0;
        if (cls === 'single' && this.single !== null && this.single > u) return 0;
        return Math.max(0, this.capacity(u, towerType) + (overflow ? UNITS[u].maxOverflow : 0) - this.get(u));
    }

    add(u, count, towerType = null, overflow = true) {
        const added = Math.min(count, this.spaceRemaining(u, towerType, overflow));
        if (added <= 0) return 0;
        const cls = UNITS[u].cls;
        if (cls === 'always') this.shield += added;
        else if (cls === 'many') {
            if (this.single !== null) return 0;
            this.many[u - FIGHTER] += added;
        } else if (this.single === u) this.singleCount += added;
        else {
            this.many = [0, 0, 0, 0, 0];
            this.single = u; this.singleCount = added;
        }
        return added;
    }

    subtract(u, count) {
        const sub = Math.min(count, this.get(u));
        if (sub <= 0) return 0;
        if (u === SHIELD) this.shield -= sub;
        else if (UNITS[u].cls === 'many') this.many[u - FIGHTER] -= sub;
        else {
            this.singleCount -= sub;
            if (this.singleCount === 0) { this.single = null; this.many = [0, 0, 0, 0, 0]; }
        }
        return sub;
    }

    addUnitsToTower(other, towerType, hasPlayer) {
        for (const [u, c] of other.counts()) {
            if (isSingleUse(u)) continue;
            this.add(u, c, towerType, hasPlayer);

    }

    reconcile(towerType, hasPlayer) {
        const old = this.clone();
        this.shield = 0; this.many = [0, 0, 0, 0, 0]; this.single = null; this.singleCount = 0;
        this.addUnitsToTower(old, towerType, hasPlayer);
    }

    forceUnits(towerType) {

        for (const [u, c] of this.counts()) if (isMobile(u, towerType)) out.add(u, c);

    }

    maxEdgeDistance() {
        let acc = null;

    }

    forceGroundDamage() {

        for (const [u, c] of this.counts()) total += finiteDamage(damage(u, field(u, false, true, false), 0)) * c;

const ATTACKER = 1, DEFENDER = 2;

class Combatants {
    constructor(units, towerType = null) { this.units = units; this.towerType = towerType; }

// Fight two combatants in place. Returns ATTACKER, DEFENDER or 0 (stalemate).
//
// This is a direct transcription of Kiomet's `Combatants::fight`: the air field resolves first,
// then the surface. At zero damage the defender presents a unit first; otherwise whoever is
// "ahead" must spend a unit to cancel the damage. Each side keeps one unit "in hand" — that unit
// is only removed when it is replaced by the next one (or when the side runs out), which is why
// the original can hand a King a last stand and then consume it.
function fight(A, D, onInfo) {
    // Shields are not used offensively against towers.
    if (A.towerType != null) D.units.subtract(SHIELD, 1e9);
    if (D.towerType != null) A.units.subtract(SHIELD, 1e9);

    let dmg = 0;
    let lastA = -1, lastD = -1;
    let emped = false, nuked = false, shelled = false;

    const unusedUnits = (c, last) => {
        const out = [];
        for (const [u, count] of c.units.counts()) {
            const n = count - (last === u && !isSingleUse(u) ? 1 : 0);
            if (n > 0) out.push([u, n]);
        }

    };

    const fire = (unit, isAtt) => {
        const key = unit === EMP ? 'emp' : unit === NUKE ? 'nuke' : 'shell';
        const was = key === 'emp' ? emped : key === 'nuke' ? nuked : shelled;
        if (was) return;
        if (key === 'emp') emped = true; else if (key === 'nuke') nuked = true; else shelled = true;
        if (onInfo) onInfo({ type: key, side: isAtt ? ATTACKER : DEFENDER });
    };

    // Commit `unit` as the new in-hand unit for `me`; returns the new in-hand unit index.
    const commit = (me, myLast, enemyLast, unit) => {
        const isAtt = me === A;
        if (unit >= 0 && isSingleUse(unit)) {
            fire(unit, isAtt);
            me.units.subtract(unit, 1);       // single-use units are spent immediately
        }
        if (myLast >= 0 && !isSingleUse(myLast)) {
            if (myLast === RULER && onInfo) onInfo({ type: 'ruler', side: isAtt ? ATTACKER : DEFENDER, by: enemyLast });
            me.units.subtract(myLast, 1);
        }
        return unit >= 0 ? unit : myLast;
    };

    const damageAgainst = (unit, uField, enemy, eField, prev) => {
        let d = damage(unit, uField, eField);
        if (isRanged(unit) && enemy.towerType != null) d = TOWER[enemy.towerType].rangedDamage(d);
        let fin = finiteDamage(d);

        if (prev * -dir > 1073741823) fin = Math.min(fin, 1000);
        return fin * dir;
    };

    for (const fld of [1, 0]) {
        // Pick the next unit of exactly this field. `anyAir` lets a shield follow an airborne
        // group (its Field is the group's field).
        const pick = (me, last, anyAir) => {
            const t = me.towerType;
            for (const [u, c] of unusedUnits(me, last)) {
                const overflow = t != null && c > me.units.capacity(u, t);
                const uf = field(u, overflow, t == null, anyAir);
                if (uf === fld) return [u, uf];
            }
            return null;
        };
        const nextUnit = (me, last) => {
            const n = pick(me, last, false);
            if (!n) return null;
            return fld === 1 ? pick(me, last, true) : n;
        };

        for (let guard = 0; guard < 4000; guard++) {
            let na = null, nd = null;
            if (dmg < 0) na = nextUnit(A, lastA);
            else if (dmg > 0) nd = nextUnit(D, lastD);
            else {
                const a = nextUnit(A, lastA), d = nextUnit(D, lastD);
                if (d) nd = d; else na = a;
            }
            if (na) {
                lastA = commit(A, lastA, lastD, na[0]);
                dmg += damageAgainst(na[0], na[1], D, fld, dmg);
            } else if (nd) {
                lastD = commit(D, lastD, lastA, nd[0]);
                dmg += damageAgainst(nd[0], nd[1], A, fld, dmg);
            } else break;
        }
    }

    // One side has run dry. Spend the last unit so exactly one combatant ends up empty.
    const firstOf = (c, last) => { const u = unusedUnits(c, last); return u.length ? u[0][0] : -1; };
    const na = firstOf(A, lastA), nd = firstOf(D, lastD);
    for (const side of (nd >= 0 ? [ATTACKER, DEFENDER] : [DEFENDER, ATTACKER])) {
        if (side === ATTACKER && dmg <= 0 && na >= 0) {
            dmg += damageAgainst(na, 0, D, 0, dmg);
            lastA = commit(A, lastA, lastD, na);
        } else if (side === DEFENDER && dmg >= 0 && nd >= 0) {
            dmg += damageAgainst(nd, 0, A, 0, dmg);
            lastD = commit(D, lastD, lastA, nd);
        }
    }

    if (A.units.isAlive() || (A.towerType != null && dmg >= 0)) return ATTACKER;
    if (D.units.isAlive() || (D.towerType != null && dmg <= 0)) return DEFENDER;
    return 0;
}

const FORCE_FUEL = 150;
const RANK = { immobile: 0, slow: 1, normal: 2, fast: 3 };

function forceSpeed(units) {
    const choppers = units.get(CHOPPER);

        for (const [u, c] of units.counts()) weight += (UNITS[u].weight || 0) * c;
        const maxWeight = choppers * 4;
        if (weight <= maxWeight) return 'fast';
        let slowWeight = 0;
        for (const [u, c] of units.counts()) {
            if (RANK[speed(u, null)] < RANK.normal) slowWeight += (UNITS[u].weight || 0) * c;
        }
        return slowWeight <= maxWeight ? 'normal' : 'slow';
    }
    let worst = 3;
    for (const [u] of units.counts()) worst = Math.min(worst, RANK[speed(u, null)]);

    get nextDestination() { return this.path[Math.min(this.idx + 1, this.path.length - 1)]; }
    // Advance one tick. Only the *final* leg counts as an arrival: while a force travels it is
    // also the live copy of its supply line, and the stops in between are checkpoints.
    tick() {
        if (this.parked) {
            if (this.reported) return false;
            this.reported = true;
            return true;
        }
        this.progress += progressPerTick(this.units);
        if (this.progress < this.required) return false;
        this.progress = 0;
        this.idx += 1;
        this.slow = 1;                     // the penalty belongs to the departure
        if (!this.isLast) {
            if (this.units.isMany()) this.fuel -= 1;
            return false;
        }
        this.parked = true;                // arrived: stay put until the tower moves it on
        return true;
    }
    advance() {
        this.progress += progressPerTick(this.units);
        return this.progress >= this.required;
    }
    halt() { this.path = this.path.slice(0, this.idx + 2); }
    position(t = 0) {
        if (!this.source || !this.destination) return [0, 0];
        const a = integerPosition(this.source.x, this.source.y);
        const b = integerPosition(this.destination.x, this.destination.y);
        const f = Math.min(1, (this.progress + t * progressPerTick(this.units)) / Math.max(1, this.required));
        return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
    }
}

function makeForce(owner, units, path) { return new Force(owner, units, path); }

//
// Fog of war, ported from Kiomet's client/src/visible.rs: a tower sees `sensor_radius` world
// units around itself, the union of your towers' sensors is visible, and an inactive tower
// (upgrading or EMP'd) sees no further than a mine.




const RAD = 5;                  // world units per cell
const REF_RADIUS = 15;          // widest sensor radius, in cells (satellite = 30 world units)

class Visibility {
    constructor() {
        this.stamp = new Uint32Array(WORLD_SIZE * WORLD_SIZE);
        this.gen = 0;
        this.lastVersion = -1;
        this.dirty = true;
    }

    invalidate() { this.dirty = true; }

    // union of every sensor you own
    update(game, playerId, allVisible) {
        if (allVisible) { this.gen += 1; return; }
        if (!this.dirty && this.lastVersion === game.towers.version && this.lastPlayer === playerId) return;
        this.gen += 1;
        const g = this.gen;
        this.lastVersion = game.towers.version;
        this.lastPlayer = playerId;
        this.dirty = false;
        for (const t of game.towers.values()) {
            if (t.owner !== playerId) continue;
            this.stampArea(t, g);
        }
    }

    // `Tower::active()` false -> sensor falls back to a mine's (the client does the same)
    radiusOf(t) {
        const type = t.delay > 0 ? 'Mine' : t.type;
        return TOWER[type].sensor / RAD;
    }

    stampArea(t, g) {
        const r = this.radiusOf(t);
        const r2 = r * r;
        const x0 = Math.round(t.x), y0 = Math.round(t.y);
        for (let dy = -REF_RADIUS; dy <= REF_RADIUS; dy++) {
            const y = y0 + dy;
            if (y < 0 || y >= WORLD_SIZE) continue;
            const row = y * WORLD_SIZE;
            for (let dx = -REF_RADIUS; dx <= REF_RADIUS; dx++) {
                const x = x0 + dx;
                if (x < 0 || x >= WORLD_SIZE) continue;
                if (dx * dx + dy * dy > r2) continue;
                this.stamp[row + x] = g;
            }
        }
    }

    // Merge another player's sensors (allies share sight, like the client's union).
    addAllies(game, allies) {
        if (!allies || !allies.size) return;
        const g = this.gen;
        for (const t of game.towers.values()) {
            if (t.owner != null && allies.has(t.owner)) this.stampArea(t, g);
        }
    }

    // Cheap "is this world point inside your sight" for events that are not tied to a tower.
    near(wx, wy, game) {
        const cx = Math.round(wx / RAD), cy = Math.round(wy / RAD);
        for (let dy = -6; dy <= 6; dy++) {
            for (let dx = -6; dx <= 6; dx++) {
                const t = game.tower(cx + dx, cy + dy);
                if (!t) continue;
                const d = Math.hypot(t.x * RAD - wx, t.y * RAD - wy);
                if (d <= this.radiusOf(t) * RAD) return true;
            }
        }
        return false;
    }

    visible(t) {
        if (!t) return false;
        if (this.gen === 0) return false;
        return this.stamp[t.y * WORLD_SIZE + t.x] === this.gen;
    }
}

//
// The world: tower tick loop, forces, upgrades, spawning, scoring.
// Ported from Kiomet common/src/chunk.rs, common/src/chunk/event.rs,
// common/src/chunk/maintenance.rs, server/src/world.rs, server/src/service.rs.






const key = (x, y) => y * WORLD_SIZE + x;
const kOf = (id) => key(id.x, id.y);

class Tower {
    constructor(x, y, type) {
        this.x = x; this.y = y;
        this.type = type;
        this.owner = null;
        this.units = new Units();
        this.delay = 0;
        this.inbound = [];
        this.outbound = [];
        this.supply = null;
        this.flash = 0;
        this.hit = 0;
    }
    get active() { return this.delay === 0; }
    get id() { return { x: this.x, y: this.y }; }
    get canDestroy() { return this.inbound.length === 0 && this.owner === null; }
    forceUnits() { return this.units.forceUnits(this.type); }
    takeForceUnits() {
        const f = this.forceUnits();
        for (const [u, c] of f.counts()) this.units.subtract(u, c);
        return f;
    }
    unitGeneration(u) {
        if (u !== SHIELD && this.units.hasRuler()) return null;
        return TOWER[this.type].genPeriod(u);
    }
    generatesMobile() {
        return UNITS.some((_, u) => isMobile(u, this.type) && this.unitGeneration(u) != null);
    }
    setOwner(owner) {
        if (this.owner === owner) return;
        if (this.owner !== null) this.supply = null;
        this.owner = owner;
    }
}

class Player {
    constructor(id, name, opts = {}) {
        this.id = id;
        this.name = name;
        this.alive = false;
        this.bot = !!opts.bot;
        this.allies = new Set();
        this.newAllies = new Set();
        this.towers = new Set();
        this.score = 0;
        this.towerCounts = {};
        this.rulerKey = null;
        this.deathReason = null;
        this.spawnCooldown = 0;
        this.rank = opts.rank || 0;
        this.botState = {
            ambition: 8 + Math.floor(Math.random() * 5),
            war: null,
            quitAt: 0,
        };
    }
}

class Game {
    constructor(opts = {}) {
        this.time = 0;
        this.towers = new TowerIndex();
        this.players = [];
        this.forces = [];
        this.events = [];
        this.shrink = opts.shrink !== false;
        this.noShrink = opts.shrink === false;
        this.onEvent = opts.onEvent || null;
        this.botUpdate = opts.botUpdate || null;
        this.hostileAt = TICK_HZ * 60 * 8;
        buildConnectivity();
    }

    tower(x, y) { return this.towers.get(key(x, y)); }
    getTower(id) { return this.towers.get(key(id.x, id.y)); }
    ensureTower(id) {
        let t = this.getTower(id);
        if (!t) {
            t = new Tower(id.x, id.y, towerTypeAt(id.x, id.y));
            this.towers.set(key(id.x, id.y), t);
        }
        return t;
    }

    info(ev) {
        this.events.push(ev);
        if (this.onEvent) this.onEvent(ev);
        if (this.events.length > 600) this.events.splice(0, 300);
    }

    // ---------------- spawning ----------------
    findSpawn() {
        let searchRadius = Math.floor(Math.sqrt(100 / Math.PI));
        for (let i = 0; i < 200000; i++) {
            const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * searchRadius;
            const x = Math.max(0, Math.min(WORLD_SIZE - 1, Math.floor(CENTER.x + Math.cos(a) * r + 0.5)));
            const y = Math.max(0, Math.min(WORLD_SIZE - 1, Math.floor(CENTER.y + Math.sin(a) * r + 0.5)));
            const id = { x, y };
            if (this.isSpawnable(id)) return id;
            if (i % 8 === 0) searchRadius += 1;
        }
        return null;
    }

    isSpawnable(id) {
        return isSpawnablePosition(id) && this.isGoodSpawn(id) && this.isSafeSpawn(id);
    }

    typeAtOrGenerated(id) {
        const t = this.getTower(id);
        if (t) return t.owner !== null ? null : t.type;
        return towerTypeAt(id.x, id.y);
    }

    isGoodSpawn(id) {
        const tt = this.typeAtOrGenerated(id);
        if (!tt) return false;
        let n = 0, spawnableN = 0;
        for (const nb of neighbors(id.x, id.y)) {
            const nt = this.typeAtOrGenerated(nb);
            if (!nt) return false;
            n += 1;
            if (SPAWNABLE.some((s) => s.name === nt)) spawnableN += 1;
        }
        return (SPAWNABLE.some((s) => s.name === tt) && n >= 3) || spawnableN >= 2;
    }

    isSafeSpawn(id) {
        const seen = new Set([key(id.x, id.y)]);
        let frontier = [id];
        for (let d = 0; d < 4; d++) {
            const next = [];
            for (const t of frontier) {
                for (const nb of neighbors(t.x, t.y)) {
                    const k = key(nb.x, nb.y);
                    if (seen.has(k)) continue;
                    seen.add(k);
                    const tw = this.towers.get(k);
                    if (tw && (tw.owner !== null || tw.inbound.length > 0)) return false;
                    next.push(nb);
                }
            }
            frontier = next;
        }
        return seen.size >= 12;
    }

    bubble(origin, radius, fn) {
        const seen = new Set([key(origin.x, origin.y)]);
        const queue = [origin];
        const r2 = radius * radius;
        fn(origin);
        for (let i = 0; i < queue.length; i++) {
            const t = queue[i];
            for (const nb of neighbors(t.x, t.y)) {
                if (distanceSquared(nb, origin) > r2) continue;
                const k = key(nb.x, nb.y);
                if (seen.has(k)) continue;
                seen.add(k);
                queue.push(nb);
                fn(nb);
            }
        }
    }

    // Generate towers from `id` along the connectivity path towards the world center.
    traverse(id, out) {
        let cur = id;
        for (let i = 0; i < 4000; i++) {
            if (this.getTower(cur)) return;
            const k = key(cur.x, cur.y);
            if (out.has(k)) return;
            out.set(k, cur);
            const parent = connectivity(cur);
            if (!parent) return;
            if (parent.x === cur.x && parent.y === cur.y) return;
            cur = parent;
        }
    }

    spawnPlayer(player) {
        const id = this.findSpawn();
        if (!id) return false;
        const radius = player.bot ? 35 : 50;
        const toGen = new Map();
        this.bubble(id, radius, (t) => this.traverse(t, toGen));
        for (const t of toGen.values()) this.ensureTower(t);

        const t = this.ensureTower(id);
        t.units = new Units();
        t.supply = null;
        t.delay = 0;
        t.setOwner(player.id);
        player.alive = true;
        player.deathReason = null;
        player.score = 0;
        player.towers = new Set([key(id.x, id.y)]);
        this.info({ type: 'gained', tower: id, player: player.id });

        t.units.add(RULER, 1, t.type, true);
        t.units.add(SHIELD, 255, t.type, true);

        const rank = player.rank || 0;
        for (const unit of [SOLDIER, FIGHTER]) {
            const soldiers = new Units();
            soldiers.add(unit, unit === FIGHTER ? 2 : rank >= 2 ? 8 : 4);
            soldiers.add(SHIELD, 15);
            for (const nb of neighbors(id.x, id.y)) {
                this.sendForce(t, new Force(player.id, soldiers.clone(), [id, nb]));
            }
            if (rank < 5) break;
        }
        for (const nb of neighbors(id.x, id.y)) {
            const n = this.getTower(nb);
            if (n && n.owner === null) n.units = new Units();
        }
        return true;
    }

    // ---------------- actions ----------------
    sendForce(from, force) {
        force.host = null;
        // The King's high morale: forces leaving his tower (or a neighbour's) march slower.
        if (from && from.owner != null && this.inMorale(from, from.owner)) {
            force.slow = RULER_MARCH_MULT;
        }
        this.forces.push(force);
        from.outbound.push(force);
        const dst = this.ensureTower(force.destination);
        if (dst) { dst.inbound.push(force); force.host = dst; }
        return force;
    }

    deploy(playerId, fromId, path) {
        const t = this.getTower(fromId);
        if (!t || t.owner !== playerId) return 'source not owned';
        const strength = t.forceUnits();
        if (strength.isEmpty()) return 'empty force';
        const err = this.validatePath(path, fromId, strength.maxEdgeDistance());
        if (err) return err;
        this.sendForce(t, new Force(playerId, t.takeForceUnits(), this.canonicalPath(path)));
        return null;
    }

    // Paths travel through the UI as bare {x,y}; everywhere inside the engine they must be the
    // very Tower objects the map holds (its roads mutate them).
    canonicalPath(path) {
        return path.map((p) => this.getTower(p) || p);
    }

    validatePath(path, fromId, maxEdge) {
        if (!path || path.length < 2) return 'path too short';
        if (maxEdge != null && path.length !== 2) return 'path too long';
        if (maxEdge == null && path.length > 16) return 'path too long';
        if (path[0].x !== fromId.x || path[0].y !== fromId.y) return 'source mismatch';
        for (let i = 1; i < path.length; i++) {
            const prev = path[i - 1], next = path[i];
            if (prev.x === next.x && prev.y === next.y) return 'duplicate tower';
            if (maxEdge != null) {
                if (distanceSquared(prev, next) > (maxEdge + 1) ** 2 - 1) return 'edge too long';
            } else if (!neighbors(prev.x, prev.y).some((n) => n.x === next.x && n.y === next.y)) {
                return 'not neighbor';
            }
            if (!this.getTower(next)) return 'not generated';
        }
        return null;
    }

    setSupplyLine(playerId, fromId, path) {
        const t = this.getTower(fromId);
        if (!t || t.owner !== playerId) return 'source not owned';
        if (!t.generatesMobile()) return 'invalid supply line';
        if (path) {
            const err = this.validatePath(path, fromId, TOWER[t.type].rangedDist);
            if (err) return err;
            if (t.supply && samePath(t.supply, path)) path = null;
        }
        t.supply = path ? this.canonicalPath(path) : null;
        return null;
    }

    upgradeTower(playerId, id, type) {
        const t = this.getTower(id);
        if (!t) return 'no tower';
        if (t.owner !== playerId) return 'not owned';
        if (!t.active) return 'upgrade pending';
        const next = TOWER[type];
        if (!next) return 'bad type';
        const cur = TOWER[t.type];
        if (cur.upgrades.includes(type)) {
            if (!meetsPrereqs(type, this.players[playerId].towerCounts)) return 'missing prerequisite';
        } else if (cur.basis !== type) return 'invalid upgrade path';

        t.type = type;
        t.delay = Math.max(1, Math.round(next.delay * TICK_HZ));
        t.units.reconcile(type, t.owner !== null);
        if (t.supply && !t.generatesMobile()) t.supply = null;
        this.info({ type: 'upgrade', tower: id, player: playerId, towerType: type });
        return null;
    }

    towerType(t) { return TOWER[t.type]; }

    breakAlliance(a, b) {
        const pa = this.players[a], pb = this.players[b];
        if (pa) pa.allies.delete(b);
        if (pb) pb.allies.delete(a);
        this.info({ type: 'alliance', a, b, on: false });
    }

    // Accept/decline an alliance request. `request` is one-sided until both agree.
    requestAlliance(a, b) {
        const pa = this.players[a], pb = this.players[b];
        if (!pa || !pb || a === b) return 'bad player';
        if (pa.allies.has(b) && pb.allies.has(a)) { this.breakAlliance(a, b); return null; }
        const mutual = pa.allies.has(b) || pb.allies.has(a);
        pa.allies.add(b);
        if (mutual) {
            pb.allies.add(a);
            for (const x of [a, b]) this.players[x].newAllies.add(x === a ? b : a);
            this.info({ type: 'alliance', a, b, on: true });
        } else {
            this.info({ type: 'allianceRequest', from: a, to: b });
        }
        return null;
    }

    // A* over roads. Prefers own territory, avoids enemy and zombie towers.
    findBestPath(src, dst, maxEdge, playerId) {
        if (maxEdge != null) {
            const d2 = (src.x - dst.x) ** 2 + (src.y - dst.y) ** 2;
            if (d2 <= (maxEdge + 1) ** 2 - 1) return [src, dst];
            return null;
        }
        const dstTower = this.getTower(dst);
        const dstOwner = dstTower ? dstTower.owner : null;
        const keyOf = (id) => id.y * WORLD_SIZE + id.x;
        const start = keyOf(src), goal = keyOf(dst);
        const gScore = new Map([[start, 0]]);
        const cameFrom = new Map();
        const open = [[0, start]];
        const idOf = new Map([[start, src], [goal, dst]]);
        const heur = (id) => Math.floor(Math.sqrt((id.x - dst.x) ** 2 + (id.y - dst.y) ** 2) * 256);
        let budget = 3000;
        while (open.length && budget-- > 0) {
            let bi = 0;
            for (let i = 1; i < open.length; i++) if (open[i][0] < open[bi][0]) bi = i;
            const [f, cur] = open.splice(bi, 1)[0];
            if (cur === goal) break;
            const curId = idOf.get(cur);
            for (const nb of neighbors(curId.x, curId.y)) {
                const nk = keyOf(nb);
                const t = this.towers.get(nk);
                if (!t) continue;
                const allyPass = t.owner !== null && t.owner !== dstOwner && this.haveAlliance(playerId, t.owner);
                if (allyPass) continue;
                const cost = Math.floor(Math.sqrt(distanceSquared(curId, nb)) * 256);
                const tentative = gScore.get(cur) + cost;
                if (tentative < (gScore.get(nk) ?? Infinity)) {
                    gScore.set(nk, tentative);
                    cameFrom.set(nk, cur);
                    idOf.set(nk, nb);
                    let h = heur(nb);
                    if (t.owner === playerId) h += 2 * 256;
                    else if (t.owner !== null || !t.units.isEmpty()) h += 32 * 256;
                    open.push([tentative + h, nk]);
                }
            }
        }
        if (!cameFrom.has(goal)) return null;
        const path = [dst];
        let cur = goal;
        while (cur !== start) {
            cur = cameFrom.get(cur);
            const id = idOf.get(cur);
            if (!id) return null;
            path.push(id);
        }
        path.reverse();
        return path.length >= 2 ? path : null;
    }

    // ---------------- tick ----------------
    tick() {
        this.time += 1;
        const tick = this.time;

        for (const p of this.players) p.newAllies.clear();

        // Halt forces whose remaining path crosses a brand new ally or a destroyed tower.
        for (const t of this.towers.values()) {
            if (t.inbound.length) {
                for (const f of t.inbound) {
                    if (f.owner === null) continue;
                    if (!this.pathHalted(f)) continue;
                    // Halt without rewriting the path object that every holder already shares:
                    // the force simply stops at its current destination (`Force.halted()`).
                    f.parked = true;
                }
            }
            // NOTE: supply lines are deliberately *not* pruned here. A force leaving a tower is
            // both a traveller and the supply line's live copy, so truncating the shared path
            // would strand it mid-route. They are cleared on capture and on upgrade instead.
        }

        for (const t of this.towers.values()) this.tickTower(t, tick);

        // Nothing should be able to orphan a force; if something does, retire it instead of
        // letting it drift around the map forever.
        if (tick % 8 === 0 && this.forces.length > 32) {
            const wanted = new Set();
            for (const t of this.towers.values()) {
                for (const f of t.inbound) wanted.add(f);
                for (const f of t.outbound) wanted.add(f);
            }
            for (const f of this.forces.slice()) if (!wanted.has(f)) this.removeForce(f);
        }

        for (const p of this.players) if (p.alive) this.recomputePlayer(p);
        if (tick % 2 === 0) {
            for (const p of this.players) if (p.alive && p.bot && this.botUpdate) this.botUpdate(this, p);
        }
        if (tick % (TICK_HZ * 2) === 0) this.checkDeaths();
        if (tick % (TICK_HZ * 10) === 0 && this.shrink) this.shrinkWorld();
        if (this.debugBombers && tick % (TICK_HZ * 60 * 4) === 0) this.hostiles();
    }

    pathHalted(f, start = 2) {
        if (!f.path) return true;
        for (let i = Math.max(0, f.idx + start); i < f.path.length; i++) {
            if (!f.path[i]) return true;
            const t = this.getTower(f.path[i]);
            if (!t) return true;
            if (f.owner != null && t.owner != null && t.owner !== f.owner &&
                this.haveAlliance(f.owner, t.owner)) return true;
        }
        return false;
    }

    haveAlliance(a, b) {
        if (a === b || a == null || b == null) return false;
        const pa = this.players[a], pb = this.players[b];
        return !!pa && !!pb && pa.allies.has(b) && pb.allies.has(a);
    }

    relationship(a, b) {
        if (a === b) return 'comrade';
        if (this.haveAlliance(a, b)) return 'ally';
        return 'enemy';
    }

    tickTower(t, tick) {
        const owner = t.owner;
        const period = owner !== null ? 30 : 10;

        let deploy = false;
        if (tick % (period * TICK_HZ) === 0) {
            const diminished = this.diminish(t);
            deploy = diminished !== 0 && t.active;
        }

        if (t.delay > 0) {
            t.delay -= 1;
        } else if (owner !== null) {
            const tt = TOWER[t.type];
            // High morale: the King's tower and its eight neighbours produce twice as fast,
            // which is the same as making two every period they would normally make one.
            const morale = this.inMorale(t, owner) ? MORALE_GEN_DIVISOR : 1;
            for (const name in tt.gen) {
                const u = tt.genUnitId(name);
                const due = tick % (tt.gen[name] * TICK_HZ) === 0;
                for (let rep = 0; due && rep < morale; rep++) {
                    {
                        const added = t.units.add(u, 2, t.type, false);
                        t.units.subtract(u, Math.max(0, added - 1));
                        if (isMobile(u, t.type) && added < 2) deploy = true;
                    }
                }
            }
        } else if (TOWER[t.type].down && tick % (60 * TICK_HZ) === 0) {
            t.type = TOWER[t.type].down;
            t.units.reconcile(t.type, false);
        }

        if (deploy && !t.units.hasRuler() && t.supply && t.owner !== null) {
            const fu = t.forceUnits();
            if (!fu.isEmpty()) {
                const med = fu.maxEdgeDistance();
                if (med >= TOWER[t.type].rangedDist) {
                    this.sendForce(t, new Force(t.owner, t.takeForceUnits(),
                        t.supply.map((p) => ({ x: p.x, y: p.y }))));
                }
            }
        }

        if (t.inbound.length && t.outbound.length) this.collideForces(t);

        if (t.inbound.length) {
            // Iterate a snapshot: arriving forces can re-enter `t.inbound` (e.g. the tower below
            // loses its last defender to a king and the king starts living inside it).
            const finished = [], stepped = [];
            for (const f of t.inbound.slice()) {
                if (f.parked) { finished.push(f); continue; } // arrived (or parked by a halt)
                if (!f.tick()) continue;
                if (f.isLast) { finished.push(f); continue; } // final leg completed
                stepped.push(f);
            }
            // Intermediate checkpoints: keep walking the same road towards the real target.
            for (const f of stepped) {
                f.parked = false;
                f.reported = false;
                const at = t.inbound.indexOf(f);
                if (at >= 0) t.inbound.splice(at, 1);
                const dst = this.ensureTower(f.nextDestination);
                if (dst && !dst.inbound.includes(f)) { dst.inbound.push(f); f.host = dst; }
            }
            for (const f of finished) {
                const at = t.inbound.indexOf(f);
                if (at >= 0) t.inbound.splice(at, 1);
                this.arrive(t, f);
            }
        }

        if (t.outbound.length) {
            t.outbound = t.outbound.filter((f) => {
                // A halted force sits at its destination until it expires.
                const req = Math.max(1, f.required);
                const step = f.path.length === 2 ? 1 : progressPerTick(f.units);
                f.progress = Math.min(f.progress + step, req);
                f.host = null;             // the shadow is done; a force is retired only on arrival
                return f.progress < req;
            });
        }
        if (t.flash > 0) t.flash -= 1;
    }

    // True when the tower sits at or next to its owner's King (Kiomet's "high morale").
    inMorale(t, owner) {
        const p = this.players[owner];
        if (!p || p.rulerKey == null) return false;
        const rk = p.rulerKey;
        const king = this.towers.get(rk);
        if (!king || king.owner !== owner) return false;
        return Math.abs(t.x - (rk % WORLD_SIZE)) <= 1 && Math.abs(t.y - Math.floor(rk / WORLD_SIZE)) <= 1;
    }

    diminish(t) {
        let units = 0;
        for (let u = 0; u < UNITS.length; u++) {
            if (t.owner === null || t.units.get(u) > t.units.capacity(u, t.type)) {
                const sub = t.units.subtract(u, 1);
                if (isMobile(u, t.type)) units += sub;
            }
        }
        return units;
    }

    removeForce(f) {
        f.host = null;
        const i = this.forces.indexOf(f);
        if (i >= 0) this.forces.splice(i, 1);
    }

    collideForces(t) {
        for (const inb of t.inbound.slice()) {
            if (!t.inbound.includes(inb)) continue;
            for (const out of t.outbound.slice()) {
                if (out.destination.x !== inb.source.x || out.destination.y !== inb.source.y) continue;
                if (out.owner === inb.owner) continue;
                if (this.relationship(inb.owner, out.owner) !== 'enemy') continue;

                const reqA = progressRequired(inb.source, inb.destination);
                const reqB = progressRequired(out.source, out.destination);
                const a0 = (reqA - Math.min(reqA, inb.progress + progressPerTick(inb.units))) * reqB;
                const a1 = (reqA - inb.progress) * reqB;
                const b0 = out.progress * reqA;
                const b1 = Math.min(255, out.progress + progressPerTick(out.units)) * reqA;
                if (Math.max(a0, b0) > Math.min(a1, b1)) continue;

                const win = fight(new Combatants(inb.units), new Combatants(out.units),
                    (e) => this.info({ ...e, tower: inb.source }));
                if (win === DEFENDER) {
                    const i = t.inbound.indexOf(inb);
                    if (i >= 0) t.inbound.splice(i, 1);
                    this.removeForce(inb);
                    break;
                } else if (win === ATTACKER) {
                    const i = t.outbound.indexOf(out);
                    if (i >= 0) t.outbound.splice(i, 1);
                    this.removeForce(out);
                }
            }
        }
    }

    arrive(t, f) {
        f.host = null;                    // it is no longer on its way anywhere
        const tp = t.owner;
        const id = { x: t.x, y: t.y };

        if (tp !== null || !t.units.isEmpty()) {
            const fp = f.owner;
            const rel = this.relationship(tp, fp);
            const unfriendly = rel === 'enemy' || (rel === 'ally' && f.units.hasRuler());
            if (unfriendly) {
                let towerEmped = false;
                const winner = fight(new Combatants(f.units), new Combatants(t.units, t.type), (e) => {
                    if (e.type === 'emp' && e.side === ATTACKER) towerEmped = true;
                    if (e.type === 'ruler') {
                        // DeathReason::RulerKilled { alias, unit }: remember who and what
                        const victim = e.side === ATTACKER ? fp : tp;
                        const killer = e.side === ATTACKER ? tp : fp;
                        const vp = victim != null ? this.players[victim] : null;
                        if (vp) vp.deathReason = { killer, unit: e.by == null ? null : e.by };
                        this.info({ ...e, tower: id, killer });
                    } else {
                        this.info({ ...e, tower: id });
                    }
                });
                if (towerEmped) t.delay = Math.max(t.delay, EMP_TICKS);
                t.hit = 2;
                if (winner !== ATTACKER && fp !== null) this.info({ type: 'lostForce', player: fp, tower: id });
                if (winner !== DEFENDER) {
                    if (tp !== null) this.info({ type: 'lostTower', tower: id, player: tp });
                    const newOwner = (winner === ATTACKER && fp !== null) ? fp : null;
                    if (newOwner !== null) {
                        this.info({ type: 'gained', tower: id, player: newOwner, capturedFrom: tp });
                    }
                    if (tp !== null || newOwner !== null) t.setOwner(newOwner);
                    if (t.owner === null) {
                        while (TOWER[t.type].down) t.type = TOWER[t.type].down;
                        t.delay = 0;
                    }
                    t.flash = 3;
                }
            }
        } else if (f.owner !== null && f.units.isAlive()) {
            this.info({ type: 'gained', tower: id, player: f.owner });
            t.setOwner(f.owner);
            t.units.reconcile(t.type, t.owner !== null);
        }

        const rel = this.relationship(f.owner, t.owner);
        if (f.units.isEmpty()) {
            this.removeForce(f);
        } else if (f.fuel === 0) {
            if (f.owner !== null) this.info({ type: 'lostForce', player: f.owner, tower: id });
            this.removeForce(f);
        } else if (rel === 'comrade' && this.tryMoveOn(f, t)) {
            // keeps going along its own path
        } else if (rel === 'ally' && !f.units.hasRuler() && this.tryMoveOn(f, t, true)) {
            // handed off to the ally's supply line
        } else if (rel === 'comrade' || (rel === 'ally' && !f.units.hasRuler())) {
            t.units.addUnitsToTower(f.units, t.type, t.owner !== null);
            this.removeForce(f);
        } else if (f.units.get(RULER) > 0) {
            if (f.owner !== null) {
                this.info({ type: 'ruler', player: f.owner, side: ATTACKER, tower: id, killer: t.owner });
                const vp = this.players[f.owner];
                if (vp) vp.deathReason = { killer: t.owner, unit: null };
            }
            this.removeForce(f);
        } else {
            this.removeForce(f);
        }
    }

    tryMoveOn(f, t, fromAlly = false) {
        if (!fromAlly && !f.isLast) {
            f.progress = 0;
            if (f.units.isMany()) f.fuel -= 1;
            return true;
        }
        if (!t.supply || TOWER[t.type].rangedDist != null || !f.units.isMany()) return false;
        if (t.type === 'Projector') {
            const maxShield = TOWER.Projector.rawCap(SHIELD);
            const maxTransfer = Math.max(0, maxShield - f.units.get(SHIELD));
            if (maxTransfer > 0) f.units.add(SHIELD, t.units.subtract(SHIELD, maxTransfer));
        }
        if (f.units.get(CHOPPER)) {
            const initial = forceSpeed(f.units);
            const order = { immobile: 0, slow: 1, normal: 2, fast: 3 };
            for (const transfer of [SOLDIER, TANK]) {
                if (order.normal >= order[initial]) break;
                for (;;) {
                    if (t.units.get(transfer) === 0) break;
                    if (f.units.add(transfer, 1) === 0) break;
                    if (order[forceSpeed(f.units)] < order[initial]) { f.units.subtract(transfer, 1); break; }
                    t.units.subtract(transfer, 1);
                }
            }
        }
        f.path = t.supply.map((p) => this.getTower(p) || this.ensureTower(p));
        f.idx = 0;
        f.progress = 0;
        if (f.units.isMany()) f.fuel -= 1;
        const dst = this.ensureTower(f.destination);
        if (dst) { dst.inbound.push(f); f.host = dst; }
        return true;
    }

    // ---------------- bookkeeping ----------------
    recomputePlayer(p) {
        let score = 0;
        const counts = {};
        p.rulerKey = null;
        // Rebuild the holdings from the map so a tower can never be owned by `p` without
        // being in their set (capture, upgrade and death all mutate the map directly).
        const next = new Set();
        for (const [k, t] of this.towers) {
            if (t.owner !== p.id) continue;
            next.add(k);
            if (t.units.hasRuler()) p.rulerKey = k;
            if (!t.active) continue;
            score += TOWER[t.type].score;
            counts[t.type] = (counts[t.type] || 0) + 1;
        }
        p.towers = next;
        p.score = score;
        p.towerCounts = counts;
    }

    checkDeaths() {
        for (const p of this.players) {
            if (!p.alive) continue;
            let rulerSeen = false;
            for (const k of p.towers) {
                const t = this.towers.get(k);
                if (!t) continue;
                if (t.owner !== p.id) continue;
                if (t.units.hasRuler()) rulerSeen = true;
                for (const f of t.inbound) if (f.owner === p.id && f.units.hasRuler()) rulerSeen = true;
            }
            if (!rulerSeen) this.killPlayer(p);
        }
    }

    killPlayer(p) {
        if (!p.alive) return;
        p.alive = false;
        p.allies.clear();
        this.info({ type: 'died', player: p.id });
        for (const t of this.towers.values()) {
            if (t.owner === p.id) {
                t.units.subtract(RULER, 255);
                t.units.subtract(SHIELD, 255);
                t.setOwner(null);
                this.info({ type: 'lostTower', tower: t.id, player: p.id });
            }
            for (const list of [t.inbound, t.outbound]) {
                for (const f of list.slice()) {
                    if (f.owner === p.id) {
                        const i = list.indexOf(f);
                        if (i >= 0) list.splice(i, 1);
                        this.removeForce(f);
                    }
                }
            }
        }
        for (const q of this.players) q.allies.delete(p.id);
        p.towers.clear();
    }

    // Unclaimed towers slowly vanish, and with them the map nobody is using.
    shrinkWorld() {
        if (this.noShrink) return;
        const locked = new Set();
        for (const [k, t] of this.towers) {
            if (t.canDestroy) continue;
            locked.add(k);
            let cur = t.id;
            for (let i = 0; i < 400; i++) {
                const p = connectivity(cur);
                if (!p) break;
                const pk = key(p.x, p.y);
                if (locked.has(pk)) break;
                locked.add(pk);
                cur = p;
            }
            if (t.units.hasRuler()) {
                this.bubble(t.id, 12, (id) => locked.add(key(id.x, id.y)));
            }
        }
        const remove = [];
        let count = 0;
        for (const [k, t] of this.towers) {
            count += 1;
            if (!locked.has(k) && t.canDestroy) remove.push(k);
        }
        // Never let the visible map get smaller than a reasonable play area.
        if (count - remove.length < Math.max(600, this.players.length * 150)) return;
        for (const k of remove) this.towers.delete(k);
    }

    // Over budget: two bombers from the world centre, exactly like Kiomet's summoned debug
    // players, kept behind an explicit opt-in so normal games stay untouched.
    hostiles() {
        if (!this.debugBombers || !this.towers.size) return;
        const keys = Array.from(this.towers.keys());
        this.ensureTower(CENTER);
        for (let i = 0; i < 2; i++) {
            const t = this.towers.get(keys[Math.floor(Math.random() * keys.length)]);
            if (!t || t.owner !== null) continue;
            const u = new Units();
            u.add(BOMBER, 5);
            const from = connectivity(t.id) || CENTER;
            this.sendForce(this.getTower(CENTER), new Force(null, u, [from, t.id]));
        }
    }
}

function samePath(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i].x !== b[i].x || a[i].y !== b[i].y) return false;
    return true;
}

// SPDX-FileCopyrightText: 2026 Kiomet clone contributors

//
// A tower AI modelled on Kiomet's server/src/bot.rs: every update it looks at one of its
// towers, upgrades it if the shields are banked, and sends its mobile units at the most
// promising reachable target — the enemy it is currently fighting, or unclaimed ground.




function botUpdate(game, player) {
    if (!player.alive) return;
    const bot = player.botState;

    // Bots retire after a while, like Kiomet's, so the map makes room for humans.
    if (!bot.quitAt) bot.quitAt = game.time + 4 * 60 * (30 + Math.random() * 60);
    if (game.time > bot.quitAt) { game.killPlayer(player); return; }

    const mine = [...player.towers].map((k) => game.towers.get(k)).filter((t) => t && t.owner === player.id);
    if (!mine.length) return;

    // ---- what are we fighting? the nearest enemy touching our land
    let target = null, targetDist = Infinity, enemyTower = null;
    for (const t of mine) {
        for (const nb of nearTowers(game, t, 3)) {
            if (nb.owner == null || nb.owner === player.id) continue;
            if (game.haveAlliance(player.id, nb.owner)) continue;
            const d = distanceSq(t, nb);
            if (d < targetDist) { targetDist = d; target = nb.owner; enemyTower = nb; }
        }
    }

    // The king runs for safety when his tower is about to fall.
    const king = mine.find((t) => t.units.hasRuler());
    if (king && king.active && kingIsThreatened(game, player, king)) {
        evacuateKing(game, player, king);
        return;
    }

    // ---- upgrade a tower with plenty of shields
    const upgradable = mine.filter((t) => t.active && t.units.get(SHIELD) >=
        Math.floor(t.units.capacity(SHIELD, t.type) / (target != null ? 1 : 2)));
    if (upgradable.length && Math.random() < 0.6) {
        upgrade(game, player, upgradable[Math.floor(Math.random() * upgradable.length)]);
    }

    // ---- send a force. Never gamble with the king.
    const withUnits = mine.filter((t) => !t.units.hasRuler() && !t.forceUnits().isEmpty());
    if (!withUnits.length) return;
    const src = withUnits[Math.floor(Math.random() * withUnits.length)];

    const strength = src.forceUnits();
    // Kiomet's bot calls any force of 5+ ground damage "formidable"; below that it only
    // occasionally bothers, which is far too timid for an offline map of this size.
    const formidable = strength.forceGroundDamage() >= 2;
    if (!formidable && Math.random() > 0.25) return;
    const maxEdge = strength.maxEdgeDistance();

    const candidates = [];
    for (const dst of nearTowers(game, src, 8)) {
        if (dst === src) continue;
        if (maxEdge != null && distanceSq(src, dst) > (maxEdge + 1) ** 2 - 1) continue;
        if (dst.owner === player.id) {
            // Reinforce: only if it shortens the way to the enemy.
            if (!enemyTower) continue;
            if (distanceSq(enemyTower, dst) >= distanceSq(enemyTower, src)) continue;
            if (dst.units.get(SHIELD) < 5) continue;
        } else if (dst.owner == null) {
            // Unclaimed land is always worth taking.
        } else if (game.haveAlliance(player.id, dst.owner)) {
            continue;
        } else if (target != null && dst.owner !== target) {
            continue;                     // one theatre at a time
        } else if (!formidable) {
            continue;                     // a token force shouldn't poke a garrison
        }
        candidates.push(dst);
    }
    if (!candidates.length) return;

    const dst = candidates[Math.floor(Math.random() * candidates.length)];
    const path = game.findBestPath(src, dst, maxEdge, player.id);
    if (!path) return;
    if (src.generatesMobile() && dst.generatesMobile() && Math.random() < 0.25 &&
        game.setSupplyLine(player.id, src, path) == null) return;
    game.deploy(player.id, src, path);
}

// Towers within `radius` tower cells (the bubble radius is in world units: 5 per cell).
function nearTowers(game, src, radius) {
    const out = [];
    game.bubble(src.id, radius * 5, (id) => {
        const t = game.getTower(id);
        if (t) out.push(t);
    });
    return out;
}

function distanceSq(a, b) {
    return (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
}

function upgrade(game, player, t) {
    if (!t.active) return;
    const opts = TOWER[t.type].upgrades.filter((u) => meetsPrereqs(u, player.towerCounts));
    if (!opts.length) return;
    game.upgradeTower(player.id, t, opts[Math.floor(Math.random() * opts.length)]);
}

function kingIsThreatened(game, player, king) {
    const armed = king.inbound.filter((f) => f.owner !== player.id &&
        game.relationship(player.id, f.owner) === 'enemy');
    if (!armed.length) return false;
    return armed.reduce((n, f) => n + f.units.forceGroundDamage(), 0) > king.units.get(SHIELD);
}

function evacuateKing(game, player, king) {
    let best = null;
    for (const nb of neighbors(king.x, king.y)) {
        const t = game.getTower(nb);
        if (!t || t.owner !== player.id || !t.active) continue;
        if (!best || t.units.get(SHIELD) > best.units.get(SHIELD)) best = t;
    }
    if (!best) return;
    game.deploy(player.id, king, [king.id, best.id]);
}

// ---- render.js ----
// SPDX-FileCopyrightText: 2026 Kiomet clone contributors
